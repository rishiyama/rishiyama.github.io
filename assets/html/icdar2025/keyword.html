        <button id="kw-go">Search</button>
        <button id="kw-clear">Clear</button>
      </div>
      <div id="kw-search-hint">case-insensitive, space-separated = OR</div>
    </div>
    <script>
      (function () {
        // pyvis テンプレートの変数を利用（nodes: vis.DataSet, network: vis.Network）
        if (typeof nodes === "undefined" || typeof network === "undefined") return;

        // 初期色を保存（id->color）
        const originalColors = {};
        nodes.forEach((n) => {
          originalColors[n.id] = n.color || "#1f77b4";
        });

        function resetColors() {
          const updates = [];
          nodes.forEach((n) => {
            updates.push({ id: n.id, color: originalColors[n.id], borderWidth: 1 });
          });
          nodes.update(updates);
          network.unselectAll();
        }

        function highlightMatches(query) {
          const terms = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
          if (terms.length === 0) {
            resetColors();
            return;
          }

          const updates = [];
          const matchedIds = [];
          nodes.forEach((n) => {
            const label = String(n.label || "").toLowerCase();
            const hit = terms.some((t) => label.includes(t));
            if (hit) {
              matchedIds.push(n.id);
              updates.push({ id: n.id, color: "#ffd92f", borderWidth: 3 }); // 黄でハイライト
            } else {
              updates.push({ id: n.id, color: originalColors[n.id], borderWidth: 1 });
            }
          });
          nodes.update(updates);

          if (matchedIds.length > 0) {
            // 最初の一致にフォーカス
            network.selectNodes([matchedIds[0]], false);
            network.focus(matchedIds[0], { scale: 1.2, animation: { duration: 600, easingFunction: "easeInOutQuad" } });
          }
        }

        document.getElementById("kw-go").addEventListener("click", function () {
          const q = document.getElementById("kwq").value || "";
          highlightMatches(q);
        });
        document.getElementById("kwq").addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            highlightMatches(e.target.value || "");
          }
        });
        document.getElementById("kw-clear").addEventListener("click", function () {
          document.getElementById("kwq").value = "";
          resetColors();
        });
      })();
    </script>
