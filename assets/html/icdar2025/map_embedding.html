ive. By analyzing spoken content and matching it with textual or graphical elements in the slides, our approach ensures better synchronization between what you hear and what you need to attend to. We explore different ways of solving this problem and assess their success and failure cases. Analyzing multimedia documents is emerging as a key requirement for seamless understanding of content-rich videos, such as educational videos and conference talks, by reducing cognitive strain and improving comprehension. Code and dataset available at: https://github.com/meghamariamkm2002/Slide_Highlight .","Numerical reasoning in financial document analysis constitutes a fundamental challenge for corporate financial report understanding, drawing increasing attention in both academia and industry. However, current approaches suffer from semantic misalignment in multi-hierarchical tables, reasoning disruptions from insufficient integration of financial metric formulas, and sensitivity of the model\u2019s reasoning results to the order of evidence. To address these challenges, we propose a unified framework for knowledge-intensive numerical reasoning over financial documents. Within this framework, we introduce a Triplets-based Multi-Stage Tabular-Textual Hybrid Evidence Retrieval (THER) method to resolve semantic misalignment by converting multi-hierarchical tables into triplet representations. Furthermore, we propose the Fine Grained Knowledge Injected Chain-of-Thought (FGKI-CoT) method to enhance numerical reasoning by explicitly integrating financial conceptual formulas into the reasoning path. Building on FGKI-CoT, we introduce the Evidence Order Sampling based Self-Consistency (EOSC) method, which mitigates the model\u2019s sensitivity to evidence order by altering the input evidence sequence. Experiments demonstrate that our framework enables a 1.5B-parameter language model to outperform GPT-3.5-turbo by 3.95% in numerical reasoning on the Multihiertt Dev dataset. Additionally, we conduct supplementary experiments to further explore the impact of table representations and reasoning step expressions on the numerical reasoning performance of language models.","This paper proposes a novel deep learning-based multi-task approach designed to handle Sanskrit compound word splitting, a problem that poses significant challenges due to the complicated morphology of the language. The model is trained to jointly solve two closely related tasks: character-level segmentation location prediction and segmented word generation using a sequence-to-sequence model. The proposed architecture consists of two branches and relies on a shared character-level embedding layer combined with bidirectional LSTMs to effectively capture character-level contextual variations. Furthermore, each branch leverages the Multi-Head Attention mechanism, and experiments show that this mechanism improves character-level segmentation location prediction and guides the decoder when generating segmented words. Differently than state-of-the-art approaches, adopting cascaded models for solving independently the two tasks, in the proposed unified model, the decoder is initialized with a composite state that combines the encoder context with the location features computed by the segmentation branch, allowing the two tasks to support each other and leading to improvements in the overall model accuracy. Experiments on a challenging Sanskrit compound dataset show that the proposed model outperforms traditional methods, achieving a location prediction accuracy of $$93.51\\%$$ 93.51 % and a splitting accuracy of $$87.92\\%$$ 87.92 % , respectively. The experiments further show that joint modeling of the two tasks not only advances the state-of-the-art performance in splitting Sanskrit compounds, but also offers a richer understanding of the splitting process, paving the way for strengthening morphological analysis in natural language processing and digital humanities for the in-depth study of complex religious texts.","In scenarios where direct access to displayed content, such as secured web pages or confidential documents, is restricted, eye-tracking data can serve as a side channel for information inference. Represented as human attention maps, eye tracking data is widely used in research, for example, to quantify how users explore visual information. In this work, we specifically focus on visual question-answering (VQA) scenarios to demonstrate, for the first time, that a rich amount of information can be leaked solely from human attention maps. Hence, we assume that an adversary only has access to the gaze attention maps and aims to derive a range of attributes about the image (e.g. the chart type), the question (e.g. question type), and the answer (e.g. the accuracy-based complexity). This information leakage could be the first step towards potentially more complex insights about human perception and cognition. Our experiments demonstrate that deriving attributes is feasible, and simultaneously predicting multiple attributes improves the success rate for attributes that are difficult to infer. This paper highlights potential threats, encouraging the community to address these concerns and develop appropriate privacy-preserving solutions.","As deep learning-based, data-driven information extraction systems become increasingly integrated into modern document processing workflows, one primary concern is the risk of malicious leakage of sensitive private data from these systems. While some recent works have explored Differential Privacy (DP) to mitigate these privacy risks, DP-based training is known to cause significant performance degradation and impose several limitations on standard training procedures, making its direct application to downstream tasks both difficult and costly. In this work, we aim to address the above challenges within the context of document image classification by substituting real private data with a synthetic counterpart. In particular, we propose to use conditional latent diffusion models (LDMs) in combination with differential privacy (DP) to generate class-specific synthetic document images under strict privacy constraints, which can then be utilized to train a downstream classifier following standard training procedures. We investigate our approach under various pretraining setups, including unconditional, class-conditional, and layout-conditional pretraining, in combination with multiple private training strategies such as class-conditional and per-label private fine-tuning with DPDM and DP-Promise algorithms. Additionally, we evaluate it on two well-known document benchmark datasets, RVL-CDIP and Tobacco3482, and show that it can generate useful and realistic document samples across various document types and privacy levels ( $$\\varepsilon \\in \\{1, 5, 10\\}$$ \u03b5 \u2208 { 1 , 5 , 10 } ). Lastly, we show that our approach achieves substantial performance improvements in downstream evaluations on small-scale datasets, compared to the direct application of DP-Adam. To the best of the authors\u2019 knowledge, this is the first work to explore differentially private document generation via latent diffusion for document analysis. The source code for this work has been made publicly available at: https://github.com/saifullah3396/dpdocldm.git .","Since OpenAI\u2019s 2016 Request for Research on Image to LaTeX , printed mathematical expression recognition has advanced significantly, with newer techniques like Vision Transformers further enhancing accuracy. However, evaluations often remain limited to a small set of datasets and primarily focus on LaTeX string similarity, neglecting semantic and visual aspects. To perform a broader evaluation, we benchmarked five models representative of the evolution of Vision Transformers across eight datasets over multiple modalities. Our proposed multimodal evaluation pipeline, PiE-MER, converts predicted LaTeX into MathML, Label Graphs, and normalized images. This range of representations allows us to compute additional metrics that better capture models\u2019 syntactic, semantic, and visual accuracy. Correlation analysis revealed that BLEU and Levenshtein alone are insufficient for complete evaluations. We propose complementary metrics, including image-based Levenshtein, MathML-based scores, and graph evaluation. The MathNet model achieved the highest average performance across the datasets, with a 87% LaTeX edit score, thanks to its Convolutional Vision Transformers and multi-font training dataset. Our pipeline and benchmark can offer a clearer and more robust evaluation of future recognition systems. A GitHub repository containing the proposed evaluation pipeline is available at https://github.com/fwieckowiak/PiE-MER , enabling future authors to evaluate their own models and datasets.","The automated reconstruction of the logical arrangement of tables from image data, termed Table Structure Recognition (TSR), is fundamental for semantic data extraction. Recently, researchers have explored a wide range of techniques to tackle this problem, demonstrating significant progress. Each table is a set of vertical and horizontal separators. Following this realization, we present SepFormer, which integrates the split-and-merge paradigm into a single step through separator regression with a DETR-style architecture, improving speed and robustness. SepFormer is a coarse-to-fine approach that predicts table separators from single-line to line-strip separators with a stack of two transformer decoders. In the coarse-grained stage, the model learns to gradually refine single-line segments through decoder layers with additional angle loss. At the end of the fine-grained stage, the model predicts line-strip separators by refining sampled points from each single-line segment. Our SepFormer can run on average at 25.6 FPS while achieving comparable performance with state-of-the-art methods on several benchmark datasets, including SciTSR, PubTabNet, WTW, and iFLYTAB.","Effective license plate recognition systems are required to be resilient to constant change, as new license plates are released into traffic daily. While Transformer-based networks excel in their recognition at first sight, we observe significant performance drop over time which proves them unsuitable for tense production environments. Indeed, such systems obtain state-of-the-art results on plates whose syntax is seen during training. Yet, we show they perform similarly to random guessing on future plates where legible characters are wrongly recognized due to a shift in their syntax. After highlighting the flows of positional and contextual information in Transformer encoder-decoders, we identify several causes for their over-reliance on past syntax. Following, we devise architectural cut-offs and replacements which we integrate into SaLT, an attempt at a Syntax-Less Transformer for syntax-agnostic modeling of license plate representations. Experiments on both real and synthetic datasets show that our approach reaches top accuracy on past syntax and most importantly nearly maintains performance on future license plates. We further demonstrate the robustness of our architecture enhancements by way of various ablations.","While Connectionist Temporal Classification (CTC) has become a prevalent sequence learning framework in Scene Text Recognition (STR), its characteristic spiky distribution outputs introduce critical alignment challenges. This inherent limitation often leads to suboptimal text recognition performance. To address this issue, current methods predominantly adopt two paradigms: architectural modifications, often involving auxiliary network components, and advanced loss function design. However, these techniques fail to fully capitalize on the fundamental properties of text. In contrast, this paper presents a novel approach, PerturbCTC, that aims to explore the intrinsic feature consistency within foreground text. First, we systematically analyze the characteristics of foreground text to uncover underlying feature invariance patterns. Building on these insights, we propose an innovative feature perturbation strategy that harnesses the property of texts to enhance model perception. Additionally, we introduce the Distribution Alignment Module (DAM), which addresses the challenges of implicit alignment learning in the CTC framework. Our method is model-agnostic and can be generalized to both English and Chinese scene text benchmarks. Remarkably, our approach achieves accuracy improvements of 1.3% on the Common benchmark and 3.9% on the Union14M benchmark, outperforming existing methods without increasing model parameters, and setting new state-of-the-art results.","With the advancement of industrial automation and intelligent technology, detecting text in industrial design drawings has become critical for improving efficiency in industrial pipelines. These drawings present unique challenges, including intricate backgrounds, linear interference, and diverse text styles, such as curved, inclined, and irregular shapes. While segmentation-based methods have demonstrated potential in detecting arbitrarily shaped text, existing approaches often suffer from inaccuracies and limited robustness when applied to industrial design drawings. To address these limitations, this paper proposes a novel text detection algorithm that employs multi-dimensional feature fusion to enhance feature extraction and robustness. By integrating this strategy into a segmentation-based model, the proposed method effectively handles the complexities of text detection in industrial scenarios. Experimental results on industrial design drawing datasets demonstrate significant improvements in detection accuracy and robustness compared to state-of-the-art methods, making the algorithm well-suited for practical industrial applications.","The recognition of oracle characters is meaningful for exploring ancient Chinese culture. Due to the poor quality of scanned oracle characters, recognition is a difficult task. Although many works try to improve the recognition performance, they overlook the important fact that oracle characters are hieroglyphic. In this paper, we utilize this fact by ProtoPNet to improve the capability of recognizing oracle characters. In particular, we propose OracleProtoPNet, which mimics the human expert\u2019s recognition of oracle characters. Our OracleProtoPNet recognizes the oracle characters by comparing the similarity between input images and learned prototypes. To further improve recognition accuracy, we combine our model with two modules. Specifically, we introduce a multi-scale channel attention module to reduce noise interference. Additionally, we aggregate the activation value scores to avoid classification interference. Even if one patch has high similarity to a prototype of a certain class, the differences in other patches will separate them into different categories. To compare multiple prototypical networks and unsupervised domain adaptation networks, we conduct extensive experiments on the Oracle-241 dataset. The experimental results demonstrate that our network achieves SOTA accuracy on the scanned data while maintaining interpretability.","We introduce Rosetta , a multimodal model that leverages Multimodal In-Context Learning (MICL) to classify sequences of novel script patterns in documents by leveraging minimal examples, thus eliminating the need for explicit retraining. To enhance contextual learning, we designed a dataset generation process that ensures varying degrees of contextual informativeness, improving the model\u2019s adaptability in leveraging context across different scenarios. A key strength of our method is the use of a Context-Aware Tokenizer (CAT), which enables open-vocabulary classification. This allows the model to classify text and symbol patterns across an unlimited range of classes, extending its classification capabilities beyond the scope of its training alphabet of patterns. As a result, it unlocks applications such as the recognition of new alphabets and languages. Experiments on synthetic datasets demonstrate the potential of Rosetta to successfully classify Out-Of-Distribution visual patterns and diverse sets of alphabets and scripts, including but not limited to Chinese, Greek, Russian, French, Spanish, and Japanese. (The code from this study will soon be accessible as open-source on the GitHub repository: https://github.com/TSResearch-hub/Rosetta-ICL-classif","Current OCR systems are based on deep learning models trained on large amounts of data. Although they have shown some ability to generalize to unseen data, especially in detection tasks, they can struggle with recognizing low-quality data. This is particularly evident for printed documents, where intra-domain data variability is typically low, but inter-domain data variability is high. In that context, current OCR methods do not fully exploit each document\u2019s redundancy. We propose an unsupervised method by leveraging the redundancy of character shapes within a document to correct imperfect outputs of a given OCR system and suggest better clustering. To this aim, we introduce an extended Gaussian Mixture Model (GMM) by alternating an Expectation-Maximization (EM) algorithm with an intra-cluster realignment process and normality statistical testing. We demonstrate improvements in documents with various levels of degradation, including recovered Uruguayan military archives and 17th to mid-20th century European newspapers.","The increasing impact of global change on coastal areas necessitates effective collaboration among stakeholders to develop sound environmental protection policies. However, the vast number of scientific publications and the interdisciplinary nature of the field make it challenging to accurately identify and extract relevant information. Current methods for analyzing coastal region literature are limited in handling complex document-level relations, impeding the development of comprehensive Knowledge Bases (KBs) essential for informed decision-making. Therefore, we introduce CoastRED, a corpus of 416 scientific abstracts focused on coastal regions, designed for interdisciplinary end-to-end Document-level Relation Extraction (DocRE), leveraging the ARDI framework (Actors, Resources, Dynamics, and Interactions) to automatically identify key entities and their roles in coastal systems. We present DUNJERE\u2014an end-to-end model integrating Mention Detection, Coreference Resolution, Entity Typing, and Relation Extraction. Based on a U-Net architecture, DUNJERE approaches Relation Extraction as a semantic segmentation task, enhancing its performance in an end-to-end setting. Evaluations on the DocRED and ReDocRED datasets demonstrate state-of-the-art performance, while experiments on CoastRED highlight its potential to advance coastal system research by providing a robust tool for document analysis and KB construction. Code and dataset are available on this repository: https://github.com/jdelaunay/coastred .","This paper presents a two-stage automatic scoring approach for handwritten answers in Japanese, English, and mathematics, targeting elementary and junior high school students. A dataset of handwritten answers from more than 480 students was collected on electronic paper devices and manually graded by teachers (human score). In addition, these answers were scored automatically in two stages: first through handwriting recognition and then through scoring, eliminating the need for teacher intervention. State-of-the-art deep neural network models, corresponding to each answer type, were used for the handwriting recognition stage. Subsequently, the proposed scoring models assign a score (machine score) for each answer based on recognition outcomes. The machine scores were then compared with the corresponding human scores to evaluate the performance. The experiment results show that, on average, approximately 80% of the answers were successfully scored automatically. Consequently, the average human scoring rates were approximately 15% for Japanese, 10% for English, and 17% for mathematics. This means that with automatic scoring less than 20% of the answers require human evaluation, compared to a scenario where all answers are scored manually. The analysis further reveals an average risky scoring rate of 2% (when the machine score is higher than the human score). While this rate should be further reduced, human scoring also exhibits a similar level of variance. These findings underscore the efficacy of the proposed automatic scoring approach in alleviating the teachers\u2019 grading burden.","Adversarial attack methods involve making small but strategically crafted modifications to an image to mislead the model\u2019s automatic classifier. Many existing adversarial attack methods introduce unnatural alterations\u00a0[ 15 , 29 ], if such a patch is included in a document, this may make the document look suspicious. In contrast, this paper investigates a more natural and inconspicuous approach using stamp-like adversarial patches that resemble real-world document elements while effectively disrupting classification accuracy. To systematically evaluate the effectiveness of these adversarial stamps, we conduct extensive experiments on the RVL-CDIP dataset, a widely used benchmark for document classification. We analyze the impact of various patch attributes, including color, size, shape, and most importantly, position, on the attack success rate. Our study highlights that placement plays a crucial role in maximizing the attack\u2019s effectiveness, as different locations on the document lead to classifier degradation. To optimize both the adversarial patch and its position, we introduce an iterative training pipeline that dynamically optimizes the most disruptive locations in a document. Our results show that stamp-like adversarial patches can effectively attack document classifiers, revealing their vulnerabilities. Well-placed stamps further degrade classification accuracy, highlighting the impact of positional optimization. These findings emphasize the importance of position-aware adversarial attacks and provide insights for optimizing their design. We will make our code publicly available upon acceptance.","The goal of document tampering localization (DTL) is to segment regions containing tampering traces and ensure the authenticity of document images. Existing DTL methods mainly rely on low-level visual features to capture fine-grained tampering traces. However, these methods fail to consider textual semantics, resulting in dispersed attention across the structured document images and difficulty in focusing on high-risk text regions. To address this, we propose DocAI-TL, a novel DTL method that combines a tampering-prior-guided Document Artificial Intelligence (DocAI) model with a Segmentation Foundation Model (SFM). Specifically, the DocAI model integrates textual semantics and layout to predict tampering probability of the text, which guides SFM to focus on tampering features in high-risk text regions via a Probability Guided Attention (PGA) module. To evaluate the performance of our method, we construct a large-scale structured document forgery dataset, named SDFD, which contains 25,080 document images with diverse texture backgrounds and various document types. In addition, we propose a GPT-assisted data annotation method to fine-tune the DocAI model for more accurate tampering probability predictions. Experimental results demonstrate that the DTL performance of our method significantly outperforms that of the existing methods. The data and code of this work is available at https://github.com/lyj/DocAI-TL .","Document image forgeries, especially text manipulations in scanned documents, pose severe risks to information integrity, impacting domains such as legal, financial, and personal records. These alterations are often subtle, localized, and visually indistinguishable, especially under common compression standards like JPEG. Existing detection methods typically rely on single-model architectures, either convolutional neural networks (CNNs) or transformers, which independently struggle with effectively capturing both local artifacts and global structural inconsistencies. To overcome these limitations, we propose DocForgeNet, a novel dual cross-stream fusion network explicitly designed for robust detection and localization of forged text regions in document images. DocForgeNet simultaneously processes RGB and discrete cosine transform (DCT) features through parallel CNN and transformer streams. The CNN stream excels at identifying local inconsistencies, such as compression artifacts and font irregularities, while the transformer stream leverages self-attention mechanisms to model broader, contextual discrepancies indicative of large-scale manipulations. Cross-linear attention modules facilitate effective feature fusion between the streams without information loss. Extensive evaluations on the DocTamper dataset, which contains forgeries on 170,000 document images of various types, demonstrate that DocForgeNet significantly outperforms state-of-the-art methods, achieving superior precision, recall, and F1-scores across various testing scenarios, including severe JPEG compression. Our approach not only establishes a new benchmark in tampering detection performance but also highlights the effectiveness of integrating complementary local and global representations for enhanced document integrity verification.","Scientific illustrations contribute to a deeper understanding of the core content of papers. Many of the scientific illustrations are complex flowcharts consisting of multiple subregions. Each subregion corresponds to a meaningful module or processing stage, which are visually coherent regions with uniform background colors or distinct boundaries. However, segmenting subregions and aligning them with corresponding text descriptions has been overlooked. We propose a self-prompted segmentation of scientific illustrations (SSSI) framework, which automatically utilizes the geometric relationships between text and subregions to generate point and bounding box prompts suitable for SAM. SSSI employs a two-stage processing pipeline. In the first stage, SAM-based pre-segmentation generates bounding boxes that are aligned with text bounding boxes to produce box prompt regions, during which Optical Character Recognition (OCR) is utilized to identify the text bounding boxes and eliminate visual interference caused by text. In the second stage, we propose a dynamic point sampling algorithm that dynamically samples points as prompts and iteratively refines masks of subregions, achieving high-quality subregion extraction. Experimental results show that our framework achieves an average precision (mAP) of 68.0, with an AP@50 of 78.1.","Digitalization of historical document images relies heavily on historical text detection techniques. However, historical document images often feature complex layouts, dense text, and varying degrees of damage caused by time and environmental factors, which present challenges for traditional text detection methods, particularly in terms of ink fading and document aging. To address these issues, we propose a novel historical character-level text detector, termed E-FCOS, based on an enhanced Fully Convolutional One Stage (FCOS) object detection model. The E-FCOS detector incorporates a Fast Fourier Transform Denoising (FFTD) layer and an Adaptive Multi-scale Fusion (AMSF) module into the FCOS object detection model. In particular, the FFTD layer employs the fast Fourier transform to filter out high-frequency background noise and utilizes a Transformer to establish contextual dependencies, thereby enhancing the character structure information. The AMSF module employs bidirectional adaptive fusion to capture multi-scale information, which improves the detection performance of dense text. Our detector achieves state-of-the-art results on three datasets: MTHv2, Kuzushiji, and Nancho, especially achieving F-measure of 97.75% in the MTHv2 datasets. Additional generalization experiments on the competition dataset further confirm the potential applicability of this detector.","Document images often exhibit significant geometric distortions due to folds, curls, and non-ideal camera angles, compromising the readability and downstream text-processing performance. In this paper, we propose DocPINN , a novel single-image document dewarping framework that leverages Physics-Informed Neural Networks (PINNs) to solve a second-order partial differential equation (PDE) controlling the warp. Unlike existing methods that directly regress a dense deformation field, DocPINN infers local PDE forcing terms from image features via a convolutional network, while enforcing boundary conditions and textline constraints in a globally consistent PINN solver. This setup ensures smoother transformations in severely warped regions without sacrificing local fidelity. We conduct experiments on the DocUNet benchmark and real scanned images, demonstrating that DocPINN achieves lower character error rates (CER) and improved structural similarity (MS-SSIM) compared to state-of-the-art methods like DewarpNet. Our ablation studies confirm that the combination of learned PDE forcing, text alignment, and boundary regularization is critical for effectively resolving both large-scale perspective distortions and intricate local folds.","Recent advancements in large multimodal language models have significantly enhanced cross-modal understanding by effectively aligning vision and language. However, due to the high resolution, dense text, and complex layouts of document images, these methods still face challenges in Visual Document Understanding (VDU), primarily due to their limited ability to capture fine-grained information and relationships. To address these challenges, we propose a novel adaptive resolution selection framework. This framework consists of two key components: (1) a Resolution-Slicing Selector, which captures document information density and performs adaptive patch slicing through resolution selection, and (2) a multi-stage training strategy with mixed preference optimization. The latter leverages preference pairs to guide the selector, assigning high-resolution representations to regions with dense information and small font sizes while applying lower-resolution representations to areas with redundant information. This method captures fine-grained visual representations while maintaining modeling efficiency. With these components, SelectVision achieves significant improvements in both efficiency and performance. Our experiments demonstrate that SelectVision delivers promising results across a wide range of evaluation datasets, including ChartQA (84.3%), WTQ (59.2%), and TabFact (83.9%).","Handwritten mathematical expression generation (HMEG) aims to synthesize handwritten samples with specific mathematical content, which has a wide range of applications and thus has important research value. However, current studies on HMEG are confronted with two bottlenecks: 1) dominant models are constructed in adversarial learning, which tends to suffer from the error propagation of recognition. 2) these models require diverse inputs, increasing both cost and complexity in practical applications. In this work, we propose a novel Spatial-Aware Feature Refinement Diffusion ( SFRD ) combined with a content prototype representation to address the challenging HMEG task. Specifically, we employ two structurally shared encoders to extract handwritten patterns and content features. The extracted patterns are then processed through the designed Spatially-Aware Feature Refinement Module (SAFRM), which refines the understanding of spatial information in the handwritten style using spatial attention and feature refinement. In SFRD , cross-attention is applied to capture the entanglement between the two feature types, guiding the diffusion generation process. Extensive experiments and in-depth analyses on widely used benchmark datasets clearly demonstrate the effectiveness of our proposed model. Our code is publicly available at:\u00a0 https://github.com/Fyzjym/SFRD_Part .","Writer recognition involves analyzing handwritten documents with respect to the identity of the writer. Although automated methods can achieve strong benchmark results, their lack of interpretability limits practical adoption, particularly in settings where trust and verifiability are critical. To address this challenge, we propose a novel framework grounded in character-level analysis. At its core is Vectors of Locally Aggregated Characters (VLAC), a feature aggregation method that fuses the aligned outputs of a feature extractor and a feature annotator network. By aggregating local features on a per-character basis, VLAC provides the backbone for computing verifiable character-wise distances, thereby enhancing interpretability and trustworthiness. We extensively evaluate the proposed framework on two contemporary datasets (CVL and IAM) \u2013 achieving new state-of-the-art retrieval results on CVL \u2013 as well as a historical dataset (Hist-WI). Our method does not only perform well, but also facilitates interpretable insights into the decision process, paving the way for broader acceptance in practical and forensic applications.","Document understanding and analysis have received a lot of attention due to their widespread application. However, existing document analysis solutions, such as document layout analysis and key information extraction, are only suitable for fixed category definitions and granularities, and cannot achieve flexible applications customized by users. Therefore, this paper defines a new task named \u201cClass-Agnostic Region-of-Interest Matching\u201d (\u201cRoI-Matching\u201d for short), which aims to match the customized regions in a flexible, efficient, multi-granularity, and open-set manner. The visual prompt of the reference document and target document images are fed into our model, while the output is the corresponding bounding boxes in the target document images. To meet the above requirements, we construct a benchmark RoI-Matching-Bench, which sets three levels of difficulties following real-world conditions, and propose the macro and micro metrics to evaluate. Furthermore, we also propose a new framework RoI-Matcher, which employs a siamese network to extract multi-level features both in the reference and target domains,\u00a0and cross-attention layers to integrate and align similar semantics in different domains. Experiments show that our method with a simple procedure is effective on RoI-Matching-Bench, and serves as the baseline for further research. The code is available at https://github.com/pd162/RoI-Matching .","Recent advancements in handwritten text generation using diffusion models have achieved high-quality and realistic handwriting synthesis. However, existing models often suffer from limited style variability, which reduces their effectiveness for downstream tasks like Handwriting recognition, writer identification, which rely on diverse handwriting samples to ensure model generalization and robustness. Without sufficient variability, models trained on synthetic data risk overfitting to a narrow set of styles, limiting their applicability in real-world scenarios. Diffusion models typically require large-scale datasets to generalize effectively, but in the domain of handwriting generation, comparatively limited training data is available, leading to strong memorization tendencies. As a result, generated handwriting samples often replicate training data instead of introducing novel variations, further restricting their usefulness for downstream applications. To address this, we propose a training-free style mixing approach that dynamically injects multiple writer styles at inference time, enabling controlled handwriting diversity. Our method leverages a pre-trained diffusion model, allowing flexible writer style transitions at the character level without modifying model weights. By introducing controlled style variation, our approach mitigates memorization effects and enhances the diversity of generated samples, making them more suitable for training and evaluation purposes.","Education is the cornerstone of societal progress, yet automated document layout understanding in the education domain remains significantly under-explored, with most research focusing on individual components like texts, tables, images instead of a holistic understanding. Despite the increasing demand for AI-driven assessment, digitization, and retrieval of educational resources, very few dedicated works exists for question paper layout analysis, a critical component of automated learning systems. To bridge this gap, we introduce the first dataset HiLEx, explicitly designed for structure analysis and layout extraction from question paper images. The HiLEx dataset is curated from eight diverse examination formats. With over 1900 annotations with different structural layouts, covering both single-column and multi-column layouts, ensure robust generalization across different structural variations. We conduct a thorough empirical study with most contemporary object detection models, exposing their limitations in structural understanding, and format generalization. Our findings lay the groundwork for Smart AI solutions in education, fostering automated grading, question retrieval, and equitable learning access. This research aligns with UN Sustainable Development Goals (SDG 4: Quality Education, SDG 10: Reduced Inequalities) by enabling scalable, AI-driven assessment technologies, promoting inclusivity, and revolutionizing educational accessibility worldwide. The HiLEx dataset is publicly available in Github ( https://github.com/HiLEx-DLA/HiLEx ).","Structured document understanding requires capturing both semantic relationships and spatial structures within visually rich documents. While Graph Neural Networks (GNNs) effectively model structured dependencies, they struggle with long-range dependencies and global context awareness, which are strengths of transformers. In this work, we propose Doc2GraphFormer, a hybrid framework that integrates graph-based structured parsing with multi-head attention mechanisms, evolving from GraphSAGE-style message passing to a more expressive graph-enhanced transformer architecture. Additionally, we introduce a novel modality fusion strategy, inspired by LayoutLMv3, to enhance the integration of textual, visual, and structural embeddings. We evaluate Doc2GraphFormer on FUNSD, XFUND, demonstrating its superior performance in semantic entity recognition and relation extraction. Our findings highlight the potential of combining graph reasoning with self-attention for efficient document understanding. Our code will be made available on: https://github.com/biswassanket/doc2graphformer","Recently, Vision Language Models (VLMs) have increasingly emphasized document visual grounding to achieve better human-computer interaction, accessibility, and detailed understanding. However, its application to visualizations such as charts remains under-explored due to the inherent complexity of interleaved visual-numerical relationships in chart images. Existing chart understanding methods primarily focus on answering questions without explicitly identifying the visual elements that support their predictions. To bridge this gap, we introduce RefChartQA, a novel benchmark that integrates Chart Question Answering (ChartQA) with visual grounding, enabling models to refer elements at multiple granularities within chart images. Furthermore, we conduct a comprehensive evaluation by instruction-tuning 6 state-of-the-art VLMs across different categories. Our experiments demonstrate that incorporating spatial awareness via grounding improves response accuracy by over 15%, reducing hallucinations, and improving model reliability. Additionally, we identify key factors influencing text-spatial alignment, such as architectural improvements in TinyChart, which leverages a token-merging module for enhanced feature fusion. Our dataset is open-sourced for community development and further advancements. All models and code will be publicly available at https://github.com/moured/RefChartQA .","Calligraphy represents an invaluable cultural heritage of Chinese civilization. Research on the attribute information of calligraphy, such as styles, dynasties, and calligraphers, holds significant cultural and historical value. However, the styles of Chinese calligraphy characters have evolved dramatically through different dynasties and the unique touches of calligraphers, making it highly challenging to accurately recognize these different characters and their attributes. Furthermore, existing calligraphic datasets are extremely scarce, and most provide only character-level annotations without additional attribute information. This limitation has significantly hindered the in-depth study of Chinese calligraphy. To fill this gap, we present a novel M ulti-Attribute C hinese C alligraphy Character D ataset (MCCD). The dataset encompasses 7,765 categories with a total of 329,715 isolated image samples of Chinese calligraphy characters, and three additional subsets were extracted based on the attribute labeling of the three types of script styles (10 types), dynasties (15 periods) and calligraphers (142 individuals). The rich multi-attribute annotations render MCCD well-suited diverse research tasks, including calligraphic character recognition, writer identification, and evolutionary studies of Chinese characters. We establish benchmark performance through single-task and multi-task recognition experiments across MCCD and all of its subsets. The experimental results demonstrate that the complexity of the stroke structure of the calligraphic characters, and the interplay between their different attributes, leading to a substantial increase in the difficulty of accurate recognition. MCCD not only fills a void in the availability of detailed calligraphy datasets but also provides valuable resources for advancing research in Chinese calligraphy and fostering advancements in multiple fields. The dataset is available at https://github.com/SCUT-DLVCLab/MCCD .","Checkboxes are critical in real-world document processing where the presence or absence of ticks directly informs data extraction and decision-making processes. Yet, despite the strong performance of Large Vision and Language Models across a wide range of tasks, they struggle with interpreting checkable content. This challenge becomes particularly pressing in industries where a single overlooked checkbox may lead to costly regulatory or contractual oversights. To address this gap, we introduce the CheckboxQA dataset, a targeted resource designed to evaluate and improve model performance on checkbox-related tasks. It reveals the limitations of current models and serves as a valuable tool for advancing document comprehension systems, with significant implications for applications in sectors such as legal tech and finance. The dataset is publicly available at: https://github.com/Snowflake-Labs/CheckboxQA .","China has a long and rich history, encompassing a vast cultural heritage that includes diverse multimodal information, such as silk patterns, Dunhuang murals, and their associated historical narratives. Cross-modal retrieval plays a pivotal role in understanding and interpreting Chinese cultural heritage by bridging visual and textual modalities to enable accurate text-to-image and image-to-text retrieval. However, despite the growing interest in multimodal research, there is a lack of specialized datasets dedicated to Chinese cultural heritage, limiting the development and evaluation of cross-modal learning models in this domain. To address this gap, we propose a multimodal dataset named CulTi, which contains 5,726 image-text pairs extracted from two series of professional documents, respectively related to ancient Chinese silk and Dunhuang murals. Compared to existing general-domain multimodal datasets, CulTi presents a challenge for cross-modal retrieval: the difficulty of local alignment between intricate decorative motifs and specialized textual descriptions. To address this challenge, we propose LACLIP, a training-free local alignment strategy built upon a fine-tuned Chinese-CLIP. LACLIP enhances the alignment of global textual descriptions with local visual regions by computing weighted similarity scores during inference. Experimental results on CulTi demonstrate that LACLIP significantly outperforms existing models in cross-modal retrieval, particularly in handling fine-grained semantic associations within Chinese cultural heritage. The dataset and source code are available at: https://github.com/yyyjjy/CulTi .","Financial statements are critical for corporate analysis, fraud detection, and regulatory compliance, yet their complex tabular layouts, multi-year data structures, and hierarchical relationships pose significant challenges for automated reasoning. Existing Visual Question Answering (VQA) models struggle to deliver audit-ready responses due to their inability to explicitly localize evidence and reason over structured financial data. To bridge this gap, we introduce EviFiVQA, a large-scale benchmark dataset for evidence-based financial VQA, built on real-world financial statements. Leveraging FinTabNet, our dataset contains over 1.5 million question-answer pairs spanning five reasoning categories, each meticulously annotated with bounding boxes for relevant table cells to ensure traceable and interpretable responses. EviFiVQA introduces new challenges for Large Language Models (LLMs) and Vision-Language Models (VLMs) by requiring multi-step numerical reasoning, explicit evidence localization, and hierarchical financial aggregation\u2014all within complex, irregular table layouts. We benchmark state-of-the-art models on EviFiVQA, revealing their limitations in evidence-grounded understanding of financial statements. We release EviFiVQA to drive progress in audit-ready financial AI, enhancing transparency and reliability in AI-driven financial analytics. The dataset and code are available at https://github.com/sachinraja13/EviFiVQA","The growing usage of identity documents recognition in day-to-day life increases the need in public datasets with identity documents in various languages. Still, public identity documents datasets mainly cover Latin script-based languages. At the same time, newly emerging countries demonstrate wide adoption of technology in combination with population growth. As a result, competitive identity documents recognition system should include support documents of these countries. In this paper, we present MIDV-UP, where U stands for Urdu and P for Persian, a dataset containing identity documents in these languages. In total, MIDV-UP contains 1000 unique mock identity documents of 4 types, and 9000 fully annotated images of these documents, acquired with different equipment in various conditions. We also provide baselines for the several important tasks in typical identity documents recognition pipeline: document location and identification, per-field segmentation, and fields recognition. The results of the experiments show that the accuracy of the published approaches for the presented identity documents is low, especially in text line recognition task, and that MIDV-UP presents challenges for future research.","We present the first ever dataset of manually segmented and transcribed Ajami manuscripts written in Fulfulde and Hausa. The term Ajami refers to modified Arabic-script orthographies in Africa. Existing handwritten text recognition (HTR) and optical character recognition (OCR) models for Arabic-script languages perform poorly on West African manuscripts due to a lack of these manuscripts representation in the models\u2019 pre-training. This leads to models struggling to adapt to Ajami style calligraphy, being unequipped to recognize Ajami specific characters, and being unable to extract certain Arabic-script diacritics which are present in Ajami manuscripts but lacking in many manuscripts for other Arabic-script languages like Arabic and Persian. The latter poses a significant challenge to Ajami HTR. We release the following as an open-source dataset: an ALTO formatting of high-quality images of Fulfulde and Hausa manuscripts, manual segmentation (region and line), and manual transcriptions. Our HTR dataset is also the first to diplomatically transcribe newly Unicode-encoded, special Quranic recitation characters. We evaluate a suite of Arabic-script recognition models specifically for historical manuscripts and find that they produce character error rates of 65\u201384% when attempting to automatically transcribe our curated manuscripts. Transcriptions produced by the evaluated models are released as well.","Charts are rich with data and ubiquitous in scientific research, which makes the ability to automatically extract structured data from them a research topic of great interest. An end-to-end pipeline that is capable of building datasets from raw chart data could generate significant value in both research and industry. The first step in automated chart content extraction is classification, but major challenges that impede progress for this task include limited datasets, class similarity, class imbalance, and overall chart heterogeneity. The CHART-Info 2024 dataset captures the diversity and challenges of this domain with a set of over 50,000 real-world chart images categorized into 15 different classes. Using this dataset, we studied different data augmentation and training techniques on existing deep learning architectures, such as vision transformers (ViTs) and self-distillation with no labels (DINO) models. Our experiments resulted in a final chart classification model that achieved a macro-averaged F1 score of 94.90%, outperforming the previous state-of-the-art on CHART-Info 2024 by 1.30%. Analysis of our results suggests that masking portions of each training image and overlaying gridlines as an augmentation enabled our models to learn better features and reduce overfitting. Also, we found that the class imbalance problem can be ameliorated by training the model with weighted random samples of the original dataset distribution that give higher priority to underrepresented classes.","Diagrams are widely used to visualize data in publications. The research field of data visualization deals with defining principles and guidelines for the creation and use of these diagrams, which are often not known or adhered to by researchers, leading to misinformation caused by providing inaccurate or incomplete information. In this work, large Vision Language Models (VLMs) are used to analyze diagrams in order to identify potential problems in regards to selected data visualization principles and guidelines. To determine the suitability of VLMs for these tasks, five open source VLMs and five prompting strategies are compared using a set of questions derived from selected data visualization guidelines. The results show that the employed VLMs work well to accurately analyze diagram types ( $$F_1$$ F 1 -score 82.49%), 3D effects ( $$F_1$$ F 1 -score 98.55%), axes labels ( $$F_1$$ F 1 -score 76.74%), lines (RMSE 1.16), colors (RMSE 1.60) and legends ( $$F_1$$ F 1 -score 96.64%, RMSE 0.70), while they cannot reliably provide feedback about the image quality ( $$F_1$$ F 1 -score 0.74%) and tick marks/labels ( $$F_1$$ F 1 -score 46.13%). Among the employed VLMs, Qwen2.5VL performs best, and the summarizing prompting strategy performs best for most of the experimental questions. It is shown that VLMs can be used to automatically identify a number of potential issues in diagrams, such as missing axes labels, missing legends, and unnecessary 3D effects. The approach laid out in this work can be extended for further aspects of data visualization.","A common use case for OCR applications involves users uploading documents and progressively correcting automatic recognition to obtain the final transcript. This correction phase presents an opportunity for progressive adaptation of the OCR model, making it crucial to adapt early, while ensuring stability and reliability. We demonstrate that state-of-the-art transformer-based models can effectively support this adaptation, gradually reducing the annotator\u2019s workload. Our results show that fine-tuning can reliably start with just 16 lines, yielding a 10% relative improvement in CER, and scale up to 40% with 256 lines. We further investigate the impact of model components, clarifying the roles of the encoder and decoder in the fine-tuning process. To guide adaptation, we propose reliable stopping criteria, considering both direct approaches and global trend analysis. Additionally, we show that OCR models can be leveraged to cut annotation costs by half through confidence-based selection of informative lines, achieving the same performance with fewer annotations.","In medieval India, the Marathi language was written using the Modi script. The texts written in Modi script include extensive knowledge about medieval sciences, medicines, land records and authentic evidence about Indian history. Around 40 million documents are in poor condition and have not yet been transliterated. Furthermore, only a few experts in this domain can transliterate this script into English or Devanagari. Most of the past research predominantly focuses on individual character recognition. A system that can transliterate Modi script documents to Devanagari script is needed. We propose the MoDeTrans dataset, comprising 2,043 images of Modi script documents accompanied by their corresponding textual transliterations in Devanagari. We further introduce MoScNet ( Mo di Sc ript Net work), a novel Vision-Language Model (VLM) framework for transliterating Modi script images into Devanagari text. MoScNet leverages Knowledge Distillation, where a student model learns from a teacher model to enhance transliteration performance. The final student model of MoScNet has better performance than the teacher model while having 163 $$\\times $$ \u00d7 lower parameters. Our work is the first to perform direct transliteration from the handwritten Modi script to the Devanagari script. MoScNet also shows competitive results on the optical character recognition (OCR) task.","The study of ancient documents is important for humanity to understand history. In Japan, many ancient documents were written in the Kuzushiji font. Unlike modern fonts, Kuzushiji, as a traditional handwritten font, has unique text structures, with strokes often being connected, simplified, or distorted. In recent years, most studies on font generation have focused on modern font generation, and few have focused on the generation of ancient handwritten fonts like Kuzushiji. Furthermore, vector images are resolution-independent, possess high editing flexibility, and have consistent output quality when compared to raster images. To improve the efficiency of digital data reprinting and the preservation of historical documents by taking advantage of vector images, we propose a few-shot training-free font generation method for generating Kuzushiji characters from modern fonts based on vector images. By using only modern fonts and a few Kuzushiji characters as input, this model mitigates dataset imbalance effectively. Our method integrates a differentiable rasterizer, conditional diffusion model, discriminator, and Multi-Stroke Encoder for stroke-level text control, optimized using multiple loss functions. We conducted numerous experiments on the generation of Kuzushiji fonts, and the results demonstrate that the proposed method successfully generates Kuzushiji characters in vector images, achieving better results than previous methods.","This paper presents a novel multi-task learning (MTL) approach for medieval Hebrew manuscripts, simultaneously addressing script classification and manuscript dating. To facilitate this, we collected a VML-MSH - a comprehensive dataset of medieval manuscripts spanning a period from 850 to 1540 CE. Each manuscript is accompanied by annotations of script type, script mode, and manuscript production date. The MTL enhances generalization across diverse script styles and periods by leveraging shared feature representations, and employs advanced architectures, including Vision Transformer (ViT), MobileViT, Swin Transformer, FocalNet, BEiT, and ConvNeXT. Our training methodology combines classification and regression objectives with adaptive loss weighting, optimizing task performance. Experimental results demonstrate high accuracy in script type classification ranging from 84% to 100%, while highlighting challenges with a few script subtypes (60%\u2013100%). For manuscript dating, the model achieves a mean error ranging from 1.37 to 8.97 decades. These findings underscore the effectiveness of the proposed MTL framework for advancing historical document image analysis and digital paleography. Code and dataset are available at https://github.com/atamnour/MTL-Hebrew-Paleography .","The Manchu archives are historical records formed during the Qing Dynasty in China holding significant value, and word extraction is a crucial step in their intelligent preservation. However, the substantial variation in the lengths of Manchu words means that one-stage key-point object detection models, which have achieved SOTA performance in other ancient archives, do not perform well on Manchu archives. To address this, this paper proposes a Manchu word extraction algorithm called MultKMAWE. Using the Hourglass Network as its backbone, in addition to the five channels used in the center key-point model, the algorithm introduces three additional channels in the head module to predict the heatmap and offset of the bottom-right key-point. Then, by matching the center key-point with the bottom-right key-point, word extraction boxes are generated, effectively mitigating the impact of differences in word lengths. Additionally, based on the Qing Dynasty Imperial Household Department Archives held by the Dalian Library , this paper constructs two new word extraction datasets: the Manchu Archives Word Extraction Real Dataset (MWZS_2000) and the Manchu Archives Word Extraction Synthetic Dataset (MWTQ_2000), each containing 2,000 images. These are currently the largest datasets for Manchu word extraction. Experiments on the Manchu archives dataset (MWZS_2000) show that the proposed algorithm improves word extraction performance by 2% compared to traditional methods.","Optical Music Recognition (OMR) for historical Chinese musical notations, such as suzipu and l\u00fcl\u00fcpu , presents unique challenges due to high class imbalance and limited training data. This paper introduces significant advancements in OMR for Jiang Kui\u2019s influential collection Baishidaoren Gequ from 1202. In this work, we develop and evaluate a character recognition model for scarce imbalanced data. We improve upon previous baselines by reducing the Character Error Rate (CER) from 10.4% to 7.1% for suzipu , despite working with 77 highly imbalanced classes, and achieve a remarkable CER of 0.9% for l\u00fcl\u00fcpu . Our models outperform human transcribers, with an average human CER of 15.9% and a best-case CER of 7.6%. The models are well-calibrated with Expected Calibration Errors (ECE) below 0.0162. Using a leave-one-edition-out cross-validation approach, we ensure robust performance across five historical editions. Additionally, we extend the KuiSCIMA dataset to include all 109 pieces in five editions of Baishidaoren Gequ , encompassing suzipu , l\u00fcl\u00fcpu , and jianzipu notations. Our findings advance the digitization and accessibility of historical Chinese music, promoting cultural diversity in OMR and expanding its applicability to underrepresented music traditions.","Large language models (LLMs) have exhibited strong semantic understanding capabilities in interpreting and reasoning for table question answering (TQA). However, they still face challenges with excessively long or complex tables, particularly when these tables are disorganized or feature hierarchical structures. To address these challenges, we propose a new paradigm for TQA, named TableCall , which leverages the tool-using capabilities of LLMs. Specifically, TableCall adapts different tools for different types of table questions, such as SQL, Python, and LLMs, to simplify and enhance the reliability of table understanding. Moreover, to further enhance LLMs\u2019 table comprehension capabilities, we propose a few-shot library updating technique to generate more effective QA pairs to support LLM prompting. Experimental results on both open-domain and specific-domain datasets demonstrate that our approach achieves state-of-the-art performance, outperforming previous methods in terms of accuracy, efficiency, and reliability.","This paper introduces a novel dataset designed to facilitate the understanding of medical prescriptions, addressing the critical need for accurate and efficient information extraction from semi-structured, sensitive patient health scanned documents. By structuring these prescriptions, medical professionals can more effectively verify dosage instructions and ensure the correct delivery of prescribed drugs to patients. Unlike existing document analysis datasets, Rx-PAD dataset is specifically tailored to the complex syntax and semantic relationships of medical prescriptions. Rx-PAD consists of 200 fully annotated images collected from French pharmacies, supporting two primary tasks: Entity Extraction (EE, 61 labels) and Entity Linking (EL, 11 relation types). To evaluate automatic prescription structuring, we propose a baseline model optimised for accurate detection of drugs and dosages. We also introduce the Drug Accuracy and Completeness (DAC) metric, which evaluates correct linking between drug names, dosings, and forms in real-world medical contexts. Rx-PAD provides a robust foundation for developing solutions that can handle sensitive medical data with the accuracy and speed required for real-world applications such as pharmacy automation, medical AI, and healthcare compliance applications, contributing to meaningful healthcare advancements. The dataset is publicly available at https://gitlab.com/phealing-public/rx_pad.","Colors play a crucial role in the design of vector graphic documents by enhancing visual appeal, facilitating communication, improving usability, and ensuring accessibility. In this context, color recommendation involves suggesting appropriate colors to complete or refine a design when one or more colors are missing or require alteration. Traditional methods often struggled with these challenges due to the complex nature of color design and the limited data availability. In this study, we explored the use of pretrained Large Language Models (LLMs) and their commonsense reasoning capabilities for color recommendation, raising the question: Can pretrained LLMs serve as superior designers for color recommendation tasks? To investigate this, we developed a robust, rigorously validated pipeline, ColorGPT , that was built by systematically testing multiple color representations and applying effective prompt engineering techniques. Our approach primarily targeted color palette completion by recommending colors based on a set of given colors and accompanying context. Moreover, our method can be extended to full palette generation, producing an entire color palette corresponding to a provided textual description. Experimental results demonstrated that our LLM-based pipeline outperformed existing methods in terms of color suggestion accuracy and the distribution of colors in the color palette completion task. For the full palette generation task, our approach also yielded improvements in color diversity and similarity compared to current techniques.","Adapting large language models (LLMs) to complex reasoning tasks often requires expensive fine-tuning efforts. We propose GAMeta-Prompt , a generative adversarial framework that streamlines prompt-based meta-learning through an iterative, team-based adversarial process. First, our approach organizes a role-based \u201cexpert team\u201d. One member assumes the role of \u201cteam manager\u201d acting as the sole conduit for all expert communications to maintain independent reasoning streams. Second, we engage an \u201cadversarial team\u201d that mirrors the expert structure but aims to refute the solution proposed by the expert team, creating a multi-round confrontation that targets logical gaps and domain oversights. Finally, we propose an adaptive evaluation mechanism based on multi-dimensional feedback, which dynamically adjusts the evaluation criteria by quantifying the consistency of expert scores and the uncertainty of evaluation. The method combines adaptive scoring integration, feedback adjustment and multi-round optimization to improve the robustness and accuracy of the evaluation and ensure the overall reliability of the scheme. Experiments demonstrate that GAMeta-Prompt outperforms conventional prompt engineering methods in few-shot and zero-shot scenarios, often enabling smaller models to match or exceed the performance of larger ones under resource constraints. By blending persona-based context, iterative adversarial checks, and global scoring, our framework offers a scalable, parameter-efficient pathway to refining LLM reasoning without fine-tuning.","Document-level relation extraction in document understanding aims to identify complex entity relationships across sentences, but existing methods often face challenges when capturing long-distance entity dependencies. To address this issue, this paper proposes a document-level relation extraction model based on Entity Dependency Memory Enhancement (EMDRE). By introducing memory-enhanced technology from the computer vision domain, token Turing machine (TTM), the model effectively improves the ability to model long-distance entity dependencies in document understanding tasks. This approach enhances the memory mechanism, significantly improving the model\u2019s ability to capture complex entity relationships within documents. Additionally, to tackle the issue of class imbalance in document-level relation extraction tasks, this paper presents an adaptive ranking optimization strategy that dynamically adjusts the contribution of positive and negative samples to model training, further boosting model performance. Experimental results demonstrate that the EMDRE model outperforms existing baseline models in document-level relation extraction tasks, validating its effectiveness and innovation in document understanding.","The analysis of hand-drawn ink line intersections has long been a critical aspect of questioned document examination. Accurately determining the application sequence of intersecting ink lines can effectively assist human examiners with forensic evaluation of handwriting, such as with the authentication of handwritten signatures. However, one of the most significant challenges arises from the nuanced and often indistinct nature of colour (or greyscale) and topological features of intersecting ink regions. This has hindered existing studies from developing robust solutions, even with the use of expensive specialist equipment. This paper proposes a deep learning-based method for analysing three-dimensional ink data reconstructed using photometric stereo, for enabling the automatic determination of ink line application sequences in various handwritten patterns. To train and evaluate this model, we constructed and annotated an image dataset comprising 1,500 high-resolution samples of hand-drawn intersecting ink lines. Our method achieved an accuracy of 96.33% in sequencing intersecting ink lines, demonstrating potential for applications in forensic document examination, including forgery detection and signature authentication. Relevant data, including high-resolution surface normal and depth maps of intersecting ink lines, are available at https://doi.org/10.5281/zenodo.14868091","Handwritten Mathematical Expression Recognition (HMER) is a challenging task due to the complexity of mathematical symbols and the variability of handwriting styles. Tree Structured Transformer (TST) is proposed to recognize handwritten mathematical expressions by predicting the Symbol Layout Tree (SLT) of the expression. The proposed method is based on an Encoder-Decoder architecture, where the Decoder is designed to predict the tree structure of the expression, which predicts the node labels, edge labels, and parent index of each node. This TST Decoder can be combined with different Encoder to handle both online or offline handwritten mathematical expressions with CNN-based Encoder for offline HMER and Graph-based Encoder for online HMER. Both the online and offline systems are evaluated on the CROHME 2023 dataset, and evaluated by the standard evaluation tools, achieving competitive results compared to the state-of-the-art methods.","To address the challenges of table structure recognition, we propose a novel Split-Merge-based top-down model optimized for large, densely populated tables. Our approach formulates row and column splitting as sequence labeling tasks, utilizing dual Transformer encoders to capture feature interactions. The merging process is framed as a grid cell classification task, leveraging an additional Transformer encoder to ensure accurate and coherent merging. By eliminating unstable bounding box predictions, our method reduces resolution loss and computational complexity, achieving high accuracy while maintaining fast processing speed. Extensive experiments on FinTabNet and PubTabNet demonstrate the superiority of our model over existing approaches, particularly in real-world applications. Our method offers a robust, scalable, and efficient solution for large-scale table recognition, making it well-suited for industrial deployment.","Automating table extraction (TE) from business documents is critical for industrial workflows but remains challenging due to sparse annotations and error-prone multi-stage pipelines. While semi-supervised learning (SSL) can leverage unlabeled data, existing methods rely on confidence scores that poorly reflect extraction quality. We propose QUEST, a Quality-aware Semi-supervised Table extraction framework designed for Business documents. QUEST introduces a novel quality assessment model that evaluates structural and contextual features of extracted tables, trained to predict F1 scores instead of relying on confidence metrics. This quality-aware approach guides pseudo-label selection during iterative SSL training, while diversity measures (DPP, Vendi score, IntDiv) mitigate confirmation bias. Experiments on a proprietary business dataset (1k annotated + 10k unannotated documents) show QUEST improves F1 from 64% to 74% and reduces empty predictions by 45% (12% to 6.5%). On the DocILE benchmark (600 annotated + 20k unannotated documents), QUEST achieves a 50% F1 score (up from 42%) and reduces empty predictions by 19% (27% to 22%). The framework\u2019s interpretable quality assessments and robustness to annotation scarcity make it particularly suited for business documents, where structural consistency and data completeness are paramount.","Artistic text recognition poses significant challenges due to the diversity of fonts, visual effects, and background noise\u2014elements designed for aesthetics yet detrimental to accurate recognition. While the skeletal structure of characters remains stable across variations, existing methods have underutilized this information for robust recognition. In this work, we propose Skeleton-Guided Artistic Text Recognition (SG-ATR), a novel method that explicitly leverages skeletal representations to enhance text feature extraction. Our framework integrates a Skeletonization module to distill essential character structures while mitigating interference from complex backgrounds. To advance benchmarking in artistic text recognition, we introduce Artistic Text-In-The-Wild (ATTW), a dataset comprising 16,627 diverse artistic text instances, curated from widely recognized sources and spanning a broad spectrum of artistic styles. Extensive experiments demonstrate that SG-ATR achieves 75.39% % accuracy on ATTW, surpassing state-of-the-art (SOTA) methods. Furthermore, SG-ATR generalizes well to standard scene text recognition benchmarks, underscoring its robustness beyond artistic text scenarios.","Scene text removal (STR) aims to erase textual elements from images. It was originally intended for removing privacy-sensitive or undesired texts from natural scene images, but is now also applied to typographic images. STR typically detects text regions and then inpaints them. Although STR has advanced through neural networks and synthetic data, misuse risks have increased. This paper investigates Inverse STR (ISTR), which analyzes STR-processed images and focuses on binary classification (detecting whether an image has undergone STR) and localizing removed text regions. We demonstrate in experiments that these tasks are achievable with high accuracies, enabling detection of potential misuse and improving STR. We also attempt to recover the removed text content by training a text recognizer to understand its difficulty. Our datasets and model are available at: https://github.com/takumi-yoshimatsu/ISTR .","Scene Text Recognition (STR) is an essential component in autonomous navigation for a diverse set of applications, including reading signboards, traffic signs and license plates. However, STR in\u00a0rainy weather conditions remains unexplored. The challenges of reading\u00a0text covered with rain streaks and accumulation highlight the need for robust STR systems. We adapt existing rain generation method\u00a0to add rain to the 1000 text-heavy frames from the RoadText-1K dataset. RoadText-1K is an existing dataset that is created from the Berkeley Deep\u00a0Drive (BDD) dataset. We observe challenges like completely illegible text and non-real rains while using the rain generation methods. We first provide a simple recipe to build somewhat legible but challenging STR scenes in real\u00a0rainy weather. The recipe includes upsampling the noisy rain mask obtained from the rain generation method, and adding it to the high-resolution clean image. Although our method is simple, the generated data helps improve STR results in real rainy weather. We benchmark the performance of existing STR models\u00a0on our data. Further fine-tuning the best-performing model on generated rainy data reduces the word error rates by 27.88% on generated test set, and 22.36% on images with real rain. It is important to note that these results are better than directly fine-tuning on data with real rain, since the labelling was done before adding rain, and the scene text is challenging but readable.","This study presents a large-scale dataset of Khmer scene text images captured in real-world environments. Khmer, the official language of Cambodia, is spoken by approximately 17 million people. While Optical Character Recognition (OCR) systems have achieved remarkable success in Roman (Latin) script languages such as English, Khmer script poses unique challenges due to its intricate structure, absence of clear word boundaries, and highly diverse character shapes and sizes. A significant limitation in Khmer OCR research has been the scarcity of high-quality training data, particularly for deep learning-based models, which require extensive datasets to achieve robust performance. To address these challenges, we introduce a newly constructed dataset of Khmer scene text, comprising 29,601 annotated text lines from 10,000 unique images. This dataset is highly diverse and challenging, encompassing artistic text, blurred text, low-light conditions, curved text, text in complex backgrounds, and occluded text. Each text line is annotated with polygonal bounding box coordinates and line-level transcriptions, alongside attributes describing background complexity, character appearance, and text style. To establish a foundational benchmark for future research in Khmer OCR, we provide baseline results for Khmer text detection and recognition. Additionally, we propose a robust evaluation metric tailored for Khmer OCR, enabling precise assessment of CER and WER while accounting for the unique characteristics of the Khmer script.","In this paper, TextSAM-LoRA is presented as a novel pipeline for high-precision text detection that leverages the Segment Anything Model (SAM) as a base semantic segmentation model, efficiently fine-tuned with Low-Rank Adaptation (LoRA) layers for text segmentation tasks. Although SAM has demonstrated remarkable generalization capabilities across various segmentation tasks, its application to text detection remains largely underexplored. By integrating LoRA, SAM can be efficiently adapted to the text domain, significantly reducing both the computational cost and parameter overhead typically associated with fine-tuning large-scale models. The extensive experiments carried out on three benchmark datasets\u2014CTW1500, MSRA-TD500 and Total-Text\u2014demonstrate that TextSAM-LoRA achieves competitive state-of-the-art performance. Notably, on CTW1500 the approach outperforms previous methods with an F1-score of 90.4%, highlighting its exceptional ability to accurately detect complex curved texts. This work showcases the potential of combining foundational segmentation models with lightweight adaptation techniques for building specific and accurate text detection systems with limited computational resources.","In real-world scenarios, text embedded in images is frequently subjected to corruption due to various factors such as occlusion, noise, fading, or physical damage. These degradations are prevalent in diverse applications, including street view text recognition and scene text understanding, significantly hindering the utility of text in downstream tasks such as optical character recognition and natural language processing. Existing methods for text image inpainting often rely on additional prompts or external data to guide the restoration process, which not only increases complexity but also limits their applicability in scenarios where such auxiliary information is unavailable. To address these challenges, we propose a novel approach, termed MultiModalTextInpaintingNetwork (MMTINet), which directly extracts and fuses textual semantics from the image itself without requiring any external prompts. By leveraging the inherent textual information within the image, our method achieves a more seamless and context-sensitive restoration, significantly improving the accuracy and fidelity of the reconstructed text. We evaluate MMTINet on a benchmark dataset, demonstrating its effectiveness in recovering missing or occluded text while preserving the original content and style. Experimental results highlight the efficacy and potential of our approach, showcasing its superior performance in advancing text restoration tasks through image-driven text semantics.","Online handwritten signature verification plays a crucial role in digital security applications, particularly in scenarios requiring high authenticity and fraud prevention. Path Signature, serving as a robust temporal modeling method, has demonstrated
