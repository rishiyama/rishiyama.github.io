 save time and manage content overload. However, existing summarization datasets are not suitable for this purpose, as they either do not cover discussions, multiple modalities, or both. To end this, we present MMRSUM , a comprehensive multimodal discussion summarization dataset boasting 7,130 meticulously curated threads. Given the diversity of languages in India, with more than 1 billion people, Hinglish is crucial for facilitating communication across linguistic groups, reflecting cultural integration, and enhancing professional and educational environments. Additionally, we present HMMRSUM , an innovative multimodal codemixed discussion summarization dataset with 7,130 threads in Hinglish. Each thread within these datasets encompasses a solicitation post enriched with both textual\u00a0and visual elements, facilitating a holistic understanding. Subsequent comments further augment comprehension by integrating textual and visual components. To refine the summarization process, we propose an innovative approach employing R elevant- C luster-based M ulti-stage S ummarization (RCMS). Our model demonstrates strong performance on both English and codemixed multimodal datasets. It not only surpasses existing benchmarks by a notable margin of $$\\approx 6\\%$$ \u2248 6 % but also sets a new standard for future research endeavors. The detailed dataset samples are available at https://github.com/M-Groot7/MMRSUM-HMMRSUM.git","Charge prediction is an important task in intelligent legal reasoning, aiming to automatically identify potential criminal activities from case descriptions. Existing methods often fail to capture the complex relationships in legal texts because they rely on simple feature modeling. In this paper we propose a new charge prediction method named Semantic Syntactic Fusion and Legal Constituent Elements Matching (SemSyn-LCE). It improves prediction accuracy by combining syntax and semantics features and extracting LCEs. To capturing cross-sentence dependencies which exhibit crucial contextual relationships, this method introduces a novel multi-hop syntactic dependency trees. It also identifies potential matching sentences for LCEs which contribute the most to charge prediction. Experimental results show that SemSyn-LCE outperforms existing methods, achieving higher prediction accuracy.","Topic modeling is a technique used to identify and organize topic domains in document collections. Therefore, topic models are extensively used in expert finding by considering domain (expertise) as a topic or a\u00a0list of topics. Most of the existing topic models, for expert/expertise finding, make use of different versions of Latent Dirichlet Allocation (LDA) to acquire coherent domains. However, in the process\u00a0of obtaining domains with higher coherence, LDA fails in discovering latent relationships among those domains. In this work, we present our model that combines LDA with Sentence-BERT (S-BERT), further refining the domains with clustering. More specifically, we propose fuzzy clustering using Fuzzy C-means in order to discover latent relationships among the domains. Furthermore, we add temporal information into our model to analyze the relationship between domain word semantics and temporal factor. We compare our model with baselines using the COVID-19 Open Research Dataset (CORD-19) and 20Newsgroups dataset. Through experiments, we demonstrate that our fuzzy topic model outperforms baseline models on both datasets.","Business documents often contain substantial tabular and textual information with numerical values, requiring mathematical reasoning for effective document understanding. While Small Language Models (SLMs) still struggle at this task, tool-augmented multi-step agents perform better, at the cost of relying on closed-source or larger models, external data, or extensive prompt-engineering. This work introduces MATATA, a novel weakly supervised end-to-end approach to train multi-step reasoning language agents for document tabular applications. MATATA presents an annotation-free paradigm for each agent to enhance 3.8B/8B SLMs. During its two-stage training, MATATA uses the final outcome of the multi-step reasoning chain as weak supervision. This approach avoids having to individually supervise each intermediate agent in the reasoning chain. By employing an adaptive planner and shared tools across different datasets, MATATA shows robust performance. Experiments demonstrate that MATATA achieves state-of-the-art on FinQA, and on TAT-QA among reasoning methods based on open-source SLMs. Although being SLM-based, MATATA closely matches GPT-4-based frameworks on TabMWP. This novel weakly supervised approach enables training an end-to-end multi-step reasoning agent without intermediate supervision, supporting future developments of cost-effective powerful agentic systems.","Historical maps offer an invaluable perspective into territory evolution across past centuries\u2014long before satellite or remote sensing technologies existed. Deep learning methods have shown promising results in segmenting historical maps, but publicly available datasets typically focus on a single map type or period, require extensive and costly annotations, and are not suited for nationwide, long-term analyses. In this paper, we introduce a new dataset of historical maps tailored for analyzing large-scale, long-term land use and land cover evolution with limited annotations. Spanning metropolitan France (548,305\u00a0km^2), our dataset contains three map collections from the $${18}^\\text {th}$$ 18 th , $${19}^\\text {th}$$ 19 th , and $${20}^\\text {th}$$ 20 th centuries. We provide both comprehensive modern labels and 22,878\u00a0km^2 of manually annotated historical labels for the $${18}^\\text {th}$$ 18 th and $${19}^\\text {th}$$ 19 th century maps. Our dataset illustrates the complexity of the segmentation task, featuring stylistic inconsistencies, interpretive ambiguities, and significant landscape changes (e.g., marshlands disappearing in favor of forests). We assess the difficulty of these challenges by benchmarking three approaches: a fully-supervised model trained with historical labels, and two weakly-supervised models that rely only on modern annotations. The latter either use the modern labels directly or first perform image-to-image translation to address the stylistic gap between historical and contemporary maps. Finally, we discuss how these methods can support long-term environment monitoring, offering insights into centuries of landscape transformation. Our repository is publicly available on GitHub .","The automatic extraction of key-value information from handwritten documents is a key challenge in document analysis. A reliable extraction is a prerequisite for the mass digitization efforts of many archives. Large Vision Language Models (LVLM) are a promising technology to tackle this problem especially in scenarios where little annotated training data is available. In this work, we present a novel dataset specifically designed to evaluate the few-shot capabilities of LVLMs. The CM1 documents are a historic collection of forms with handwritten entries created in Europe to administer the Care and Maintenance program after World War Two. The dataset establishes three benchmarks on extracting name and birthdate information and, furthermore, considers different training set sizes. We provide baseline results for two different LVLMs and compare performances to an established full-page extraction model. While the traditional full-page model achieves highly competitive performances, our experiments show that when only a few training samples are available the considered LVLMs benefit from their size and heavy pretraining and outperform the classical approach. The dataset and instructions are available under https://github.com/fabiwo6/cm1 .","Historical maps contain valuable, detailed survey data often unavailable elsewhere. Automatically extracting linear objects, such as fault lines, from scanned historical maps benefits diverse application areas, such as mining resource prediction. However, existing models encounter challenges in capturing adequate image context and spatial context. Insufficient image context leads to false detections by failing to distinguish desired linear objects from others with similar appearances. Meanwhile, insufficient spatial context hampers the accurate delineation of elongated, slender-shaped linear objects. This paper introduces the L inear Object D etection TR ansformer (LDTR), which directly generates accurate vector graphs for linear objects from scanned map images. LDTR leverages multi-scale deformable attention to capture representative image context, reducing false detections. Furthermore, LDTR\u2019s innovative N-hop connectivity component explicitly encourages interactions among nodes within an N-hop neighborhood, enabling the model to learn sufficient spatial context for generating graphs with accurate connectivity. Experiments show that LDTR improves detection precision by 6% and enhances line connectivity by 20% over state-of-the-art baselines.","Text on historical maps provides valuable information for studies in history, economics, geography, and other related fields. Unlike structured or semi-structured documents, text on maps varies significantly in orientation, reading order, shape, and placement. Many modern methods can detect and transcribe text regions, but they struggle to effectively \u201clink\u201d the recognized text fragments, e.g., determining a multi-word place name. Existing layout analysis methods model word relationships to improve text understanding in structured documents, but they primarily rely on linguistic features and neglect geometric information, which is essential for handling map text. To address these challenges, we propose LIGHT , a novel multi-modal approach that integrates linguistic, image, and geometric features for linking text on historical maps. In particular, LIGHT \u00a0includes a geometry-aware embedding module that encodes the polygonal coordinates of text regions to capture polygon shapes and their relative spatial positions on an image. LIGHT \u00a0unifies this geometric information with the visual and linguistic token embeddings from LayoutLMv3, a pretrained layout analysis model. LIGHT \u00a0uses the cross-modal information to predict the reading-order successor of each text instance directly with a bi-directional learning strategy that enhances sequence robustness. Experimental results show that LIGHT \u00a0outperforms existing methods on the ICDAR 2024/2025 MapText Competition data, demonstrating the effectiveness of multi-modal learning for historical map text linking.","Governments worldwide have enforced laws and regulations to protect digital data and ensure privacy. Data owners thus\u00a0have been granted the right to be forgotten . An integral part\u00a0of ensuring compliance requires companies to take reasonable steps\u00a0to delete user data not only from databases but also from any AI models trained on it. In addition, model owners may also need to remove data harming the model\u2019s utility, and doing so efficiently,\u00a0via Selective Forgetting, is crucial. Although extensively studied\u00a0in classification, its application to document object detection remains underexplored. This paper introduces a novel selective unlearning framework using enhanced Sharded, Isolated, Sliced, and Aggregated (SISA) training combined with an Enhanced Weighted Box Fusion\u00a0(WBF) strategy. By partitioning datasets into isolated shards and slices, we enable localized unlearning through selective sub-model retraining while mitigating performance loss via ensemble aggregation techniques. Experiments on the ICDAR 2017 POD\u00a0and Invoices datasets demonstrate that our approach achieves better aggregation performance compared to standard WBF and\u00a0soft Non-Maximum Suppression (sNMS), striking a balance between unlearning efficiency and model accuracy. These findings provide insights into scalable, privacy-preserving document AI\u00a0for real-world applications.","Federated Learning (FL) enables decentralized model training while preserving privacy, but compliance with data erasure regulations poses significant challenges. Existing federated unlearning methods suffer from high computational costs or incomplete data removal. This paper introduces a novel federated unlearning framework that integrates Asynchronous Clustered Aggregation and Federated Ensemble Learning, ensuring efficient unlearning while maintaining model accuracy. By retraining only affected clusters instead of the entire model, our approach reduces retraining overhead by 2 $$\\times $$ \u00d7 while preserving 96\u201399% accuracy. Additionally, targeted noise injection prevents residual data influence, enhancing privacy protection. Evaluations on ICDAR-POD2017 and Invoices datasets demonstrate superior performance, achieving a 4\u20135% accuracy improvement over standard clustered aggregation. Our findings bridge the gap between privacy compliance and high-performance document analysis, offering a scalable and effective solution for federated unlearning.","Online signature verification captures dynamic information during the signing process to identify and authenticate signatures. The extraction of effective signature features has been a central focus in this area of research. In this paper, a novel online signature verification model is proposed, which combines multi-scale convolution with dynamic time warping (DTW). The model extracts multi-scale features from signatures using a multi-scale convolutional network (MSCN), and adaptively weights different feature channels using a channel attention mechanism. This enables the model to extract more effective features from signatures of varying scales, thus enhancing the model\u2019s representational capacity. Furthermore, soft-DTW is used as a distance metric, and compared to DTW, soft-DTW can address the non-differentiability issue of DTW and enable end-to-end training. Experimental results demonstrate that the proposed model significantly outperforms previous methods on the DeepSignDB dataset, achieving state-of-the-art results.","This paper investigates the task of writer retrieval, which identifies documents authored by the same individual within a dataset based on handwriting similarities. While existing datasets and methodologies primarily focus on page level retrieval, we explore the impact of text quantity on writer retrieval performance by evaluating line- and word-level retrieval. We examine three state-of-the-art writer retrieval systems, including both handcrafted and deep learning-based approaches, and analyze their performance using varying amounts of text. Our experiments on the CVL and IAM dataset demonstrate that while performance decreases by 20\u201330% when only one line of text is used as query and gallery, retrieval accuracy remains above 90% of full-page performance when at least four lines are included. We further show that text-dependent retrieval can maintain strong performance in low-text scenarios. Our findings also highlight the limitations of handcrafted features in low-text scenarios, with deep learning-based methods like NetVLAD outperforming traditional VLAD encoding.","Line-level handwritten text recognition (HTR) transcribes text from scanned or photographed documents, with transformer-based models recently achieving strong performance. However, these models typically require extensive real and synthetic datasets and significant computational resources, rendering them impractical for tasks involving small, private datasets. The lack of open-source additional data further hinders fair performance comparisons. This work proposes a Dual Downsample Vision Transformer (DDViT) for HTR, relying solely on small, open-source datasets like IAM. Building on an efficient vision transformer baseline, DDViT generates two predictions via distinct downsampling layers, selecting the final output with a novel dual maps scoring method. DDViT achieves state-of-the-art character error rates (e.g., 3.34% on IAM-A, a 1.5% point improvement over prior works) across nine related studies and remains competitive with methods using additional data, demonstrating effective HTR without resource-intensive requirements.","Multi-stroke characters in scripts such as Chinese and Japanese can be highly complex, posing significant challenges for both native speakers and, especially, non-native learners. If these characters can be simplified without degrading their legibility, it could reduce learning barriers for non-native speakers, facilitate simpler and legible font designs, and contribute to efficient character-based communication systems. In this paper, we propose a framework to systematically simplify multi-stroke characters by selectively removing strokes while preserving their overall legibility. More specifically, we use a highly accurate character recognition model to assess legibility and remove those strokes that minimally impact it. Experimental results on 1,256 character classes with 5, 10, 15, and 20 strokes reveal several key findings, including the observation that even after removing multiple strokes, many characters remain distinguishable. These findings suggest the potential for more formalized simplification strategies.","Text recognition systems are essential for digitizing documents. Until now, handwritten recognition systems have been divided into two separate types: one that reads individual lines of text and the other that processes entire paragraphs. This division exists because of technical limitations, not because reading lines and paragraphs are fundamentally different tasks. While these distinct systems work well in their respective niches, this separation causes practical problems. For example, when a paragraph contains just one line of text, paragraph-reading systems typically cannot handle it properly. The management of two separate systems doubles the computer memory required, and organizations must procure two different systems that perform the same task. In this work, we present three key contributions. Firstly, our work demonstrates that the fundamental concepts of task arithmetic remain applicable despite not meeting all the prerequisites. We demonstrate that in the absence of a common pretrained model, synthetic ancestor models can be derived from existing models. Furthermore, we show that the application of task arithmetic principles yields a better synthetic ancestor model which can enhance performance across target tasks. Secondly, we present a unified model for paragraph and line-level recognition. This unified model manages to achieve a state-of-the-art paragraph Word Error Rate (WER) of 10.1% on the IAM dataset, while simultaneously maintaining a robust line WER of 11.3%. Lastly, we establish the first benchmark results where a unified model is tested on the combined paragraph and line IAM dataset.","Handwritten Chinese Text Recognition (HCTR) is challenging due to the complexity of Chinese characters, diverse writing styles, and data scarcity. Existing approaches often increase computational costs with deeper or wider CNNs, while static convolution fails to capture subtle stroke variations and complex character structures necessary for accurate recognition. To address these challenges, we propose a Star Attention-based Network (SANet) with Multi-Scale Dynamic Aggregation for HCTR. Specifically, our designed lightweight five-layer StarNet architecture reduces parameter redundancy while enhancing feature extraction and generalization. As well as for diverse handwriting styles, we introduce a novel Multi-Scale Dynamic Attention (MSDA) module that captures both global layout and fine-grained stroke details. Additionally, we also generate a synthetic dataset using geometric transformations to mitigate data scarcity. During decoding, an n-gram language model leverages contextual information for error correction, improving accuracy. Extensive experiments on CASIA-HWDB and SCUT-HCCDoc demonstrate competitive performance, with accuracy rates and correct rates of 98.12% and 98.39% on the CASIA-HWDB test set, showcasing robustness and applicability of our approach.","Existing document shadow removal methods primarily rely on Convolutional Neural Networks (CNNs) to capture local features but suffer from limited long-range dependency modeling. While Transformer-based approaches enhance global representation learning, their prohibitive computational overhead hinders deployment in large-scale document processing. Furthermore, conventional methods focus solely on pixel-level reconstruction loss optimization, neglecting the potential of contrastive learning to improve feature discrimination between positive and negative samples. To tackle these challenges, we propose the Frequency and Contrastive Learning-Driven Network (FCD-Net), a framework that integrates frequency-domain processing and contrastive learning for efficient document shadow removal. Specifically, we design the Hybrid Frequency Convolution Module (HFCM), which performs convolutional operations in both spatial and frequency domains, enabling simultaneous global context modeling and local refinement with low complexity. Additionally, we introduce the Structure-Preserving Refinement Module (SPRM) to incorporate structural priors in a gated manner, enhancing text boundary preservation and detail recovery. To further improve feature discrimination, we integrate the Frequency-Contrastive Feature Regularization (FCFR), which leverages contrastive learning in the frequency domain to enforce distinct feature representations between positive and negative samples. Extensive experiments conducted on public benchmarks and Optical Character Recognition (OCR) performance demonstrate the effectiveness of FCD-Net, achieving state-of-the-art performance while maintaining computational efficiency.","Recent advances in scene text image generation\u00a0have attracted considerable attention. However, generating complex\u00a0text with multiple attributes remains a challenging task.\u00a0Such complexities include non-planar scenes, skewed camera perspectives, and structurally intricate Chinese characters. To address\u00a0these challenges, we propose a method for Chinese character generation based on joint modeling of shape, pronunciation, and semantics (SPS-CG). Given the intrinsic interconnection between shape, pronunciation, and semantics in the evolution of Chinese characters, joint modeling of multi-dimensional features enables the model\u00a0to generate more accurate and realistic images. Additionally, we design specialized data synthesis methods for various types of complex\u00a0text to enhance the diversity of training data available to the model. The proposed approach employs a two-stage training strategy, achieving both text erasing and text generation in natural scenes. Experimental results indicate that our method demonstrates improved performance in terms of image generation accuracy and naturalness compared to existing approaches.","Modern scene text recognition systems often depend\u00a0on large end-to-end architectures that require extensive training\u00a0and are prohibitively expensive for real-time scenarios. In such cases, the deployment of heavy models becomes impractical due\u00a0to constraints on memory, computational resources, and latency.\u00a0To address these challenges, we propose a novel, training-free plug-and-play framework that leverages the strengths of pre-trained text recognizers while minimizing redundant computations.\u00a0Our approach uses context-based understanding and introduces\u00a0an attention-based segmentation stage, which refines candidate\u00a0text regions at the pixel level, improving downstream recognition. Instead of performing traditional text detection that follows\u00a0a block-level comparison between feature map and source image\u00a0and harnesses contextual information using pretrained captioners, allowing the framework to generate word predictions directly\u00a0from scene context. Candidate texts are semantically and lexically evaluated to get a final score. Predictions that meet or exceed\u00a0a pre-defined confidence threshold bypass the heavier process\u00a0of end-to-end text STR profiling, ensuring faster inference and cutting down on unnecessary computations. Experiments on public benchmarks demonstrate that our paradigm achieves performance on par\u00a0with state-of-the-art systems, yet requires substantially\u00a0fewer resources. Our code can be\u00a0found here: https://github.com/Ritabrata04/icdar2025-context-driven-str.git .","In this paper, we demonstrate a total disentanglement of font images. Total disentanglement is a neural network-based method for completely decomposing each font image into its style and content (i.e., character class) features. It uses a simple but careful training procedure to extract the common style feature from all \u2018A\u2019\u2013\u2018Z\u2019 images in the same font and the common content feature from all \u2018A\u2019 (or another class) images in different fonts. These disentangled features guarantee the reconstruction of the original font image. Various experiments have been conducted to understand the performance of total disentanglement. First, it is demonstrated that total disentanglement is achievable with very high accuracy; this is experimental proof of the long-standing open question, \u201cDoes \u2018A\u2019 exist?\u201d Hofstadter (1985). Second, it is demonstrated that the disentangled features produced by total disentanglement apply to a variety of tasks, including font recognition, character recognition, and one-shot font image generation.","We present the elaboration of Epimethee ,\u00a0a text-processing pipeline that goes from Optical Character Recognition (OCR) to Named Entity Recognition (NER) and\u00a0the cartographic representation of places mentioned in ancient literary texts. We will present the difficulties encountered when\u00a0using off-the-shelf tools for the NER and Map stages in noisy data and\u00a0the methods used to overcome them. One involves grouping different versions of NEs, for example Besan\u00e7on , Besangon or besanqon , using a clustering algorithm. We present the assessment for several clustering algorithms. The analysis of spatial NEs with Epimethee \u00a0lead researchers to better understand, represent and deepen the stakes\u00a0of a novel by observing the diegetic landscapes proposed by literary authors.","Learning to interpret sheet music and play musical instruments (piano) remains a significant challenge for beginners, often requiring extensive practice and guidance. Existing platforms lack real-time feedback and seamless sheet music interpretation, creating inefficiencies that require a system for accurate\u00a0note recognition, intuitive guidance, and reduced cognitive load.\u00a0To address this, we propose a novel system that integrates optical music recognition (OMR) and virtual reality (VR) to create\u00a0an immersive piano learning environment. The proposed approach improves the detection of musical notes by making it scale and rotation invariant. The detected notes are converted into the corresponding piano keys and sequential instructions. These instructions are\u00a0then visualized in a VR environment in Meta Quest 3, where a virtual piano highlights keys dynamically to guide the user.\u00a0The experimental results demonstrate high accuracy in note detection\u00a0and significant improvements in the learning curve for beginners, reducing cognitive load, and bridging the gap between sheet\u00a0music interpretation and piano playing. This work highlights the potential of combining document image analysis and VR technologies\u00a0to revolutionize music education, as well as other related fields, offering a scalable and accessible solution.","Currently, document parsing technology is facing\u00a0the problem of \u201ctask silos\u201d caused by fragmented datasets. With\u00a0the widespread application of deep learning in document understanding, the construction of a unified and shared dataset for collaborative development of upstream and downstream tasks has become\u00a0an inevitable trend. We have built the first UniOne document dataset that supports the parsing of upstream and downstream tasks.\u00a0By systematically integrating tasks such as layout analysis, text\u00a0line detection and recognition, and table recognition, we\u00a0have innovatively established a cross-task annotation dataset.\u00a0This dataset: (1) at the layout analysis level, includes 236,790 paragraph-level annotations across 14,481 pages, covering\u00a011 semantic categories; (2) at the text line detection level, based\u00a0on the layout analysis data, further adds fine-grained annotations\u00a0for 340,890 lines in 198,901 text paragraphs; (3) for complex scenarios, it introduces 8,000 challenging handwritten mathematical expressions, 18,717 printed mathematical formulas, 26,849 formula texts with unified recognition annotations, and 1,169 tables extracted from papers to fully support document content parsing.\u00a0To our knowledge, this dataset is the first to achieve cross-task\u00a0joint modeling from macro layouts to micro elements, breaking through\u00a0the limitations of traditional single-task datasets and providing essential infrastructure for building the next generation\u00a0of intelligent document parsing systems. The UniOne dataset can\u00a0be accessed here: https://github.com/MaxTEX310/UniOne .","Table structure recognition (TSR) and optical character recognition (OCR) play crucial roles in extracting structured\u00a0data from tables in scientific documents. However, existing extraction frameworks built on top of TSR and OCR methods often fail\u00a0to quantify the uncertainties of extracted results. To obtain highly accurate data for scientific domains, all extracted data must\u00a0be manually verified, which can be time-consuming and labor-intensive. We propose a framework that performs uncertainty-aware\u00a0data extraction for complex scientific tables, built on conformal prediction, a model-agnostic method for uncertainty quantification (UQ). We explored various uncertainty scoring methods to aggregate the uncertainties introduced by TSR and OCR. We rigorously evaluated the framework using a standard benchmark and an in-house dataset consisting of complex scientific tables in six scientific domains. The results demonstrate the effectiveness of using UQ for extraction error detection, and by manually verifying only 47% of extraction results, the data quality can be improved by 30%. Our\u00a0work quantitatively demonstrates the role of UQ with the potential\u00a0of improving the efficiency in the human-machine cooperation process\u00a0to obtain scientifically usable data from complex tables in scientific documents. All code and data are available on GitHub\u00a0at https://github.com/lamps-lab/TSR-OCR-UQ/tree/main .","In this study, we propose a novelty detection algorithm to enhance the performance of end-to-end few-shot document classification in real applications. The novelty detector eliminates ambiguous results and improves the precision of the final outcome. The detector can be integrated with various types of few-shot classifiers. The proposed method is evaluated on both private and public administrative datasets. Experimental results indicate that our proposed novelty detector efficiently removes ambiguous results of not only from few-shot categories but also from base categories, thereby significantly improving the precision across all categories. Furthermore, the best-performing few-shot classifier, when combined with our detector, reduces the error rate on the private dataset from 2.66% to only 0.96%, while maintaining a high recall of 95.64%. On the public RVL-CDIP dataset, the detector significantly lowers the error rate from 40%, which is impractical, to just 4.64%, making it feasible for real-world applications.","Intent classification in question answering systems\u00a0is vital for providing accurate and relevant answers. In the area\u00a0of apple pest and disease inquiries, challenges are presented\u00a0by semantic complexity and word-order dependency. To tackle\u00a0these obstacles, we proposed an Attention-enhanced Bidirectional\u00a0Gated Recurrent Unit and Multi-level Convolutional Neural Network (Att-BiGRU-MulCNN) model. First, the Bidirectional Gated Recurrent Unit (BiGRU) is utilized to capture the temporal dependencies\u00a0in farmers\u2019 queries. It models the semantic relationships within\u00a0these queries. Concurrently, an attention mechanism is integrated into\u00a0the BiGRU, which is pivotal in highlighting the key features, ensuring that the model focuses on the most relevant information. Subsequently, at the classification layer, a Multi-level Convolutional Neural Network (MulCNN) is incorporated. The MulCNN capitalizes on multi-level convolutional kernels to extract\u00a0local semantic features from the queries. This extraction process bolsters the model\u2019s discriminative ability, enabling it to efficiently distinguish between diverse intent categories. Finally, the proposed Att-BiGRU-MulCNN model is evaluated on a self-constructed dataset. This dataset comprises 47,762 apple-related queries, which\u00a0were manually labeled into nine predefined intent categories.\u00a0The experiment results demonstrate that the proposed approach outperforms five benchmark intent classification models in terms\u00a0of accuracy, recall, and F1 score. The Att-BiGRU-MulCNN\u00a0model accomplishes precise intent recognition in the domain of apple\u00a0pest and disease inquiries, thereby providing a reliable solution to\u00a0this problem.","Handwriting exhibits distinctive individual characteristics, making it a crucial biometric modality for forensic document examination and legal authentication. In this paper,\u00a0we propose a graph convolutional teacher-student framework for writer inspection using single handwritten word samples. Our approach integrates both writer identification and verification networks\u00a0to enhance reliability and robustness. We first train a teacher\u00a0model for writer identification and then distill its knowledge into\u00a0a student model for writer verification. Both models leverage\u00a0Graph Convolutional Networks (GCNs) to learn discriminative writer-specific representations from handwriting graph structures. To evaluate our approach, we introduce a new dataset comprising intra-variable handwritten word samples collected intermittently over several months. This dataset contains 79 distinct English words, each written 6 times by 100 different writers, resulting in a total of 47400 handwritten word images. Additionally,\u00a0we tested our model on some benchmark datasets to ensure its robustness and generalizability. Experimental results demonstrate that\u00a0our method achieved promising performances in both identification\u00a0and verification tasks, outperforming state-of-the-art approaches.\u00a0These findings highlight the effectiveness of graph-based handwriting analysis in capturing intra-writer variations and the benefits\u00a0of knowledge distillation for efficient writer inspection.","Efficient data annotation remains a critical challenge\u00a0in machine learning, particularly for object detection tasks requiring extensive labeled data. Active learning (AL) has emerged as\u00a0a promising solution to minimize annotation costs by selecting\u00a0the most informative samples. While traditional AL approaches primarily rely on uncertainty-based selection, recent advances suggest\u00a0that incorporating diversity-based strategies can enhance sampling efficiency in object detection tasks. Our approach ensures\u00a0the selection of representative examples that improve\u00a0model generalization. We evaluate our method on two benchmark datasets (TableBank-LaTeX, TableBank-Word) using state-of-the-art\u00a0table detection architectures, CascadeTabNet and YOLOv9. Our results demonstrate that AL-based example selection significantly outperforms random sampling, reducing annotation effort given\u00a0a limited budget while maintaining comparable performance to\u00a0fully supervised models. Our method achieves higher mAP scores within\u00a0the same annotation budget.","Handwritten text erasion plays a pivotal role in enabling efficient digital archiving and enhancing examination\u00a0paper reusability within educational systems. Current methods, however, encounter performance bottlenecks due to limited receptive fields\u00a0of conventional convolution kernels when processing complex\u00a0page layouts and overlapping text scenarios. To address this challenge, we propose ExamCleaner, a novel handwritten text removal method\u00a0that integrats the Inception Large Kernel Convolution (ILKC) module\u00a0and the Context Anchor Attention (CAA) mechanisms. ExamCleaner\u00a0first expands the model receptive field through the ILKC module\u00a0and employs parallel multi-scale depthwise convolution to simultaneously capture long-range contextual dependencies and local texture details, thereby effectively distinguishing handwritten and printed text. Then, to alleviate the structural degradation of the original content throughout the erasure phase, the CAA mechanism dynamically anchors key contextual regions (e.g., formula layout,\u00a0table boundaries) through learnable spatial channel attention to prevent accidental deletion of original content during the restoration process. Experiments conducted on the EnsExam benchmark validate\u00a0the superior effectiveness of ExamCleaner in handwritten text removal tasks, achieving a remarkable PSNR of 33.45\u00a0dB and SSIM of 0.955.","Scene text segmentation is crucial for applications\u00a0such as document analysis and text removal. however, existing methods face challenges due to their reliance on costly pixel-level annotations and limited generalizability. Although deep learning models and the Segment Anything Model (SAM) have advanced segmentation technology, their direct application to\u00a0text segmentation suffers from domain gaps. To address this issue,\u00a0we propose CHSAM, a SAM-based framework with a Conv2d-Adapter\u00a0(an adapter with 2D convolution) and hierarchical decoding. First,\u00a0the Conv2d-Adapter fine-tunes SAM\u2019s image encoder using lightweight convolutional layers, enhancing local text feature extraction\u00a0while significantly reducing the number of trainable parameters. Second, through convolutional feature augmentation and mask feature augmentation, a two-stage decoder extracts and enhances implicit sparse embeddings from image embeddings to refine text features\u00a0and boundary granularity. Experiments on benchmark datasets demonstrate that CHSAM achieves superior segmentation performance, significantly outperforming the baseline SAM in terms of robustness to deformed text and unseen scenarios. Additionally, CHSAM supports efficient end-to-end inference without requiring complex post-processing steps.","Text detection in images of adverse situations like underwater images and open day and night environments, where one can expect the effect of shaky and non-shaky cameras, is challenging. This work aims to develop a new model that can cope with the challenges of different domains, namely, underwater images, shaky and non-shaky images, and normal scene images for text detection. The approach leverages the Fourier attention and kernels to enhance feature extraction, focusing on high-frequency components associated with text edges. These features are fed to dual-stream corner detection by employing vertical and horizontal pooling for robust text detection. Additionally, we introduce a cross-star deformable convolution layer, guided by Fourier-derived information, which dynamically adapts its receptive field to achieve precise bounding box localization. Bounding box predictions are iteratively refined using heatmaps and offset adjustments. Overall, by integrating frequency-domain analysis with spatially adaptive convolutional operations, our method excels across diverse text detection scenarios without requiring domain-specific adaptations. The performance of the proposed method is demonstrated by testing on three different datasets: underwater, shaky and non-shaky images, and normal natural scene images. The results show that the proposed method achieves state-of-the-art performance compared to the existing methods.","Stroke classification remains challenging due to variations in writing style, ambiguous content, and dynamic writing positions. The core challenge in stroke classification is modeling the semantic relationships between strokes. Our observations indicate that stroke interactions are typically localized, making it difficult for existing deep learning methods to capture such fine-grained relationships. Although viewing strokes from a point-level perspective can address this issue, it introduces redundancy. However, by selecting reference points and using their sequential order to represent strokes in a fine-grained manner, this problem can be effectively solved. This insight inspired StrokeNet, a novel network architecture encoding strokes as reference pair representations (points + feature vectors), where reference points enable spatial queries and features mediate interaction modeling. Specifically, we dynamically select reference points for each stroke and sequence them, employing an Inline Sequence Attention (ISA) module to construct contextual features. To capture spatial feature interactions, we devised a Cross-Ellipse Query (CEQ) mechanism that clusters reference points and extracts features across varying spatial scales. Finally, a joint optimization framework simultaneously predicts stroke categories via reference points regression and adjacent stroke semantic transition modeling through an Auxiliary Branch (Aux-Branch). Experimental results show that our method achieves state-of-the-art performance on multiple public online handwritten datasets. Notably, on the CASIA-onDo dataset, the accuracy improves from 93.81 $$\\%$$ % to 95.54 $$\\%$$ % , demonstrating the effectiveness and robustness of our approach.","This paper introduces HisDoc-DETR, a novel set prediction-based approach for historical document layout analysis. The method specifically addresses the unique challenges of analyzing historical Chinese documents, particularly their sparse foreground characteristics and complex layout structures. HisDoc-DETR incorporates three key modules: (1) a semantic relationship learning module based on Transformer architecture that effectively captures long-range dependencies in document layouts, (2) a dual-stream feature fusion module that intelligently combines high-level semantic features with low-level details through channel and spatial coordinate attention mechanisms, and (3) a GIoU-aware prediction head that enhances layout localization accuracy by linking classification confidence with localization quality. Extensive experiments on the SCUT-CAB dataset demonstrate that HisDoc-DETR significantly outperforms existing methods, achieving improvements of 4.1% and 3.2% in AP metrics for logical and physical layout analysis respectively compared to the DINO baseline. The method shows particular strength in handling complex historical document layouts, achieving state-of-the-art performance across most layout categories.","The rapid growth of scientific literature creates a pressing need for tools that can efficiently distill complex research papers into accessible formats. The existing approaches for automated slide generation from papers primarily focuses on textual content, but overlook the critical role of visual elements in scientific communication. We propose Paper2PPT, a novel framework that generates the visual presentation of scientific papers, prioritizing the integration of visual elements and their explanatory contexts through systematic cross-modal alignment. Our approach addresses key challenges in aligning visual elements with their associated text, including robust caption localization, morphology-aware OCR consolidation, and caption-anchored visual-semantic reasoning. By leveraging document structure heuristics and spatial reasoning, the framework establishes precise figure-text relationships without requiring multimodal training data. The experiments show that the proposed method can generate a more accurate and comprehensive visual representation of scientific papers.","Handwritten mathematical expression generation (HMEG) is a challenging task due to the complex structure and significant symbol distortion. In addition, the wide variety of handwriting styles, e.g. , variations in symbol size and slant, aggravates the difficulties of the HMEG. In this paper, we propose a novel Visual-aware Multi-Representation Fusion Network ( VMF-Net ) to tackle the challenging HMEG task. Specifically, we introduce a Multi-Representation Enhanced Generator (MEG) that guides the generation process by various visual attributes, such as high-frequency components and expression prototypes, in conjunction with structural features. Additionally, we design a Progressive Fusion Module (PFM) to capture interactions between visual features, while an Adaptive Filter (AF) suppresses redundant style features. Extensive experiments on widely used benchmark datasets demonstrate that our VMF-Net is an effective HMEG model and outperforms state-of-the-art models remarkably.","Document Key Information Extraction (KIE) is a technology that transforms valuable information in document images into structured data, and it has become an essential function in industrial settings. However, current evaluation metrics of this technology do not accurately reflect the critical attributes of its industrial applications. In this paper, we present KIEval, a novel application-centric evaluation metric for Document KIE models. Unlike prior metrics, KIEval assesses Document KIE models not just on the extraction of individual information (entity) but also of the structured information (grouping). Evaluation of structured information provides assessment of Document KIE models that are more reflective of extracting grouped information from documents in industrial settings. Designed with industrial application in mind, we believe that KIEval can become a standard evaluation metric for developing or applying Document KIE models in practice. Source code of our work is publicly available at: https://github.com/UpstageAI/KIEval .","Manual digitization of bibliographic metadata is time consuming and labor intensive, especially for historical and real-world archives with highly variable formatting across documents. Despite advances in machine learning, the absence of dedicated datasets for metadata extraction hinders automation. To address this gap, we introduce BiblioPage, a dataset of scanned title pages annotated with structured bibliographic metadata. The dataset consists of approximately 2,000 monograph title pages collected from 14 Czech libraries, spanning a wide range of publication periods, typographic styles, and layout structures. Each title page is annotated with 16 bibliographic attributes, including title, contributors, and publication metadata, along with precise positional information in the form of bounding boxes. To extract structured information from this dataset, we evaluated object detection models such as YOLO and DETR combined with transformer-based OCR, achieving a maximum mAP of 52 and an F1 score of 59. Additionally, we assess the performance of various visual large language models, including LlamA 3.2-Vision and GPT-4o, with the best\u00a0model reaching an F1 score of 67. BiblioPage serves as a real-world benchmark for bibliographic metadata extraction, contributing to document understanding, document question answering, and document information extraction. Dataset and evaluation scripts are available at: https://github.com/DCGM/biblio-dataset .","Scene text analysis stands as a cornerstone of computer vision, with logical layout analysis emerging as a pivotal component for decoding the semantic roles of text regions and advancing scene understanding. While previous research has primarily focused on structured documents, scene text poses unique challenges due to its unstructured and visually diverse nature. In this work, we extend logical layout analysis to signboard images, a domain characterized by complex backgrounds, irregular text placements, diverse viewpoints, unique fonts, varying text sizes, and personalized design styles. These challenges make scene text layout analysis a critical yet underexplored research problem with significant real-world implications. To bridge this gap, we introduce a new benchmark dataset comprising 2,025 manually annotated images from diverse urban environments, containing 44,227 text instances across 9 semantic categories commonly found in signboards. Additionally, we evaluate state-of-the-art logical layout analysis methods on this dataset, providing valuable insights into the challenges and opportunities within this domain. The dataset and code are publicly available (GitHub Repository: https://github.com/Yangchann/LLASignboard .), fostering further advancements in scene text understanding","This paper addresses the remote verification of the authenticity of Optically Variable Devices (commonly known as holograms) on identity documents. Typically placed over the cardholder\u2019s photo, these devices provide strong and easily verifiable security for human inspection but pose challenges for automated verification. Existing approaches easily cover static frauds (e.g., paper photocopy) and can be evaluated for such, but their capacity to detect real, dynamic fraud cases (e.g., handcrafted hologram) has not been evaluated to date because of the lack of public datasets. Furthermore, they are usually trained to detect known attack types, and few of them can generalize to new, unseen attacks. This work features three contributions to address these limitations: 1) a new public dataset, MIDV-DynAttack, which extends the existing MIDV-Holo dataset with realistic, static, and dynamic attacks against identity document specimens, tripling the number of attack samples compared to the original dataset, 2) a novel verification method which can assess the authenticity of a specific hologram thanks to the analysis of its dynamic behavior and appearance, can be trained without dynamic attack samples, and exhibits new state-of-the-art performance, 3) a benchmark of existing approaches which follows a clear evaluation protocol and emphasizes the inability of other approaches to deal with dynamic attacks, as well as new challenging attacks to deal with. Code and dataset are publicly available at https://github.com/EPITAResearchLab/pouliquen.25.icdar .","Vast amounts of medieval notarial documents have been preserved and digitized in Catalan archives. These collections provide invaluable insights into life in the Middle Ages. To harness their full potential, documents need to be accurately transcribed. This paper introduces a new dataset for the task of handwritten text recognition on medieval manuscripts, focusing on notarial charters written on parchment from the 13th to 15th centuries. Our dataset is comprised of 100 digitized manuscripts (3,369 lines), carefully selected to represent the large variation that is present in the sources, encompassing at least 80 distinct hands, various document types (from sales and inventories to last wills and marriage contracts), and spanning three centuries. Written primarily in Medieval Latin with fragments in Medieval Catalan, these manuscripts exhibit varying stages of preservation and degrees of deterioration, resulting in a very diverse dataset. Recent years have seen impressive advancements in automatic handwriting recognition of historical manuscripts, with significant effort put into creating general models that perform well across several centuries and scripts. The experiments on our dataset show that these models are still far from providing a generalizable solution, but nevertheless provide a good foundation to fine-tune robust models when used in combination with a carefully curated dataset. We report a series of experiments using an extensive and nuanced evaluation approach that demonstrates the importance of data selection for achieving an accurate transcription of historical manuscripts.","Scene script identification is a pivotal research topic in the field of computer vision, aiming to accurately determine the script or language category of text within complex scene images. However, traditional script identification techniques often fall short in meeting the demands for feature robustness due to challenges such as the multilingual nature of scene text, font diversity, and background complexity. This paper presents a novel scene script identification model using dense hierarchical semantic fusion, which significantly enhances both accuracy and robustness through multi-level feature fusion and semantic enhancement. Specifically, by optimizing a joint loss function, the model employs a densely connected structure to achieve effective aggregation of cross-layer features and incorporates the attention mechanism to strengthen semantic information, thereby more efficiently capturing both global and local features of the text. Experimental results on publicly available datasets demonstrate that the proposed method outperforms existing mainstream approaches in identification performance on certain datasets. This research provides an innovative solution for scene script identification based on the Vision Transformer architecture, highlighting its broad application potential.","Handwritten Mathematical Expression Recognition (HMER) is crucial for enhancing human-machine interaction in domains such as digitized education and automated document processing. While existing transformer-based methods employ coverage mechanisms to capture context, they often still lose critical cues that a human could quickly correct. To address this, we propose Mask CoMER, a two-stage training approach that combines a novel Masked Language Model Pretraining objective with stochastic depth regularization. This method enhances contextual understanding and mitigates information loss, leading to improved recognition accuracy. Experiments on the CROHME 2014, 2016, and 2019 datasets demonstrate that Mask CoMER achieves state-of-the-art ExpRates of 64.56%, 63.03%, and 65.22%, respectively. These results outperform the baseline CoMER by up to 5% and surpass the previous SOTA by nearly 2%. These results underscore the robustness and effectiveness of our approach for HMER tasks\u00a0 $$^{1}$$ 1 .( $$^{1}$$ 1 The code is available at\u00a0 GitHub )","Robust handwritten text recognition (HTR) systems require diverse and abundant annotated data, which can be expensive to acquire. Unlike commonly used methods, such as transfer learning and data augmentation, that reduce the need for labeled data, this article proposes a novel self-supervised handwritten text recognition (HTR) framework to eliminate that need: self-HTR. Self-HTR leverages a high-level loss that informs about the textual dissimilarity between an input image and an image generated with a pretrained generative adversarial network containing the network\u2019s predicted text. Based on preliminary experiments with handwritten character recognition, experiments were conducted on the IAM dataset for word recognition. Self-HTR was implemented by integrating the generative architecture GANwriting with a CNN-BLSTM architecture. Experiments were conducted with two image-based and two style-invariant losses. Trained on IAM images recreated with GANwriting and using transfer learning, self-HTR achieved a character- and word error rate of 0.44% and 1.56% on recreated test data. While on simulated data, these results indicate the potential of self-HTR on real data. Future research is necessary to validate the framework further on real data and use high-quality handwritten text generation models.","Chinese characters are logographic in nature and possess complex compositional structures, making their recognition inherently challenging, particularly in handwritten form. Zero-shot recognition of Chinese characters further exacerbates this challenge. By leveraging the inherent structural properties of Chinese characters, it is possible to extract fine-grained structural information essential for effective recognition. Most current recognition methods rely on hard-coded representations of characters or radicals, overlooking the inherent flexibility and compositional similarity among them. This paper presents a novel radical encoding and information extraction module. The radical encoding module is built upon fine-tuning the CLIP model to learn continuous representations of radicals and their structural relationships. The information extraction module parses the radical sequence into a tree structure and extracts information to generate embeddings. We also evaluate the similarity between image features and embeddings. Our approach can also be used for zero-shot learning recognition tasks demonstrating superior performance compared to existing methods. To the best of our knowledge, this is the first work to fine-tune CLIP for continuous radical encoding while simultaneously integrating radical sequence information for enhanced recognition. Experimental results on zero-shot handwritten Chinese character recognition show that our method outperforms existing approaches, highlighting the effectiveness of the proposed methodology.","As rich sources of history, maps provide crucial insights into historical changes, yet their diverse visual representations and limited annotated data pose significant challenges for automated processing. We propose a simple yet effective approach for few-shot segmentation of historical maps, leveraging the rich semantic embeddings of large vision foundation models combined with parameter-efficient fine-tuning. Our method outperforms the state-of-the-art on the Siegfried benchmark dataset in vineyard and railway segmentation, achieving +5% and +13% relative improvements in mIoU in 10-shot scenarios and around +20% in the more challenging 5-shot setting. Additionally, it demonstrates strong performance on the ICDAR 2021 competition dataset, attaining a mean PQ of 67.3% for building block segmentation, despite not being optimized for this shape-sensitive metric, underscoring its generalizability. Notably, our approach maintains high performance even in extremely low-data regimes (10- &amp; 5-shot), while requiring only 689k trainable parameters \u2013 just 0.21% of the total model size. Our approach enables precise segmentation of diverse historical maps while drastically reducing the need for manual annotations, advancing automated processing and analysis in the field. Our implementation is publicly available at: https://github.com/RafaelSterzinger/few-shot-map-segmentation .","Automatic text recognition for contemporary and historical printed\u00a0or handwritten works has become a crucial tool in the inventory of\u00a0many humanities scholars employing digital methods, but few retrodigitization software packages are adapted to this environment with its unparalleled diversity, domain-specific conventions, and low-resource settings. We examine how the design principles behind kraken, a freely-licensed\u00a0ATR engine optimized for use on historical and non-Latin script documents, pertain to specific use cases encountered in the humanities and allow it\u00a0to be easily adapted to process even highly non-conventional material.\u00a0In addition, we shine a light on the significant functional additions, performance enhancements, and quality of life improvements added in its recent version 5 stable releases. Among these are advanced reading order support including trainable reading order, unsupervised recognition pretraining,\u00a0and a new public model repository with enhanced metadata. The latest release of the software can be found at https://kraken.re","Oracle bone inscriptions, the oldest known Chinese writing system, pose formidable challenges in character recognition and interpretation due to the large number of undeciphered characters and the scarcity of labeled data. In this paper, we introduce OracleGCD, an enhanced framework that adapts Generalized Category Discovery (GCD) to oracle bone inscriptions, which simultaneously handles the recognition of known characters and the discovery and clustering of novel categories. Specifically, OracleGCD uses a stroke-aware asymmetric view augmentation mechanism, which utilizes dual-grained\u00a0(coarse- and fine-grained) augmentations to extract more discriminative features. Coarse-grained augmentation applies data transformations to the entire image while fine-grained one first uses adaptive threshold segmentation to extract salient stroke regions and then applies targeted transformations to these key areas to optimize local feature representation. Furthermore, we propose the confidence-guided collaborative feature learning, which predicts the pseudo-labels of unlabeled samples based on the logit output of the model, enabling the use of unlabeled data in supervised contrastive learning. We also implement a logit adjustment strategy to address the long-tailed class distribution in the dataset. Extensive experiments demonstrate that our framework sets new performance benchmarks for the discovery of oracle bone character. It significantly outperforms strong baselines in both known character recognition and novel category identification and cluster, advancing the automated analysis of oracle bone inscriptions and potentially aiding in deciphering ancient Chinese scripts.","Article separation for historical newspapers is an important task in the analysis of historical documents. But so far, it remains an under-researched area. Since historical newspapers themselves have two modalities, text, and image, this requires multimodal processing for information extraction. To tackle this task while accounting for the unique characteristics of historical newspapers, we propose an article separation model using a multimodal transformer structure. This model processes the newspaper image along with the bounding boxes and text content of its text blocks, linking them based on a predefined rule to reconstruct the overall page structure. The text and image information of the connected text blocks are then fed into a cross-modal transformer, and the classifier determines whether the connections between the text blocks need to be removed or not. The text blocks that remain connected are recognized as forming an article. A mask method is used to allow the image to reflect the positional relationships of the text blocks. We evaluated our architecture on two datasets, Neweye\u2019s NLF and BNF. The results demonstrate that Ar-Q-former significantly outperforms similar structural modeling methods, achieving up to 19% points higher AR $$_{F1}$$ F 1 on NLF and 22% points on BNF. It also reaches a performance level comparable to the reading order simulation method. However, there remains an approximate 10% point gap in mACS mPPA compared to rule-based methods, which are specifically tailored to these datasets. Nevertheless, Ar-Q-former exhibits greater generalizability. Additionally, this approach introduces multimodal text-image analysis and interaction compared to previous studies by innovatively incorporating the mask-image method to capture visual and positional information between text blocks.","Manuscript fragments repurposed in book bindings contain valuable historical text, yet reading these hidden texts presents significant challenges. Multispectral and hyperspectral imaging (MSI and HSI), followed by spectral unmixing, are commonly used to enhance text visibility. However, additional layers of paper make the recovery process particularly difficult. The resulting text images are often blurry and unrecognizable to both human experts and Optical Character Recognition (OCR) systems. Furthermore, the problem is compounded by the lack of sufficient representative data for training deep learning-based restoration models. In this paper, we systematically examine the challenges of recovering readable text images from bookbinding fragments, with a focus on fragments on Herlufsholm 24.1 as a case study. These fragments are part of the Herlufsholm Collection at the University Library of Southern Denmark. We begin with a comparative analysis of MSI and HSI to evaluate their effectiveness in revealing text, highlighting their respective advantages and limitations. To assess the impact of overlaid materials, we conduct a controlled experiment using artificial samples, capturing hyperspectral images of both covered and uncovered text. Additionally, we analyze blur maps to investigate whether the observed blurriness is uniform and whether common models, such as Gaussian blur, adequately represent it. Finally, we explore the effectiveness of existing deblurring models, identifying key limitations, and discussing potential strategies for improving text readability. This study provides a structured analysis of the obstacles at each stage of the process, from imaging to post-processing and deblurring, offering insight into the best practice for recovering text hidden in bindings.","The Manchu archives are historical records formed during the Qing Dynasty in China and hold significant value. Word recognition is crucial for their protection and development. However, the degradation of word images caused by ink infiltration, expansion, discoloration, and stains due to long-term storage makes it difficult for traditional visual model-based word recognition methods to achieve good performance. To address this problem, this paper draws on the visual-language model MATRN proposed in the field of scene image recognition, and overcomes the impact of word image degradation by introducing the visual masking mechanism of VisionLAN and the language masking mechanism of ABINet, thereby constructing a Manchu archives word recognition method based on a visual-language model. The backbone network employs a ResNet architecture combined with attention mechanisms for feature extraction. The visual module generates character-level masked features through the MLM sub-module. Subsequently, the VRM sub-module infers the masked words based on visual context information, thereby enhancing the contextual reasoning ability of the model. The language module conducts masked training through BCN, allowing each character to simultaneously attend to adjacent context information, thereby strengthening the error correction capability of the model. The experimental results show that the method proposed in this paper is superior to traditional methods and can achieve an accuracy of 98.68% on the real Manchu archives dataset.","This paper introduces TamMe, an optimized Thai-English spoken question answering (QA) system designed specifically for robust real-time interactions in open environments under constrained computational resources. Unlike conventional text-based QA systems, TamMe supports natural speech interactions by effectively integrating bilingual automatic speech recognition (ASR), semantic FAQ retrieval, text-to-speech (TTS) synthesis, and multimodal avatar-driven responses. TamMe significantly enhances efficiency and accuracy through innovative techniques, including Faster-Whisper accelerated with pre-ASR language identification, reducing GPU memory usage by approximately 60% while achieving a low word error rate of 5.72% for Thai and 8.54% for English. To address noisy real-world conditions in open environment, TamMe employs spatial-cue preserving speech enhancement and multi-stage adaptive noise suppression, achieving a retrieval Precision@1 of 89.7%. Semantic retrieval performance is optimized via multilingual embedding-based indexing, ensuring accurate responses to paraphrased and multilingual spoken queries. Additionally, speaker-adaptive TTS and precomputed SadTalker-based 3D avatar animations enable visually expressive, synchronized multimodal interactions without compromising real-time responsiveness. Experimental evaluations in a realistic kiosk setup demonstrate that TamMe effectively balances accuracy, computational efficiency, and user engagement.","Logs play a crucial role in modern software development by providing essential runtime information. Automated log analysis begins with log parsing, which transforms unstructured log data into a structured format. In AIOps (Artificial Intelligence for IT Operations), log parsing is a fundamental step that enables downstream tasks such as anomaly detection and root cause analysis. Traditional log parsing methods, including heuristic rules, regular expressions, and statistical approaches, often struggle with unseen log formats, noisy data, and evolving system logs. Meanwhile, deep learning-based methods require model tuning on fixed training log files, limiting their adaptability to diverse log formats in AIOps environments. To address these challenges, we propose XLog, an efficient log parsing framework that integrates two key components: (1) a Search Tree, which efficiently organizes and matches known log templates to reduce redundancy and computational overhead, and (2) an LLM-based Template Extractor, which dynamically identifies new log templates using in-context learning with carefully designed prompts, enabling adaptation to previously unseen log formats. This hybrid approach ensures both efficiency and flexibility in log parsing. We evaluated XLog on 16 widely used public datasets, and experimental results demonstrate that our framework achieves superior log parsing accuracy (98% average parsing accuracy).","Key Information Extraction (KIE) from documents is a crucial task in many applications, but the creation of training datasets for KIE models is traditionally a time-consuming and expensive manual process. In this paper we introduce a novel Framework DocAnnot that significantly accelerates and reduces the cost of KIE dataset generation. Our framework leverages a Large Vision Language Model (LVLM) for label value extraction, Optical Character Recognition (OCR) for text and bounding box detection, and a novel Spatially Informed Contextual Matching (SICM) algorithm to accurately associate extracted values with their corresponding labels. SICM enhances label-value association by incorporating spatial relationships and proximity analysis alongside textual matching. We evaluate our framework on two benchmark KIE datasets, CORD and SROIE, demonstrating its ability to automatically generate annotations with reasonable accuracy (achieving F1-scores of 0.679 and 0.846). Furthermore, we investigate the effectiveness of using the auto-annotated data for fine-tuning downstream KIE models. While models trained on human-annotated data achieve superior performance, our experiments show that models trained exclusively on auto-annotated data still attain respectable performance levels (e.g., LayoutLMv3 achieving an F1-score of 0.6765 on CORD). These results demonstrate that while our framework significantly reduces reliance on manual annotation, it does not yet fully eliminate the need for human intervention. However, by automating the annotation process to a point where human reviewers can efficiently verify and refine the outputs, our system enables near-perfect annotations with far greater efficiency than manual annotation from scratch. This approach offers substantial time and cost savings while optimizing the balance between automation and accuracy, making it particularly valuable for resource-constrained settings and rapid model prototyping.","Optical Character Recognition (OCR) for Indian languages is challenging due to diverse scripts, complex characters, and varied writing styles. This work presents HindiOCR-VLM , a Vision-Language Model adapted for Hindi OCR using Low-Rank Adaptation (LoRA) on a model pre-trained for Chinese and English. We explore two adaptation strategies: (i) a single-stage model that directly predicts text at the page level\u2014bypassing intermediate word or line detection\u2014focused on printed documents, and (ii) a two-stage model for multi-domain scenarios (printed, handwritten, and scene text), which first detects words and then recognizes them individually. Inspired by human learning processes, we propose a progressive learning approach\u2014a training strategy to the single-stage model to enhance language acquisition and accelerate convergence. Leveraging the vision encoder\u2019s rich representations, our method enables effective multi-domain training. Experimental results and ablation studies show that HindiOCR-VLM handles the complexities of the Devanagari script well and outperforms domain-specific models, offering a unified and robust solution for Hindi OCR. Code and resources are available at:\u00a0 https://hindiocr-vlm.github.io/ .","Text samples captured in natural scenes often come from different scripts written in various directions, resulting in significant diversities in character set, orientation, and text length. Current methods handle such diversities by routing input images to corresponding (sub)modules with hardwired rules that are usually tied to image aspect-ratio ranges. However, setting hardwired rules requires extensive knowledge of the testing data and model-building experience, hence is often suboptimal. To resolve this, we propose an end-to-end trainable watch-and-act (WnA) framework, which first watches thumbnails to generate a routing plan and then routes the samples to corresponding experts to produce the recognition results. The framework shows a significant robustness improvement over the corresponding rule-based baselines by 2% of line accuracy on the recent multi-orientation open-set text recognition benchmark. The proposed framework, as a system, also shows 3\u201310% line accuracy advantages over previous open-set text recognition methods on horizontal samples.","Medical document analysis plays a crucial role in extracting essential clinical insights from unstructured healthcare records, supporting critical tasks such as differential diagnosis. Determining the most probable condition among overlapping symptoms requires precise evaluation and deep medical expertise. While recent advancements in large language models (LLMs) have significantly enhanced performance in medical document analysis, privacy concerns related to sensitive patient data limit the use of online LLMs services in clinical settings. To address these challenges, we propose a trustworthy medical document analysis platform that fine-tunes a LLaMA-v3 using low-rank adaptation, specifically optimized for differential diagnosis tasks. Our approach utilizes DDXPlus, the largest benchmark dataset for differential diagnosis, and demonstrates superior performance in pathology prediction and variable-length differential diagnosis compared to existing methods. The developed web-based platform allows users to submit their own unstructured medical documents and receive accurate, explainable diagnostic results. By incorporating advanced explainability techniques, the system ensures transparent and reliable predictions, fostering user trust and confidence. Extensive evaluations confirm that the proposed method surpasses current state-of-the-art models in predictive accuracy while offering practical utility in clinical settings. This work addresses the urgent need for reliable, explainable, and privacy-preserving artificial intelligence solutions, representing a significant advancement in intelligent medical document analysis for real-world healthcare applications. The code can be found at https://github.com/leitro/Differential-Diagnosis-LoRA .","Short video platforms have rapidly emerged as a primary source of news consumption, offering engaging and easily digestible content. However, their widespread popularity has also facilitated the proliferation of fake news, posing a significant societal concern and exacerbating the challenge of misinformation control. Unlike traditional text-based news, fake news on short video platforms often spreads through a combination of textual, visual, and auditory elements, making detection particularly complex. Existing methods leveraging multimodal features struggle to capture deep semantic associations and lack effective fusion mechanisms, resulting in limited cross-modal interactions and suboptimal feature representation. Furthermore, simple feature concatenation or linear weighting may fail to fully exploit the complementary information across modalities. To address these challenges, we propose DAFSVFND, a novel multimodal fusion network that incorporates a stacked text-guided dual attention mechanism to facilitate deep interaction and fusion among textual, visual, and auditory features. By strengthening cross-modal dependencies and refining feature representations, our approach enhances the model\u2019s ability to distinguish between real and fake news. Extensive experiments on two large-scale fake news datasets demonstrate that our model significantly outperforms state-of-the-art methods, offering an effective solution for fake news detection on short video platforms.","Document intelligence is a multimodal challenge, requiring both textual content and visual layout cues for accurate interpretation. Traditional text-based models often struggle to capture spatial and structural information, which is essential for document understanding tasks. While decoder-only language models (e.g. GPT-4, LLaMA) excel at text-based reasoning, they often overlook layout dependencies, limiting their effectiveness in tasks like Document Visual Question Answering (DocVQA) and Key Information Extraction (KIE), where text is arranged non-linearly. To address this, we introduce G-LLaMA , which integrates Gaussian biases into the attention mechanism of decoder-only models to enhance spatial reasoning. Unlike prior work that applied spatial biases to encoder-based architectures, our approach conditions LLaMA\u2019s attention on spatial structure, improving layout awareness without requiring additional architectural modifications. Experimental results demonstrate that Gaussian biases significantly increase performance, yielding substantial improvements in both DocVQA and KIE tasks. These findings underscore the importance of explicit spatial conditioning in LLMs for understanding structured documents.","Imagine sitting in a presentation, trying to follow the speaker while simultaneously scanning the slides for relevant information. While the entire slide is visible, identifying the relevant regions can be challenging. As you focus on one part of the slide, the speaker moves on to a new sentence, leaving you scrambling to catch up visually. This constant back-and-forth creates a disconnect between what\u2019s being said and the most important visual elements, making it hard to absorb key details\u2014especially in fast-paced or content-heavy presentations, as in a conference talk. This will require an understanding of slides, especially text, graphics, and layout. We introduce a method that automatically identifies and highlights the most relevant slide regions based on the speaker\u2019s narrat
