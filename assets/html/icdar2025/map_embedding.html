nts in handwritten text generation using diffusion models have achieved high-quality and realistic handwriting synthesis. However, existing models often suffer from limited style variability, which reduces their effectiveness for downstream tasks like Handwriting recognition, writer identification, which rely on diverse handwriting samples to ensure model generalization and robustness. Without sufficient variability, models trained on synthetic data risk overfitting to a narrow set of styles, limiting their applicability in real-world scenarios. Diffusion models typically require large-scale datasets to generalize effectively, but in the domain of handwriting generation, comparatively limited training data is available, leading to strong memorization tendencies. As a result, generated handwriting samples often replicate training data instead of introducing novel variations, further restricting their usefulness for downstream applications. To address this, we propose a training-free style mixing approach that dynamically injects multiple writer styles at inference time, enabling controlled handwriting diversity. Our method leverages a pre-trained diffusion model, allowing flexible writer style transitions at the character level without modifying model weights. By introducing controlled style variation, our approach mitigates memorization effects and enhances the diversity of generated samples, making them more suitable for training and evaluation purposes.","Education is the cornerstone of societal progress, yet automated document layout understanding in the education domain remains significantly under-explored, with most research focusing on individual components like texts, tables, images instead of a holistic understanding. Despite the increasing demand for AI-driven assessment, digitization, and retrieval of educational resources, very few dedicated works exists for question paper layout analysis, a critical component of automated learning systems. To bridge this gap, we introduce the first dataset HiLEx, explicitly designed for structure analysis and layout extraction from question paper images. The HiLEx dataset is curated from eight diverse examination formats. With over 1900 annotations with different structural layouts, covering both single-column and multi-column layouts, ensure robust generalization across different structural variations. We conduct a thorough empirical study with most contemporary object detection models, exposing their limitations in structural understanding, and format generalization. Our findings lay the groundwork for Smart AI solutions in education, fostering automated grading, question retrieval, and equitable learning access. This research aligns with UN Sustainable Development Goals (SDG 4: Quality Education, SDG 10: Reduced Inequalities) by enabling scalable, AI-driven assessment technologies, promoting inclusivity, and revolutionizing educational accessibility worldwide. The HiLEx dataset is publicly available in Github ( https://github.com/HiLEx-DLA/HiLEx ).","Structured document understanding requires capturing both semantic relationships and spatial structures within visually rich documents. While Graph Neural Networks (GNNs) effectively model structured dependencies, they struggle with long-range dependencies and global context awareness, which are strengths of transformers. In this work, we propose Doc2GraphFormer, a hybrid framework that integrates graph-based structured parsing with multi-head attention mechanisms, evolving from GraphSAGE-style message passing to a more expressive graph-enhanced transformer architecture. Additionally, we introduce a novel modality fusion strategy, inspired by LayoutLMv3, to enhance the integration of textual, visual, and structural embeddings. We evaluate Doc2GraphFormer on FUNSD, XFUND, demonstrating its superior performance in semantic entity recognition and relation extraction. Our findings highlight the potential of combining graph reasoning with self-attention for efficient document understanding. Our code will be made available on: https://github.com/biswassanket/doc2graphformer","Recently, Vision Language Models (VLMs) have increasingly emphasized document visual grounding to achieve better human-computer interaction, accessibility, and detailed understanding. However, its application to visualizations such as charts remains under-explored due to the inherent complexity of interleaved visual-numerical relationships in chart images. Existing chart understanding methods primarily focus on answering questions without explicitly identifying the visual elements that support their predictions. To bridge this gap, we introduce RefChartQA, a novel benchmark that integrates Chart Question Answering (ChartQA) with visual grounding, enabling models to refer elements at multiple granularities within chart images. Furthermore, we conduct a comprehensive evaluation by instruction-tuning 6 state-of-the-art VLMs across different categories. Our experiments demonstrate that incorporating spatial awareness via grounding improves response accuracy by over 15%, reducing hallucinations, and improving model reliability. Additionally, we identify key factors influencing text-spatial alignment, such as architectural improvements in TinyChart, which leverages a token-merging module for enhanced feature fusion. Our dataset is open-sourced for community development and further advancements. All models and code will be publicly available at https://github.com/moured/RefChartQA .","Calligraphy represents an invaluable cultural heritage of Chinese civilization. Research on the attribute information of calligraphy, such as styles, dynasties, and calligraphers, holds significant cultural and historical value. However, the styles of Chinese calligraphy characters have evolved dramatically through different dynasties and the unique touches of calligraphers, making it highly challenging to accurately recognize these different characters and their attributes. Furthermore, existing calligraphic datasets are extremely scarce, and most provide only character-level annotations without additional attribute information. This limitation has significantly hindered the in-depth study of Chinese calligraphy. To fill this gap, we present a novel M ulti-Attribute C hinese C alligraphy Character D ataset (MCCD). The dataset encompasses 7,765 categories with a total of 329,715 isolated image samples of Chinese calligraphy characters, and three additional subsets were extracted based on the attribute labeling of the three types of script styles (10 types), dynasties (15 periods) and calligraphers (142 individuals). The rich multi-attribute annotations render MCCD well-suited diverse research tasks, including calligraphic character recognition, writer identification, and evolutionary studies of Chinese characters. We establish benchmark performance through single-task and multi-task recognition experiments across MCCD and all of its subsets. The experimental results demonstrate that the complexity of the stroke structure of the calligraphic characters, and the interplay between their different attributes, leading to a substantial increase in the difficulty of accurate recognition. MCCD not only fills a void in the availability of detailed calligraphy datasets but also provides valuable resources for advancing research in Chinese calligraphy and fostering advancements in multiple fields. The dataset is available at https://github.com/SCUT-DLVCLab/MCCD .","Checkboxes are critical in real-world document processing where the presence or absence of ticks directly informs data extraction and decision-making processes. Yet, despite the strong performance of Large Vision and Language Models across a wide range of tasks, they struggle with interpreting checkable content. This challenge becomes particularly pressing in industries where a single overlooked checkbox may lead to costly regulatory or contractual oversights. To address this gap, we introduce the CheckboxQA dataset, a targeted resource designed to evaluate and improve model performance on checkbox-related tasks. It reveals the limitations of current models and serves as a valuable tool for advancing document comprehension systems, with significant implications for applications in sectors such as legal tech and finance. The dataset is publicly available at: https://github.com/Snowflake-Labs/CheckboxQA .","China has a long and rich history, encompassing a vast cultural heritage that includes diverse multimodal information, such as silk patterns, Dunhuang murals, and their associated historical narratives. Cross-modal retrieval plays a pivotal role in understanding and interpreting Chinese cultural heritage by bridging visual and textual modalities to enable accurate text-to-image and image-to-text retrieval. However, despite the growing interest in multimodal research, there is a lack of specialized datasets dedicated to Chinese cultural heritage, limiting the development and evaluation of cross-modal learning models in this domain. To address this gap, we propose a multimodal dataset named CulTi, which contains 5,726 image-text pairs extracted from two series of professional documents, respectively related to ancient Chinese silk and Dunhuang murals. Compared to existing general-domain multimodal datasets, CulTi presents a challenge for cross-modal retrieval: the difficulty of local alignment between intricate decorative motifs and specialized textual descriptions. To address this challenge, we propose LACLIP, a training-free local alignment strategy built upon a fine-tuned Chinese-CLIP. LACLIP enhances the alignment of global textual descriptions with local visual regions by computing weighted similarity scores during inference. Experimental results on CulTi demonstrate that LACLIP significantly outperforms existing models in cross-modal retrieval, particularly in handling fine-grained semantic associations within Chinese cultural heritage. The dataset and source code are available at: https://github.com/yyyjjy/CulTi .","Financial statements are critical for corporate analysis, fraud detection, and regulatory compliance, yet their complex tabular layouts, multi-year data structures, and hierarchical relationships pose significant challenges for automated reasoning. Existing Visual Question Answering (VQA) models struggle to deliver audit-ready responses due to their inability to explicitly localize evidence and reason over structured financial data. To bridge this gap, we introduce EviFiVQA, a large-scale benchmark dataset for evidence-based financial VQA, built on real-world financial statements. Leveraging FinTabNet, our dataset contains over 1.5 million question-answer pairs spanning five reasoning categories, each meticulously annotated with bounding boxes for relevant table cells to ensure traceable and interpretable responses. EviFiVQA introduces new challenges for Large Language Models (LLMs) and Vision-Language Models (VLMs) by requiring multi-step numerical reasoning, explicit evidence localization, and hierarchical financial aggregation\u2014all within complex, irregular table layouts. We benchmark state-of-the-art models on EviFiVQA, revealing their limitations in evidence-grounded understanding of financial statements. We release EviFiVQA to drive progress in audit-ready financial AI, enhancing transparency and reliability in AI-driven financial analytics. The dataset and code are available at https://github.com/sachinraja13/EviFiVQA","The growing usage of identity documents recognition in day-to-day life increases the need in public datasets with identity documents in various languages. Still, public identity documents datasets mainly cover Latin script-based languages. At the same time, newly emerging countries demonstrate wide adoption of technology in combination with population growth. As a result, competitive identity documents recognition system should include support documents of these countries. In this paper, we present MIDV-UP, where U stands for Urdu and P for Persian, a dataset containing identity documents in these languages. In total, MIDV-UP contains 1000 unique mock identity documents of 4 types, and 9000 fully annotated images of these documents, acquired with different equipment in various conditions. We also provide baselines for the several important tasks in typical identity documents recognition pipeline: document location and identification, per-field segmentation, and fields recognition. The results of the experiments show that the accuracy of the published approaches for the presented identity documents is low, especially in text line recognition task, and that MIDV-UP presents challenges for future research.","We present the first ever dataset of manually segmented and transcribed Ajami manuscripts written in Fulfulde and Hausa. The term Ajami refers to modified Arabic-script orthographies in Africa. Existing handwritten text recognition (HTR) and optical character recognition (OCR) models for Arabic-script languages perform poorly on West African manuscripts due to a lack of these manuscripts representation in the models\u2019 pre-training. This leads to models struggling to adapt to Ajami style calligraphy, being unequipped to recognize Ajami specific characters, and being unable to extract certain Arabic-script diacritics which are present in Ajami manuscripts but lacking in many manuscripts for other Arabic-script languages like Arabic and Persian. The latter poses a significant challenge to Ajami HTR. We release the following as an open-source dataset: an ALTO formatting of high-quality images of Fulfulde and Hausa manuscripts, manual segmentation (region and line), and manual transcriptions. Our HTR dataset is also the first to diplomatically transcribe newly Unicode-encoded, special Quranic recitation characters. We evaluate a suite of Arabic-script recognition models specifically for historical manuscripts and find that they produce character error rates of 65\u201384% when attempting to automatically transcribe our curated manuscripts. Transcriptions produced by the evaluated models are released as well.","Charts are rich with data and ubiquitous in scientific research, which makes the ability to automatically extract structured data from them a research topic of great interest. An end-to-end pipeline that is capable of building datasets from raw chart data could generate significant value in both research and industry. The first step in automated chart content extraction is classification, but major challenges that impede progress for this task include limited datasets, class similarity, class imbalance, and overall chart heterogeneity. The CHART-Info 2024 dataset captures the diversity and challenges of this domain with a set of over 50,000 real-world chart images categorized into 15 different classes. Using this dataset, we studied different data augmentation and training techniques on existing deep learning architectures, such as vision transformers (ViTs) and self-distillation with no labels (DINO) models. Our experiments resulted in a final chart classification model that achieved a macro-averaged F1 score of 94.90%, outperforming the previous state-of-the-art on CHART-Info 2024 by 1.30%. Analysis of our results suggests that masking portions of each training image and overlaying gridlines as an augmentation enabled our models to learn better features and reduce overfitting. Also, we found that the class imbalance problem can be ameliorated by training the model with weighted random samples of the original dataset distribution that give higher priority to underrepresented classes.","Diagrams are widely used to visualize data in publications. The research field of data visualization deals with defining principles and guidelines for the creation and use of these diagrams, which are often not known or adhered to by researchers, leading to misinformation caused by providing inaccurate or incomplete information. In this work, large Vision Language Models (VLMs) are used to analyze diagrams in order to identify potential problems in regards to selected data visualization principles and guidelines. To determine the suitability of VLMs for these tasks, five open source VLMs and five prompting strategies are compared using a set of questions derived from selected data visualization guidelines. The results show that the employed VLMs work well to accurately analyze diagram types ( $$F_1$$ F 1 -score 82.49%), 3D effects ( $$F_1$$ F 1 -score 98.55%), axes labels ( $$F_1$$ F 1 -score 76.74%), lines (RMSE 1.16), colors (RMSE 1.60) and legends ( $$F_1$$ F 1 -score 96.64%, RMSE 0.70), while they cannot reliably provide feedback about the image quality ( $$F_1$$ F 1 -score 0.74%) and tick marks/labels ( $$F_1$$ F 1 -score 46.13%). Among the employed VLMs, Qwen2.5VL performs best, and the summarizing prompting strategy performs best for most of the experimental questions. It is shown that VLMs can be used to automatically identify a number of potential issues in diagrams, such as missing axes labels, missing legends, and unnecessary 3D effects. The approach laid out in this work can be extended for further aspects of data visualization.","A common use case for OCR applications involves users uploading documents and progressively correcting automatic recognition to obtain the final transcript. This correction phase presents an opportunity for progressive adaptation of the OCR model, making it crucial to adapt early, while ensuring stability and reliability. We demonstrate that state-of-the-art transformer-based models can effectively support this adaptation, gradually reducing the annotator\u2019s workload. Our results show that fine-tuning can reliably start with just 16 lines, yielding a 10% relative improvement in CER, and scale up to 40% with 256 lines. We further investigate the impact of model components, clarifying the roles of the encoder and decoder in the fine-tuning process. To guide adaptation, we propose reliable stopping criteria, considering both direct approaches and global trend analysis. Additionally, we show that OCR models can be leveraged to cut annotation costs by half through confidence-based selection of informative lines, achieving the same performance with fewer annotations.","In medieval India, the Marathi language was written using the Modi script. The texts written in Modi script include extensive knowledge about medieval sciences, medicines, land records and authentic evidence about Indian history. Around 40 million documents are in poor condition and have not yet been transliterated. Furthermore, only a few experts in this domain can transliterate this script into English or Devanagari. Most of the past research predominantly focuses on individual character recognition. A system that can transliterate Modi script documents to Devanagari script is needed. We propose the MoDeTrans dataset, comprising 2,043 images of Modi script documents accompanied by their corresponding textual transliterations in Devanagari. We further introduce MoScNet ( Mo di Sc ript Net work), a novel Vision-Language Model (VLM) framework for transliterating Modi script images into Devanagari text. MoScNet leverages Knowledge Distillation, where a student model learns from a teacher model to enhance transliteration performance. The final student model of MoScNet has better performance than the teacher model while having 163 $$\\times $$ \u00d7 lower parameters. Our work is the first to perform direct transliteration from the handwritten Modi script to the Devanagari script. MoScNet also shows competitive results on the optical character recognition (OCR) task.","The study of ancient documents is important for humanity to understand history. In Japan, many ancient documents were written in the Kuzushiji font. Unlike modern fonts, Kuzushiji, as a traditional handwritten font, has unique text structures, with strokes often being connected, simplified, or distorted. In recent years, most studies on font generation have focused on modern font generation, and few have focused on the generation of ancient handwritten fonts like Kuzushiji. Furthermore, vector images are resolution-independent, possess high editing flexibility, and have consistent output quality when compared to raster images. To improve the efficiency of digital data reprinting and the preservation of historical documents by taking advantage of vector images, we propose a few-shot training-free font generation method for generating Kuzushiji characters from modern fonts based on vector images. By using only modern fonts and a few Kuzushiji characters as input, this model mitigates dataset imbalance effectively. Our method integrates a differentiable rasterizer, conditional diffusion model, discriminator, and Multi-Stroke Encoder for stroke-level text control, optimized using multiple loss functions. We conducted numerous experiments on the generation of Kuzushiji fonts, and the results demonstrate that the proposed method successfully generates Kuzushiji characters in vector images, achieving better results than previous methods.","This paper presents a novel multi-task learning (MTL) approach for medieval Hebrew manuscripts, simultaneously addressing script classification and manuscript dating. To facilitate this, we collected a VML-MSH - a comprehensive dataset of medieval manuscripts spanning a period from 850 to 1540 CE. Each manuscript is accompanied by annotations of script type, script mode, and manuscript production date. The MTL enhances generalization across diverse script styles and periods by leveraging shared feature representations, and employs advanced architectures, including Vision Transformer (ViT), MobileViT, Swin Transformer, FocalNet, BEiT, and ConvNeXT. Our training methodology combines classification and regression objectives with adaptive loss weighting, optimizing task performance. Experimental results demonstrate high accuracy in script type classification ranging from 84% to 100%, while highlighting challenges with a few script subtypes (60%\u2013100%). For manuscript dating, the model achieves a mean error ranging from 1.37 to 8.97 decades. These findings underscore the effectiveness of the proposed MTL framework for advancing historical document image analysis and digital paleography. Code and dataset are available at https://github.com/atamnour/MTL-Hebrew-Paleography .","The Manchu archives are historical records formed during the Qing Dynasty in China holding significant value, and word extraction is a crucial step in their intelligent preservation. However, the substantial variation in the lengths of Manchu words means that one-stage key-point object detection models, which have achieved SOTA performance in other ancient archives, do not perform well on Manchu archives. To address this, this paper proposes a Manchu word extraction algorithm called MultKMAWE. Using the Hourglass Network as its backbone, in addition to the five channels used in the center key-point model, the algorithm introduces three additional channels in the head module to predict the heatmap and offset of the bottom-right key-point. Then, by matching the center key-point with the bottom-right key-point, word extraction boxes are generated, effectively mitigating the impact of differences in word lengths. Additionally, based on the Qing Dynasty Imperial Household Department Archives held by the Dalian Library , this paper constructs two new word extraction datasets: the Manchu Archives Word Extraction Real Dataset (MWZS_2000) and the Manchu Archives Word Extraction Synthetic Dataset (MWTQ_2000), each containing 2,000 images. These are currently the largest datasets for Manchu word extraction. Experiments on the Manchu archives dataset (MWZS_2000) show that the proposed algorithm improves word extraction performance by 2% compared to traditional methods.","Optical Music Recognition (OMR) for historical Chinese musical notations, such as suzipu and l\u00fcl\u00fcpu , presents unique challenges due to high class imbalance and limited training data. This paper introduces significant advancements in OMR for Jiang Kui\u2019s influential collection Baishidaoren Gequ from 1202. In this work, we develop and evaluate a character recognition model for scarce imbalanced data. We improve upon previous baselines by reducing the Character Error Rate (CER) from 10.4% to 7.1% for suzipu , despite working with 77 highly imbalanced classes, and achieve a remarkable CER of 0.9% for l\u00fcl\u00fcpu . Our models outperform human transcribers, with an average human CER of 15.9% and a best-case CER of 7.6%. The models are well-calibrated with Expected Calibration Errors (ECE) below 0.0162. Using a leave-one-edition-out cross-validation approach, we ensure robust performance across five historical editions. Additionally, we extend the KuiSCIMA dataset to include all 109 pieces in five editions of Baishidaoren Gequ , encompassing suzipu , l\u00fcl\u00fcpu , and jianzipu notations. Our findings advance the digitization and accessibility of historical Chinese music, promoting cultural diversity in OMR and expanding its applicability to underrepresented music traditions.","Large language models (LLMs) have exhibited strong semantic understanding capabilities in interpreting and reasoning for table question answering (TQA). However, they still face challenges with excessively long or complex tables, particularly when these tables are disorganized or feature hierarchical structures. To address these challenges, we propose a new paradigm for TQA, named TableCall , which leverages the tool-using capabilities of LLMs. Specifically, TableCall adapts different tools for different types of table questions, such as SQL, Python, and LLMs, to simplify and enhance the reliability of table understanding. Moreover, to further enhance LLMs\u2019 table comprehension capabilities, we propose a few-shot library updating technique to generate more effective QA pairs to support LLM prompting. Experimental results on both open-domain and specific-domain datasets demonstrate that our approach achieves state-of-the-art performance, outperforming previous methods in terms of accuracy, efficiency, and reliability.","This paper introduces a novel dataset designed to facilitate the understanding of medical prescriptions, addressing the critical need for accurate and efficient information extraction from semi-structured, sensitive patient health scanned documents. By structuring these prescriptions, medical professionals can more effectively verify dosage instructions and ensure the correct delivery of prescribed drugs to patients. Unlike existing document analysis datasets, Rx-PAD dataset is specifically tailored to the complex syntax and semantic relationships of medical prescriptions. Rx-PAD consists of 200 fully annotated images collected from French pharmacies, supporting two primary tasks: Entity Extraction (EE, 61 labels) and Entity Linking (EL, 11 relation types). To evaluate automatic prescription structuring, we propose a baseline model optimised for accurate detection of drugs and dosages. We also introduce the Drug Accuracy and Completeness (DAC) metric, which evaluates correct linking between drug names, dosings, and forms in real-world medical contexts. Rx-PAD provides a robust foundation for developing solutions that can handle sensitive medical data with the accuracy and speed required for real-world applications such as pharmacy automation, medical AI, and healthcare compliance applications, contributing to meaningful healthcare advancements. The dataset is publicly available at https://gitlab.com/phealing-public/rx_pad.","Colors play a crucial role in the design of vector graphic documents by enhancing visual appeal, facilitating communication, improving usability, and ensuring accessibility. In this context, color recommendation involves suggesting appropriate colors to complete or refine a design when one or more colors are missing or require alteration. Traditional methods often struggled with these challenges due to the complex nature of color design and the limited data availability. In this study, we explored the use of pretrained Large Language Models (LLMs) and their commonsense reasoning capabilities for color recommendation, raising the question: Can pretrained LLMs serve as superior designers for color recommendation tasks? To investigate this, we developed a robust, rigorously validated pipeline, ColorGPT , that was built by systematically testing multiple color representations and applying effective prompt engineering techniques. Our approach primarily targeted color palette completion by recommending colors based on a set of given colors and accompanying context. Moreover, our method can be extended to full palette generation, producing an entire color palette corresponding to a provided textual description. Experimental results demonstrated that our LLM-based pipeline outperformed existing methods in terms of color suggestion accuracy and the distribution of colors in the color palette completion task. For the full palette generation task, our approach also yielded improvements in color diversity and similarity compared to current techniques.","Adapting large language models (LLMs) to complex reasoning tasks often requires expensive fine-tuning efforts. We propose GAMeta-Prompt , a generative adversarial framework that streamlines prompt-based meta-learning through an iterative, team-based adversarial process. First, our approach organizes a role-based \u201cexpert team\u201d. One member assumes the role of \u201cteam manager\u201d acting as the sole conduit for all expert communications to maintain independent reasoning streams. Second, we engage an \u201cadversarial team\u201d that mirrors the expert structure but aims to refute the solution proposed by the expert team, creating a multi-round confrontation that targets logical gaps and domain oversights. Finally, we propose an adaptive evaluation mechanism based on multi-dimensional feedback, which dynamically adjusts the evaluation criteria by quantifying the consistency of expert scores and the uncertainty of evaluation. The method combines adaptive scoring integration, feedback adjustment and multi-round optimization to improve the robustness and accuracy of the evaluation and ensure the overall reliability of the scheme. Experiments demonstrate that GAMeta-Prompt outperforms conventional prompt engineering methods in few-shot and zero-shot scenarios, often enabling smaller models to match or exceed the performance of larger ones under resource constraints. By blending persona-based context, iterative adversarial checks, and global scoring, our framework offers a scalable, parameter-efficient pathway to refining LLM reasoning without fine-tuning.","Document-level relation extraction in document understanding aims to identify complex entity relationships across sentences, but existing methods often face challenges when capturing long-distance entity dependencies. To address this issue, this paper proposes a document-level relation extraction model based on Entity Dependency Memory Enhancement (EMDRE). By introducing memory-enhanced technology from the computer vision domain, token Turing machine (TTM), the model effectively improves the ability to model long-distance entity dependencies in document understanding tasks. This approach enhances the memory mechanism, significantly improving the model\u2019s ability to capture complex entity relationships within documents. Additionally, to tackle the issue of class imbalance in document-level relation extraction tasks, this paper presents an adaptive ranking optimization strategy that dynamically adjusts the contribution of positive and negative samples to model training, further boosting model performance. Experimental results demonstrate that the EMDRE model outperforms existing baseline models in document-level relation extraction tasks, validating its effectiveness and innovation in document understanding.","The analysis of hand-drawn ink line intersections has long been a critical aspect of questioned document examination. Accurately determining the application sequence of intersecting ink lines can effectively assist human examiners with forensic evaluation of handwriting, such as with the authentication of handwritten signatures. However, one of the most significant challenges arises from the nuanced and often indistinct nature of colour (or greyscale) and topological features of intersecting ink regions. This has hindered existing studies from developing robust solutions, even with the use of expensive specialist equipment. This paper proposes a deep learning-based method for analysing three-dimensional ink data reconstructed using photometric stereo, for enabling the automatic determination of ink line application sequences in various handwritten patterns. To train and evaluate this model, we constructed and annotated an image dataset comprising 1,500 high-resolution samples of hand-drawn intersecting ink lines. Our method achieved an accuracy of 96.33% in sequencing intersecting ink lines, demonstrating potential for applications in forensic document examination, including forgery detection and signature authentication. Relevant data, including high-resolution surface normal and depth maps of intersecting ink lines, are available at https://doi.org/10.5281/zenodo.14868091","Handwritten Mathematical Expression Recognition (HMER) is a challenging task due to the complexity of mathematical symbols and the variability of handwriting styles. Tree Structured Transformer (TST) is proposed to recognize handwritten mathematical expressions by predicting the Symbol Layout Tree (SLT) of the expression. The proposed method is based on an Encoder-Decoder architecture, where the Decoder is designed to predict the tree structure of the expression, which predicts the node labels, edge labels, and parent index of each node. This TST Decoder can be combined with different Encoder to handle both online or offline handwritten mathematical expressions with CNN-based Encoder for offline HMER and Graph-based Encoder for online HMER. Both the online and offline systems are evaluated on the CROHME 2023 dataset, and evaluated by the standard evaluation tools, achieving competitive results compared to the state-of-the-art methods.","To address the challenges of table structure recognition, we propose a novel Split-Merge-based top-down model optimized for large, densely populated tables. Our approach formulates row and column splitting as sequence labeling tasks, utilizing dual Transformer encoders to capture feature interactions. The merging process is framed as a grid cell classification task, leveraging an additional Transformer encoder to ensure accurate and coherent merging. By eliminating unstable bounding box predictions, our method reduces resolution loss and computational complexity, achieving high accuracy while maintaining fast processing speed. Extensive experiments on FinTabNet and PubTabNet demonstrate the superiority of our model over existing approaches, particularly in real-world applications. Our method offers a robust, scalable, and efficient solution for large-scale table recognition, making it well-suited for industrial deployment.","Automating table extraction (TE) from business documents is critical for industrial workflows but remains challenging due to sparse annotations and error-prone multi-stage pipelines. While semi-supervised learning (SSL) can leverage unlabeled data, existing methods rely on confidence scores that poorly reflect extraction quality. We propose QUEST, a Quality-aware Semi-supervised Table extraction framework designed for Business documents. QUEST introduces a novel quality assessment model that evaluates structural and contextual features of extracted tables, trained to predict F1 scores instead of relying on confidence metrics. This quality-aware approach guides pseudo-label selection during iterative SSL training, while diversity measures (DPP, Vendi score, IntDiv) mitigate confirmation bias. Experiments on a proprietary business dataset (1k annotated + 10k unannotated documents) show QUEST improves F1 from 64% to 74% and reduces empty predictions by 45% (12% to 6.5%). On the DocILE benchmark (600 annotated + 20k unannotated documents), QUEST achieves a 50% F1 score (up from 42%) and reduces empty predictions by 19% (27% to 22%). The framework\u2019s interpretable quality assessments and robustness to annotation scarcity make it particularly suited for business documents, where structural consistency and data completeness are paramount.","Artistic text recognition poses significant challenges due to the diversity of fonts, visual effects, and background noise\u2014elements designed for aesthetics yet detrimental to accurate recognition. While the skeletal structure of characters remains stable across variations, existing methods have underutilized this information for robust recognition. In this work, we propose Skeleton-Guided Artistic Text Recognition (SG-ATR), a novel method that explicitly leverages skeletal representations to enhance text feature extraction. Our framework integrates a Skeletonization module to distill essential character structures while mitigating interference from complex backgrounds. To advance benchmarking in artistic text recognition, we introduce Artistic Text-In-The-Wild (ATTW), a dataset comprising 16,627 diverse artistic text instances, curated from widely recognized sources and spanning a broad spectrum of artistic styles. Extensive experiments demonstrate that SG-ATR achieves 75.39% % accuracy on ATTW, surpassing state-of-the-art (SOTA) methods. Furthermore, SG-ATR generalizes well to standard scene text recognition benchmarks, underscoring its robustness beyond artistic text scenarios.","Scene text removal (STR) aims to erase textual elements from images. It was originally intended for removing privacy-sensitive or undesired texts from natural scene images, but is now also applied to typographic images. STR typically detects text regions and then inpaints them. Although STR has advanced through neural networks and synthetic data, misuse risks have increased. This paper investigates Inverse STR (ISTR), which analyzes STR-processed images and focuses on binary classification (detecting whether an image has undergone STR) and localizing removed text regions. We demonstrate in experiments that these tasks are achievable with high accuracies, enabling detection of potential misuse and improving STR. We also attempt to recover the removed text content by training a text recognizer to understand its difficulty. Our datasets and model are available at: https://github.com/takumi-yoshimatsu/ISTR .","Scene Text Recognition (STR) is an essential component in autonomous navigation for a diverse set of applications, including reading signboards, traffic signs and license plates. However, STR in\u00a0rainy weather conditions remains unexplored. The challenges of reading\u00a0text covered with rain streaks and accumulation highlight the need for robust STR systems. We adapt existing rain generation method\u00a0to add rain to the 1000 text-heavy frames from the RoadText-1K dataset. RoadText-1K is an existing dataset that is created from the Berkeley Deep\u00a0Drive (BDD) dataset. We observe challenges like completely illegible text and non-real rains while using the rain generation methods. We first provide a simple recipe to build somewhat legible but challenging STR scenes in real\u00a0rainy weather. The recipe includes upsampling the noisy rain mask obtained from the rain generation method, and adding it to the high-resolution clean image. Although our method is simple, the generated data helps improve STR results in real rainy weather. We benchmark the performance of existing STR models\u00a0on our data. Further fine-tuning the best-performing model on generated rainy data reduces the word error rates by 27.88% on generated test set, and 22.36% on images with real rain. It is important to note that these results are better than directly fine-tuning on data with real rain, since the labelling was done before adding rain, and the scene text is challenging but readable.","This study presents a large-scale dataset of Khmer scene text images captured in real-world environments. Khmer, the official language of Cambodia, is spoken by approximately 17 million people. While Optical Character Recognition (OCR) systems have achieved remarkable success in Roman (Latin) script languages such as English, Khmer script poses unique challenges due to its intricate structure, absence of clear word boundaries, and highly diverse character shapes and sizes. A significant limitation in Khmer OCR research has been the scarcity of high-quality training data, particularly for deep learning-based models, which require extensive datasets to achieve robust performance. To address these challenges, we introduce a newly constructed dataset of Khmer scene text, comprising 29,601 annotated text lines from 10,000 unique images. This dataset is highly diverse and challenging, encompassing artistic text, blurred text, low-light conditions, curved text, text in complex backgrounds, and occluded text. Each text line is annotated with polygonal bounding box coordinates and line-level transcriptions, alongside attributes describing background complexity, character appearance, and text style. To establish a foundational benchmark for future research in Khmer OCR, we provide baseline results for Khmer text detection and recognition. Additionally, we propose a robust evaluation metric tailored for Khmer OCR, enabling precise assessment of CER and WER while accounting for the unique characteristics of the Khmer script.","In this paper, TextSAM-LoRA is presented as a novel pipeline for high-precision text detection that leverages the Segment Anything Model (SAM) as a base semantic segmentation model, efficiently fine-tuned with Low-Rank Adaptation (LoRA) layers for text segmentation tasks. Although SAM has demonstrated remarkable generalization capabilities across various segmentation tasks, its application to text detection remains largely underexplored. By integrating LoRA, SAM can be efficiently adapted to the text domain, significantly reducing both the computational cost and parameter overhead typically associated with fine-tuning large-scale models. The extensive experiments carried out on three benchmark datasets\u2014CTW1500, MSRA-TD500 and Total-Text\u2014demonstrate that TextSAM-LoRA achieves competitive state-of-the-art performance. Notably, on CTW1500 the approach outperforms previous methods with an F1-score of 90.4%, highlighting its exceptional ability to accurately detect complex curved texts. This work showcases the potential of combining foundational segmentation models with lightweight adaptation techniques for building specific and accurate text detection systems with limited computational resources.","In real-world scenarios, text embedded in images is frequently subjected to corruption due to various factors such as occlusion, noise, fading, or physical damage. These degradations are prevalent in diverse applications, including street view text recognition and scene text understanding, significantly hindering the utility of text in downstream tasks such as optical character recognition and natural language processing. Existing methods for text image inpainting often rely on additional prompts or external data to guide the restoration process, which not only increases complexity but also limits their applicability in scenarios where such auxiliary information is unavailable. To address these challenges, we propose a novel approach, termed MultiModalTextInpaintingNetwork (MMTINet), which directly extracts and fuses textual semantics from the image itself without requiring any external prompts. By leveraging the inherent textual information within the image, our method achieves a more seamless and context-sensitive restoration, significantly improving the accuracy and fidelity of the reconstructed text. We evaluate MMTINet on a benchmark dataset, demonstrating its effectiveness in recovering missing or occluded text while preserving the original content and style. Experimental results highlight the efficacy and potential of our approach, showcasing its superior performance in advancing text restoration tasks through image-driven text semantics.","Online handwritten signature verification plays a crucial role in digital security applications, particularly in scenarios requiring high authenticity and fraud prevention. Path Signature, serving as a robust temporal modeling method, has demonstrated its effectiveness in recent years for its time reparametrization invariance. However, its practical application is limited by inherent challenges, such as the curse of dimensionality. Thanks to Path Development and its trainable variant Path Development layer (Dev), which retain the virtue in Path Signature while overcoming its limitations, we structurally weave Path Dev elopment in to Online Sig nature Verification and propose DevInSight (with extra \u2018ht\u2019 for legibility). Our approach incorporates several modifications for the hierarchically stacked Dev, including Windowing Strategy, Grouping Strategy and Absolute-Information-Augmentation. Additionally, Local Focus Module (LFM) and Global Fusion Module (GFM) are designed and integrated into the model to improve feature extraction and expand perceptual scope. For verification decision making, we utilize a Dynamic Time Warping (DTW) based verifier. Experiments on two large-scale online signature datasets in different languages show that DevInSight outperforms existing methods on MSDS-ChS (Chinese), especially in challenging scenarios like single-template and cross-session verification, and achieves competitive results on DeepSignDB (Latin). Furthermore, we extend DevInSight to online digital string verification, showcasing its promising generalization capability for other handwritten content. The code will be made publicly available.","In real Offline Handwritten Signature Verification (OHSV) scenarios, skilled forged signatures are extremely rare and cannot be accessed during model training and verification stages. Therefore, the difference between genuine signatures and skilled forgeries is hard to capture in this scenario. In this paper, a forged signature generation method named SigLDiff based on latent diffusion models is proposed to address the challenge that skilled forgery cannot be accessed in OHSV tasks. SigLDiff constructs a forged signature generation approach with fine-grained variations by disentangling the content features of genuine signatures from the style characteristics of other genuine signatures. Specifically, the proposed method initially employs the multiscale content aggregation module to integrate the global and local stroke feature of genuine signatures, which effectively enhances the detailed information of signature strokes at different scales. Moreover, to capture style features of signatures, a cross-scale style representation module is proposed to extract handwriting style features at various abstraction levels via a pre-trained VGG network. As a result, style transfer of genuine signatures is implemented in the latent space, enabling generated samples to preserve the content features of the target user while exhibiting diverse forgery styles. Extensive experimental results on five public datasets demonstrate that verification models trained with our generated samples defeat models without authentic skilled forgeries.","In this paper, we approach the problem of minimizing the global Equal Error Rate (EER) in a Writer-Independent (WI) Online Signature Verification (OSV) system by decomposing it into two components: the separation error and the alignment error. The separation error arises from the lack of a correct separation between genuine and forged signatures, while the alignment error arises from the inability of a single global threshold to effectively capture the writer-specific separations. To this, we propose HoLoSig, a novel framework that integrates two popular deep signature representations via a shared 1D convolutional backbone that bifurcates into two specialized branches. On one branch, we employ Triplet Loss with Soft-DTW to learn variable-length local representations whose dissimilarity scores are shifted to a common region with the help of the Maximum Mean Discrepancy (MMD) to improve the system\u2019s performance when using a global threshold. On the other branch, we employ Poly-1 Cross Entropy Loss to learn fixed-length holistic representations that are used to further boost the separation created by the local representation branch. HoLoSig achieves state-of-the-art results on DeepSignDB, the largest OSV dataset to date, against skilled and random forgeries in the stylus scenario, with EERs of 1.73% (4vs1 skilled), 3.29% (1vs1 skilled), 0.43% (4vs1 random) and 0.89% (1vs1 random). The source code is available at https://github.com/DYosplay/HoLoSig .","The increasing demand for data privacy has spurred interest in generative models for simulating tabular data. However, the diverse data types and column distributions in tabular datasets present substantial challenges in developing efficient and expressive generative models. Existing approaches focus on learning joint distributions and statistics to generate distribution-consistent synthetic tables but often fail to capture global feature interactions and adapt to the requirements of downstream tasks. Moreover, current methods exhibit sensitivity to the ordering of input data during training, which leads to suboptimal performance. In this paper, we introduce HyperTab, a novel generative model based on hypergraph modeling and adversarial training. HyperTab leverages hypergraphs to capture the permutation invariance inherent in tabular data. By utilizing a hypergraph encoder, it explicitly models the interaction relationships between features, ensuring that the synthesized data accurately reflects global dependencies. Additionally, HyperTab adopts a multi-objective optimization strategy, simultaneously minimizing adversarial loss to ensure data authenticity, logical consistency loss to maintain the rationality of feature relationships, and task-specific losses, including mean squared error for regression tasks and cross-entropy for classification tasks. Extensive evaluations across multiple benchmark datasets demonstrate that HyperTab significantly outperforms existing methods in terms of generation quality.","Radical-based approaches for Chinese character recognition (CCR) have been extensively investigated and demonstrated substantial improvements. Chinese characters are generally decomposed into structural components and radicals, with recognition being accomplished through the accurate identification of these elements. However, the inherent complexity and diversity of Chinese radicals, combined with variations in writing styles, introduce ambiguities, potentially leading to suboptimal model performance. Such challenges are particularly evident when distinguishing radicals with visually similar characteristics. To address these limitations, this paper proposes a novel Adaptive Radical Similarity Measurement (ARSM) module, which enhances the robustness and generalization of CCR models by dynamically measuring the similarity between radical pairs and integrating this information with radical features. ARSM enables more robust feature integration and facilitates the development of a specialized loss function tailored for optimizing model parameters, thereby improving recognition accuracy. Comprehensive experiments conducted on multiple benchmark datasets demonstrate the effectiveness and robustness of the proposed method.","Engineering diagrams (EDs) provide a rich source of information and play a critical role across various industries. However, the inherent complexity of EDs complicates automatic analysis and processing. These diagrams often contain 100 to 200 visually similar symbols, leading to challenges such as inter-class similarity, overlapping symbols, and substantial background noise. Although recent deep learning-based architectures have shown promising performance in recognising these symbols, these models are heavy and computationally expensive, restricting their use for deployment on resource-constrained devices. Thus, we propose a lightweight knowledge distillation framework for EDs. The framework integrates feature-based and output-level distillation, enabling a lightweight student model to learn from a more complex teacher model. Feature-based distillation is enhanced through Channel-Wise Distillation (CWD) loss, improving spatial and contextual representation, and reducing computational complexity. The output-level distillation employs Kullback-Leibler (KL) divergence to closely align the student model predictions with the teacher\u2019s probability distributions. Extensive experiments on private and public datasets demonstrate that our approach achieves a 6.9% improvement in mean average precision (mAP), reduces model size by 74.5% and decreases computational cost by 82.7%. The proposed method offers significant potential for real-time industrial applications on edge devices and sets the foundation for further advancements in ED analysis.","Document Image Machine Translation (DIMT) seeks to translate text embedded in document images from one language to another by jointly modeling both textual content and page layout\u2014bridging optical character recognition (OCR) and natural language processing (NLP). The DIMT 2025 Challenge advances research on end-to-end document image translation, a rapidly evolving area within multimodal document understanding. The competition features two tracks\u2014OCR-free and OCR-based\u2014each with two subtasks for small ( $$\\le $$ \u2264 1B parameters) and large (&gt; 1B parameters) models. Participants submit a single unified DIMT system, with the option to incorporate provided OCR transcripts. Running from December 10, 2024 to April 20, 2025, the competition attracted 69 teams and 27 valid submissions in total. Track 1 had 34 teams and 13 valid submissions, while Track 2 had 35 teams and 14 valid submissions. In this report, we present the challenge motivation, dataset construction, task definitions, evaluation protocol, and a summary of results. Our analysis shows that large-model approaches establish a promising new paradigm for translating complex-layout document images and highlight substantial opportunities for future research.","The integration and application of Multimodal Large Language Models (MLLMs) in the education sector offers significant potential for automating tasks such as exam grading and personalized learning. However, current MLLMs are predominantly trained on English text and simplified document formats, which limits their performance on complex, non-English documents like exam papers. Key challenges in understanding exam papers include accurate text extraction, maintaining the correct reading order, and ensuring logical coherence across multiple pages. Addressing these issues is critical for the practical deployment of MLLMs in educational applications. To advance research in this area, we organized the ICDAR 2025 Competition on Understanding Chinese College Entrance Exam Papers. This competition introduced the CEP-7K dataset, consisting of 7,000 question-answer pairs and their corresponding exam paper images, to assess MLLMs\u2019 abilities in tackling these challenges. Held from December 10, 2024, to April 18, 2025, the competition received six valid submissions. Compared to the benchmark model Qwen2.5-VL-32B-Instruct, the participating teams have achieved up to a 42% improvement in accuracy. This report provides an overview of the dataset, task design, and evaluation metrics. It also presents the evaluation results and highlights key insights and advancements gained from the competition.","This report describes the ICDAR 2025 Competition on Automatic Classification of Literary Epochs (ICDAR 2025 CoLiE), which consisted of two tasks focused on automatic prediction of the time in which a book was written (date of first publication). Both tasks comprised two sub-tasks, where a related fine-grained classification was addressed. Task 1 consisted of the identification of literary epochs, such as Romanticism or Modernism (sub-task 1.1), and a more precise classification of the period within the epoch (sub-task 1.2). Task 2 addressed the chronological identification of century (sub-task 2.1) or decade (sub-task 2.2). The compiled dataset and the reported findings are valuable to the scientific community and contribute to advancing research in the automatic dating of texts and its applications in digital humanities and temporal text analysis.","This report presents the results of the inaugural ICDAR 2025 Handwritten Notes Understanding Competition, centered on evidence-based question answering over complex scientific handwritten notes. The final competition test set included over 2,000 real academic note images and 1,000 curated questions across diverse STEM domains, characterized by varied layouts, diagrams, and dense equations. The overall challenge was structured as a single task with a multi-phase evaluation protocol designed to assess not only answer correctness but also grounded reasoning ability , requiring models to localize the exact visual evidence supporting their answers. Hosted on the Robust Reading Challenge (RRC) Portal, the competition ensured fair, private-set benchmarking, with 6 valid submissions out of 16 registered teams. The results underscore the obstacles that current state-of-the-art (SOTA) vision-language models (VLMs) face in multimodal reasoning over handwritten content. This first edition marks a promising step toward interpretable, layout-aware document understanding and sets the foundation for future iterations.","Historical maps are valuable for history, social sciences, and linguistics but pose challenges for automatic transcription. This competition edition continues to address detection, recognition, and linking of text in historical maps, with new features: expanded French Land Registers data, a new Taiwanese dataset with Chinese characters, synthetic training data, and improved linking evaluation metrics. Seven teams participated with over 25 submissions across four tasks and three datasets. While detection performance is strong, recognition and linking remain difficult, though improvements were seen with B\u00e9zier curve line fitting and enhanced linking pipelines. All resources are publicly available on Zenodo ( https://zenodo.org/communities/icdar-maptext ).","Text line segmentation is a critical step in handwritten document image analysis. Segmenting text lines in historical handwritten documents, however, presents unique challenges due to irregular handwriting, faded ink, and complex layouts with overlapping lines and non-linear text flow. Furthermore, the scarcity of large annotated datasets renders fully supervised learning approaches impractical for such materials. To address these challenges, we introduce the Few-Shot Text Line Segmentation of Ancient Handwritten Documents (FEST) Competition. Participants are tasked with developing systems capable of segmenting text lines in U-DIADS-TL dataset, using only three annotated images per manuscript for training. The competition dataset features a diverse collection of ancient manuscripts exhibiting a wide range of layouts, degradation levels, an
