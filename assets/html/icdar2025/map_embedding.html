te of Arabic-script recognition models specifically for historical manuscripts and find that they produce character error rates of 65\u201384% when attempting to automatically transcribe our curated manuscripts. Transcriptions produced by the evaluated models are released as well.","Charts are rich with data and ubiquitous in scientific research, which makes the ability to automatically extract structured data from them a research topic of great interest. An end-to-end pipeline that is capable of building datasets from raw chart data could generate significant value in both research and industry. The first step in automated chart content extraction is classification, but major challenges that impede progress for this task include limited datasets, class similarity, class imbalance, and overall chart heterogeneity. The CHART-Info 2024 dataset captures the diversity and challenges of this domain with a set of over 50,000 real-world chart images categorized into 15 different classes. Using this dataset, we studied different data augmentation and training techniques on existing deep learning architectures, such as vision transformers (ViTs) and self-distillation with no labels (DINO) models. Our experiments resulted in a final chart classification model that achieved a macro-averaged F1 score of 94.90%, outperforming the previous state-of-the-art on CHART-Info 2024 by 1.30%. Analysis of our results suggests that masking portions of each training image and overlaying gridlines as an augmentation enabled our models to learn better features and reduce overfitting. Also, we found that the class imbalance problem can be ameliorated by training the model with weighted random samples of the original dataset distribution that give higher priority to underrepresented classes.","Diagrams are widely used to visualize data in publications. The research field of data visualization deals with defining principles and guidelines for the creation and use of these diagrams, which are often not known or adhered to by researchers, leading to misinformation caused by providing inaccurate or incomplete information. In this work, large Vision Language Models (VLMs) are used to analyze diagrams in order to identify potential problems in regards to selected data visualization principles and guidelines. To determine the suitability of VLMs for these tasks, five open source VLMs and five prompting strategies are compared using a set of questions derived from selected data visualization guidelines. The results show that the employed VLMs work well to accurately analyze diagram types ( $$F_1$$ F 1 -score 82.49%), 3D effects ( $$F_1$$ F 1 -score 98.55%), axes labels ( $$F_1$$ F 1 -score 76.74%), lines (RMSE 1.16), colors (RMSE 1.60) and legends ( $$F_1$$ F 1 -score 96.64%, RMSE 0.70), while they cannot reliably provide feedback about the image quality ( $$F_1$$ F 1 -score 0.74%) and tick marks/labels ( $$F_1$$ F 1 -score 46.13%). Among the employed VLMs, Qwen2.5VL performs best, and the summarizing prompting strategy performs best for most of the experimental questions. It is shown that VLMs can be used to automatically identify a number of potential issues in diagrams, such as missing axes labels, missing legends, and unnecessary 3D effects. The approach laid out in this work can be extended for further aspects of data visualization.","A common use case for OCR applications involves users uploading documents and progressively correcting automatic recognition to obtain the final transcript. This correction phase presents an opportunity for progressive adaptation of the OCR model, making it crucial to adapt early, while ensuring stability and reliability. We demonstrate that state-of-the-art transformer-based models can effectively support this adaptation, gradually reducing the annotator\u2019s workload. Our results show that fine-tuning can reliably start with just 16 lines, yielding a 10% relative improvement in CER, and scale up to 40% with 256 lines. We further investigate the impact of model components, clarifying the roles of the encoder and decoder in the fine-tuning process. To guide adaptation, we propose reliable stopping criteria, considering both direct approaches and global trend analysis. Additionally, we show that OCR models can be leveraged to cut annotation costs by half through confidence-based selection of informative lines, achieving the same performance with fewer annotations.","In medieval India, the Marathi language was written using the Modi script. The texts written in Modi script include extensive knowledge about medieval sciences, medicines, land records and authentic evidence about Indian history. Around 40 million documents are in poor condition and have not yet been transliterated. Furthermore, only a few experts in this domain can transliterate this script into English or Devanagari. Most of the past research predominantly focuses on individual character recognition. A system that can transliterate Modi script documents to Devanagari script is needed. We propose the MoDeTrans dataset, comprising 2,043 images of Modi script documents accompanied by their corresponding textual transliterations in Devanagari. We further introduce MoScNet ( Mo di Sc ript Net work), a novel Vision-Language Model (VLM) framework for transliterating Modi script images into Devanagari text. MoScNet leverages Knowledge Distillation, where a student model learns from a teacher model to enhance transliteration performance. The final student model of MoScNet has better performance than the teacher model while having 163 $$\\times $$ \u00d7 lower parameters. Our work is the first to perform direct transliteration from the handwritten Modi script to the Devanagari script. MoScNet also shows competitive results on the optical character recognition (OCR) task.","The study of ancient documents is important for humanity to understand history. In Japan, many ancient documents were written in the Kuzushiji font. Unlike modern fonts, Kuzushiji, as a traditional handwritten font, has unique text structures, with strokes often being connected, simplified, or distorted. In recent years, most studies on font generation have focused on modern font generation, and few have focused on the generation of ancient handwritten fonts like Kuzushiji. Furthermore, vector images are resolution-independent, possess high editing flexibility, and have consistent output quality when compared to raster images. To improve the efficiency of digital data reprinting and the preservation of historical documents by taking advantage of vector images, we propose a few-shot training-free font generation method for generating Kuzushiji characters from modern fonts based on vector images. By using only modern fonts and a few Kuzushiji characters as input, this model mitigates dataset imbalance effectively. Our method integrates a differentiable rasterizer, conditional diffusion model, discriminator, and Multi-Stroke Encoder for stroke-level text control, optimized using multiple loss functions. We conducted numerous experiments on the generation of Kuzushiji fonts, and the results demonstrate that the proposed method successfully generates Kuzushiji characters in vector images, achieving better results than previous methods.","This paper presents a novel multi-task learning (MTL) approach for medieval Hebrew manuscripts, simultaneously addressing script classification and manuscript dating. To facilitate this, we collected a VML-MSH - a comprehensive dataset of medieval manuscripts spanning a period from 850 to 1540 CE. Each manuscript is accompanied by annotations of script type, script mode, and manuscript production date. The MTL enhances generalization across diverse script styles and periods by leveraging shared feature representations, and employs advanced architectures, including Vision Transformer (ViT), MobileViT, Swin Transformer, FocalNet, BEiT, and ConvNeXT. Our training methodology combines classification and regression objectives with adaptive loss weighting, optimizing task performance. Experimental results demonstrate high accuracy in script type classification ranging from 84% to 100%, while highlighting challenges with a few script subtypes (60%\u2013100%). For manuscript dating, the model achieves a mean error ranging from 1.37 to 8.97 decades. These findings underscore the effectiveness of the proposed MTL framework for advancing historical document image analysis and digital paleography. Code and dataset are available at https://github.com/atamnour/MTL-Hebrew-Paleography .","The Manchu archives are historical records formed during the Qing Dynasty in China holding significant value, and word extraction is a crucial step in their intelligent preservation. However, the substantial variation in the lengths of Manchu words means that one-stage key-point object detection models, which have achieved SOTA performance in other ancient archives, do not perform well on Manchu archives. To address this, this paper proposes a Manchu word extraction algorithm called MultKMAWE. Using the Hourglass Network as its backbone, in addition to the five channels used in the center key-point model, the algorithm introduces three additional channels in the head module to predict the heatmap and offset of the bottom-right key-point. Then, by matching the center key-point with the bottom-right key-point, word extraction boxes are generated, effectively mitigating the impact of differences in word lengths. Additionally, based on the Qing Dynasty Imperial Household Department Archives held by the Dalian Library , this paper constructs two new word extraction datasets: the Manchu Archives Word Extraction Real Dataset (MWZS_2000) and the Manchu Archives Word Extraction Synthetic Dataset (MWTQ_2000), each containing 2,000 images. These are currently the largest datasets for Manchu word extraction. Experiments on the Manchu archives dataset (MWZS_2000) show that the proposed algorithm improves word extraction performance by 2% compared to traditional methods.","Optical Music Recognition (OMR) for historical Chinese musical notations, such as suzipu and l\u00fcl\u00fcpu , presents unique challenges due to high class imbalance and limited training data. This paper introduces significant advancements in OMR for Jiang Kui\u2019s influential collection Baishidaoren Gequ from 1202. In this work, we develop and evaluate a character recognition model for scarce imbalanced data. We improve upon previous baselines by reducing the Character Error Rate (CER) from 10.4% to 7.1% for suzipu , despite working with 77 highly imbalanced classes, and achieve a remarkable CER of 0.9% for l\u00fcl\u00fcpu . Our models outperform human transcribers, with an average human CER of 15.9% and a best-case CER of 7.6%. The models are well-calibrated with Expected Calibration Errors (ECE) below 0.0162. Using a leave-one-edition-out cross-validation approach, we ensure robust performance across five historical editions. Additionally, we extend the KuiSCIMA dataset to include all 109 pieces in five editions of Baishidaoren Gequ , encompassing suzipu , l\u00fcl\u00fcpu , and jianzipu notations. Our findings advance the digitization and accessibility of historical Chinese music, promoting cultural diversity in OMR and expanding its applicability to underrepresented music traditions.","Large language models (LLMs) have exhibited strong semantic understanding capabilities in interpreting and reasoning for table question answering (TQA). However, they still face challenges with excessively long or complex tables, particularly when these tables are disorganized or feature hierarchical structures. To address these challenges, we propose a new paradigm for TQA, named TableCall , which leverages the tool-using capabilities of LLMs. Specifically, TableCall adapts different tools for different types of table questions, such as SQL, Python, and LLMs, to simplify and enhance the reliability of table understanding. Moreover, to further enhance LLMs\u2019 table comprehension capabilities, we propose a few-shot library updating technique to generate more effective QA pairs to support LLM prompting. Experimental results on both open-domain and specific-domain datasets demonstrate that our approach achieves state-of-the-art performance, outperforming previous methods in terms of accuracy, efficiency, and reliability.","This paper introduces a novel dataset designed to facilitate the understanding of medical prescriptions, addressing the critical need for accurate and efficient information extraction from semi-structured, sensitive patient health scanned documents. By structuring these prescriptions, medical professionals can more effectively verify dosage instructions and ensure the correct delivery of prescribed drugs to patients. Unlike existing document analysis datasets, Rx-PAD dataset is specifically tailored to the complex syntax and semantic relationships of medical prescriptions. Rx-PAD consists of 200 fully annotated images collected from French pharmacies, supporting two primary tasks: Entity Extraction (EE, 61 labels) and Entity Linking (EL, 11 relation types). To evaluate automatic prescription structuring, we propose a baseline model optimised for accurate detection of drugs and dosages. We also introduce the Drug Accuracy and Completeness (DAC) metric, which evaluates correct linking between drug names, dosings, and forms in real-world medical contexts. Rx-PAD provides a robust foundation for developing solutions that can handle sensitive medical data with the accuracy and speed required for real-world applications such as pharmacy automation, medical AI, and healthcare compliance applications, contributing to meaningful healthcare advancements. The dataset is publicly available at https://gitlab.com/phealing-public/rx_pad.","Colors play a crucial role in the design of vector graphic documents by enhancing visual appeal, facilitating communication, improving usability, and ensuring accessibility. In this context, color recommendation involves suggesting appropriate colors to complete or refine a design when one or more colors are missing or require alteration. Traditional methods often struggled with these challenges due to the complex nature of color design and the limited data availability. In this study, we explored the use of pretrained Large Language Models (LLMs) and their commonsense reasoning capabilities for color recommendation, raising the question: Can pretrained LLMs serve as superior designers for color recommendation tasks? To investigate this, we developed a robust, rigorously validated pipeline, ColorGPT , that was built by systematically testing multiple color representations and applying effective prompt engineering techniques. Our approach primarily targeted color palette completion by recommending colors based on a set of given colors and accompanying context. Moreover, our method can be extended to full palette generation, producing an entire color palette corresponding to a provided textual description. Experimental results demonstrated that our LLM-based pipeline outperformed existing methods in terms of color suggestion accuracy and the distribution of colors in the color palette completion task. For the full palette generation task, our approach also yielded improvements in color diversity and similarity compared to current techniques.","Adapting large language models (LLMs) to complex reasoning tasks often requires expensive fine-tuning efforts. We propose GAMeta-Prompt , a generative adversarial framework that streamlines prompt-based meta-learning through an iterative, team-based adversarial process. First, our approach organizes a role-based \u201cexpert team\u201d. One member assumes the role of \u201cteam manager\u201d acting as the sole conduit for all expert communications to maintain independent reasoning streams. Second, we engage an \u201cadversarial team\u201d that mirrors the expert structure but aims to refute the solution proposed by the expert team, creating a multi-round confrontation that targets logical gaps and domain oversights. Finally, we propose an adaptive evaluation mechanism based on multi-dimensional feedback, which dynamically adjusts the evaluation criteria by quantifying the consistency of expert scores and the uncertainty of evaluation. The method combines adaptive scoring integration, feedback adjustment and multi-round optimization to improve the robustness and accuracy of the evaluation and ensure the overall reliability of the scheme. Experiments demonstrate that GAMeta-Prompt outperforms conventional prompt engineering methods in few-shot and zero-shot scenarios, often enabling smaller models to match or exceed the performance of larger ones under resource constraints. By blending persona-based context, iterative adversarial checks, and global scoring, our framework offers a scalable, parameter-efficient pathway to refining LLM reasoning without fine-tuning.","Document-level relation extraction in document understanding aims to identify complex entity relationships across sentences, but existing methods often face challenges when capturing long-distance entity dependencies. To address this issue, this paper proposes a document-level relation extraction model based on Entity Dependency Memory Enhancement (EMDRE). By introducing memory-enhanced technology from the computer vision domain, token Turing machine (TTM), the model effectively improves the ability to model long-distance entity dependencies in document understanding tasks. This approach enhances the memory mechanism, significantly improving the model\u2019s ability to capture complex entity relationships within documents. Additionally, to tackle the issue of class imbalance in document-level relation extraction tasks, this paper presents an adaptive ranking optimization strategy that dynamically adjusts the contribution of positive and negative samples to model training, further boosting model performance. Experimental results demonstrate that the EMDRE model outperforms existing baseline models in document-level relation extraction tasks, validating its effectiveness and innovation in document understanding.","The analysis of hand-drawn ink line intersections has long been a critical aspect of questioned document examination. Accurately determining the application sequence of intersecting ink lines can effectively assist human examiners with forensic evaluation of handwriting, such as with the authentication of handwritten signatures. However, one of the most significant challenges arises from the nuanced and often indistinct nature of colour (or greyscale) and topological features of intersecting ink regions. This has hindered existing studies from developing robust solutions, even with the use of expensive specialist equipment. This paper proposes a deep learning-based method for analysing three-dimensional ink data reconstructed using photometric stereo, for enabling the automatic determination of ink line application sequences in various handwritten patterns. To train and evaluate this model, we constructed and annotated an image dataset comprising 1,500 high-resolution samples of hand-drawn intersecting ink lines. Our method achieved an accuracy of 96.33% in sequencing intersecting ink lines, demonstrating potential for applications in forensic document examination, including forgery detection and signature authentication. Relevant data, including high-resolution surface normal and depth maps of intersecting ink lines, are available at https://doi.org/10.5281/zenodo.14868091","Handwritten Mathematical Expression Recognition (HMER) is a challenging task due to the complexity of mathematical symbols and the variability of handwriting styles. Tree Structured Transformer (TST) is proposed to recognize handwritten mathematical expressions by predicting the Symbol Layout Tree (SLT) of the expression. The proposed method is based on an Encoder-Decoder architecture, where the Decoder is designed to predict the tree structure of the expression, which predicts the node labels, edge labels, and parent index of each node. This TST Decoder can be combined with different Encoder to handle both online or offline handwritten mathematical expressions with CNN-based Encoder for offline HMER and Graph-based Encoder for online HMER. Both the online and offline systems are evaluated on the CROHME 2023 dataset, and evaluated by the standard evaluation tools, achieving competitive results compared to the state-of-the-art methods.","To address the challenges of table structure recognition, we propose a novel Split-Merge-based top-down model optimized for large, densely populated tables. Our approach formulates row and column splitting as sequence labeling tasks, utilizing dual Transformer encoders to capture feature interactions. The merging process is framed as a grid cell classification task, leveraging an additional Transformer encoder to ensure accurate and coherent merging. By eliminating unstable bounding box predictions, our method reduces resolution loss and computational complexity, achieving high accuracy while maintaining fast processing speed. Extensive experiments on FinTabNet and PubTabNet demonstrate the superiority of our model over existing approaches, particularly in real-world applications. Our method offers a robust, scalable, and efficient solution for large-scale table recognition, making it well-suited for industrial deployment.","Automating table extraction (TE) from business documents is critical for industrial workflows but remains challenging due to sparse annotations and error-prone multi-stage pipelines. While semi-supervised learning (SSL) can leverage unlabeled data, existing methods rely on confidence scores that poorly reflect extraction quality. We propose QUEST, a Quality-aware Semi-supervised Table extraction framework designed for Business documents. QUEST introduces a novel quality assessment model that evaluates structural and contextual features of extracted tables, trained to predict F1 scores instead of relying on confidence metrics. This quality-aware approach guides pseudo-label selection during iterative SSL training, while diversity measures (DPP, Vendi score, IntDiv) mitigate confirmation bias. Experiments on a proprietary business dataset (1k annotated + 10k unannotated documents) show QUEST improves F1 from 64% to 74% and reduces empty predictions by 45% (12% to 6.5%). On the DocILE benchmark (600 annotated + 20k unannotated documents), QUEST achieves a 50% F1 score (up from 42%) and reduces empty predictions by 19% (27% to 22%). The framework\u2019s interpretable quality assessments and robustness to annotation scarcity make it particularly suited for business documents, where structural consistency and data completeness are paramount.","Artistic text recognition poses significant challenges due to the diversity of fonts, visual effects, and background noise\u2014elements designed for aesthetics yet detrimental to accurate recognition. While the skeletal structure of characters remains stable across variations, existing methods have underutilized this information for robust recognition. In this work, we propose Skeleton-Guided Artistic Text Recognition (SG-ATR), a novel method that explicitly leverages skeletal representations to enhance text feature extraction. Our framework integrates a Skeletonization module to distill essential character structures while mitigating interference from complex backgrounds. To advance benchmarking in artistic text recognition, we introduce Artistic Text-In-The-Wild (ATTW), a dataset comprising 16,627 diverse artistic text instances, curated from widely recognized sources and spanning a broad spectrum of artistic styles. Extensive experiments demonstrate that SG-ATR achieves 75.39% % accuracy on ATTW, surpassing state-of-the-art (SOTA) methods. Furthermore, SG-ATR generalizes well to standard scene text recognition benchmarks, underscoring its robustness beyond artistic text scenarios.","Scene text removal (STR) aims to erase textual elements from images. It was originally intended for removing privacy-sensitive or undesired texts from natural scene images, but is now also applied to typographic images. STR typically detects text regions and then inpaints them. Although STR has advanced through neural networks and synthetic data, misuse risks have increased. This paper investigates Inverse STR (ISTR), which analyzes STR-processed images and focuses on binary classification (detecting whether an image has undergone STR) and localizing removed text regions. We demonstrate in experiments that these tasks are achievable with high accuracies, enabling detection of potential misuse and improving STR. We also attempt to recover the removed text content by training a text recognizer to understand its difficulty. Our datasets and model are available at: https://github.com/takumi-yoshimatsu/ISTR .","Scene Text Recognition (STR) is an essential component in autonomous navigation for a diverse set of applications, including reading signboards, traffic signs and license plates. However, STR in\u00a0rainy weather conditions remains unexplored. The challenges of reading\u00a0text covered with rain streaks and accumulation highlight the need for robust STR systems. We adapt existing rain generation method\u00a0to add rain to the 1000 text-heavy frames from the RoadText-1K dataset. RoadText-1K is an existing dataset that is created from the Berkeley Deep\u00a0Drive (BDD) dataset. We observe challenges like completely illegible text and non-real rains while using the rain generation methods. We first provide a simple recipe to build somewhat legible but challenging STR scenes in real\u00a0rainy weather. The recipe includes upsampling the noisy rain mask obtained from the rain generation method, and adding it to the high-resolution clean image. Although our method is simple, the generated data helps improve STR results in real rainy weather. We benchmark the performance of existing STR models\u00a0on our data. Further fine-tuning the best-performing model on generated rainy data reduces the word error rates by 27.88% on generated test set, and 22.36% on images with real rain. It is important to note that these results are better than directly fine-tuning on data with real rain, since the labelling was done before adding rain, and the scene text is challenging but readable.","This study presents a large-scale dataset of Khmer scene text images captured in real-world environments. Khmer, the official language of Cambodia, is spoken by approximately 17 million people. While Optical Character Recognition (OCR) systems have achieved remarkable success in Roman (Latin) script languages such as English, Khmer script poses unique challenges due to its intricate structure, absence of clear word boundaries, and highly diverse character shapes and sizes. A significant limitation in Khmer OCR research has been the scarcity of high-quality training data, particularly for deep learning-based models, which require extensive datasets to achieve robust performance. To address these challenges, we introduce a newly constructed dataset of Khmer scene text, comprising 29,601 annotated text lines from 10,000 unique images. This dataset is highly diverse and challenging, encompassing artistic text, blurred text, low-light conditions, curved text, text in complex backgrounds, and occluded text. Each text line is annotated with polygonal bounding box coordinates and line-level transcriptions, alongside attributes describing background complexity, character appearance, and text style. To establish a foundational benchmark for future research in Khmer OCR, we provide baseline results for Khmer text detection and recognition. Additionally, we propose a robust evaluation metric tailored for Khmer OCR, enabling precise assessment of CER and WER while accounting for the unique characteristics of the Khmer script.","In this paper, TextSAM-LoRA is presented as a novel pipeline for high-precision text detection that leverages the Segment Anything Model (SAM) as a base semantic segmentation model, efficiently fine-tuned with Low-Rank Adaptation (LoRA) layers for text segmentation tasks. Although SAM has demonstrated remarkable generalization capabilities across various segmentation tasks, its application to text detection remains largely underexplored. By integrating LoRA, SAM can be efficiently adapted to the text domain, significantly reducing both the computational cost and parameter overhead typically associated with fine-tuning large-scale models. The extensive experiments carried out on three benchmark datasets\u2014CTW1500, MSRA-TD500 and Total-Text\u2014demonstrate that TextSAM-LoRA achieves competitive state-of-the-art performance. Notably, on CTW1500 the approach outperforms previous methods with an F1-score of 90.4%, highlighting its exceptional ability to accurately detect complex curved texts. This work showcases the potential of combining foundational segmentation models with lightweight adaptation techniques for building specific and accurate text detection systems with limited computational resources.","In real-world scenarios, text embedded in images is frequently subjected to corruption due to various factors such as occlusion, noise, fading, or physical damage. These degradations are prevalent in diverse applications, including street view text recognition and scene text understanding, significantly hindering the utility of text in downstream tasks such as optical character recognition and natural language processing. Existing methods for text image inpainting often rely on additional prompts or external data to guide the restoration process, which not only increases complexity but also limits their applicability in scenarios where such auxiliary information is unavailable. To address these challenges, we propose a novel approach, termed MultiModalTextInpaintingNetwork (MMTINet), which directly extracts and fuses textual semantics from the image itself without requiring any external prompts. By leveraging the inherent textual information within the image, our method achieves a more seamless and context-sensitive restoration, significantly improving the accuracy and fidelity of the reconstructed text. We evaluate MMTINet on a benchmark dataset, demonstrating its effectiveness in recovering missing or occluded text while preserving the original content and style. Experimental results highlight the efficacy and potential of our approach, showcasing its superior performance in advancing text restoration tasks through image-driven text semantics.","Online handwritten signature verification plays a crucial role in digital security applications, particularly in scenarios requiring high authenticity and fraud prevention. Path Signature, serving as a robust temporal modeling method, has demonstrated its effectiveness in recent years for its time reparametrization invariance. However, its practical application is limited by inherent challenges, such as the curse of dimensionality. Thanks to Path Development and its trainable variant Path Development layer (Dev), which retain the virtue in Path Signature while overcoming its limitations, we structurally weave Path Dev elopment in to Online Sig nature Verification and propose DevInSight (with extra \u2018ht\u2019 for legibility). Our approach incorporates several modifications for the hierarchically stacked Dev, including Windowing Strategy, Grouping Strategy and Absolute-Information-Augmentation. Additionally, Local Focus Module (LFM) and Global Fusion Module (GFM) are designed and integrated into the model to improve feature extraction and expand perceptual scope. For verification decision making, we utilize a Dynamic Time Warping (DTW) based verifier. Experiments on two large-scale online signature datasets in different languages show that DevInSight outperforms existing methods on MSDS-ChS (Chinese), especially in challenging scenarios like single-template and cross-session verification, and achieves competitive results on DeepSignDB (Latin). Furthermore, we extend DevInSight to online digital string verification, showcasing its promising generalization capability for other handwritten content. The code will be made publicly available.","In real Offline Handwritten Signature Verification (OHSV) scenarios, skilled forged signatures are extremely rare and cannot be accessed during model training and verification stages. Therefore, the difference between genuine signatures and skilled forgeries is hard to capture in this scenario. In this paper, a forged signature generation method named SigLDiff based on latent diffusion models is proposed to address the challenge that skilled forgery cannot be accessed in OHSV tasks. SigLDiff constructs a forged signature generation approach with fine-grained variations by disentangling the content features of genuine signatures from the style characteristics of other genuine signatures. Specifically, the proposed method initially employs the multiscale content aggregation module to integrate the global and local stroke feature of genuine signatures, which effectively enhances the detailed information of signature strokes at different scales. Moreover, to capture style features of signatures, a cross-scale style representation module is proposed to extract handwriting style features at various abstraction levels via a pre-trained VGG network. As a result, style transfer of genuine signatures is implemented in the latent space, enabling generated samples to preserve the content features of the target user while exhibiting diverse forgery styles. Extensive experimental results on five public datasets demonstrate that verification models trained with our generated samples defeat models without authentic skilled forgeries.","In this paper, we approach the problem of minimizing the global Equal Error Rate (EER) in a Writer-Independent (WI) Online Signature Verification (OSV) system by decomposing it into two components: the separation error and the alignment error. The separation error arises from the lack of a correct separation between genuine and forged signatures, while the alignment error arises from the inability of a single global threshold to effectively capture the writer-specific separations. To this, we propose HoLoSig, a novel framework that integrates two popular deep signature representations via a shared 1D convolutional backbone that bifurcates into two specialized branches. On one branch, we employ Triplet Loss with Soft-DTW to learn variable-length local representations whose dissimilarity scores are shifted to a common region with the help of the Maximum Mean Discrepancy (MMD) to improve the system\u2019s performance when using a global threshold. On the other branch, we employ Poly-1 Cross Entropy Loss to learn fixed-length holistic representations that are used to further boost the separation created by the local representation branch. HoLoSig achieves state-of-the-art results on DeepSignDB, the largest OSV dataset to date, against skilled and random forgeries in the stylus scenario, with EERs of 1.73% (4vs1 skilled), 3.29% (1vs1 skilled), 0.43% (4vs1 random) and 0.89% (1vs1 random). The source code is available at https://github.com/DYosplay/HoLoSig .","The increasing demand for data privacy has spurred interest in generative models for simulating tabular data. However, the diverse data types and column distributions in tabular datasets present substantial challenges in developing efficient and expressive generative models. Existing approaches focus on learning joint distributions and statistics to generate distribution-consistent synthetic tables but often fail to capture global feature interactions and adapt to the requirements of downstream tasks. Moreover, current methods exhibit sensitivity to the ordering of input data during training, which leads to suboptimal performance. In this paper, we introduce HyperTab, a novel generative model based on hypergraph modeling and adversarial training. HyperTab leverages hypergraphs to capture the permutation invariance inherent in tabular data. By utilizing a hypergraph encoder, it explicitly models the interaction relationships between features, ensuring that the synthesized data accurately reflects global dependencies. Additionally, HyperTab adopts a multi-objective optimization strategy, simultaneously minimizing adversarial loss to ensure data authenticity, logical consistency loss to maintain the rationality of feature relationships, and task-specific losses, including mean squared error for regression tasks and cross-entropy for classification tasks. Extensive evaluations across multiple benchmark datasets demonstrate that HyperTab significantly outperforms existing methods in terms of generation quality.","Radical-based approaches for Chinese character recognition (CCR) have been extensively investigated and demonstrated substantial improvements. Chinese characters are generally decomposed into structural components and radicals, with recognition being accomplished through the accurate identification of these elements. However, the inherent complexity and diversity of Chinese radicals, combined with variations in writing styles, introduce ambiguities, potentially leading to suboptimal model performance. Such challenges are particularly evident when distinguishing radicals with visually similar characteristics. To address these limitations, this paper proposes a novel Adaptive Radical Similarity Measurement (ARSM) module, which enhances the robustness and generalization of CCR models by dynamically measuring the similarity between radical pairs and integrating this information with radical features. ARSM enables more robust feature integration and facilitates the development of a specialized loss function tailored for optimizing model parameters, thereby improving recognition accuracy. Comprehensive experiments conducted on multiple benchmark datasets demonstrate the effectiveness and robustness of the proposed method.","Engineering diagrams (EDs) provide a rich source of information and play a critical role across various industries. However, the inherent complexity of EDs complicates automatic analysis and processing. These diagrams often contain 100 to 200 visually similar symbols, leading to challenges such as inter-class similarity, overlapping symbols, and substantial background noise. Although recent deep learning-based architectures have shown promising performance in recognising these symbols, these models are heavy and computationally expensive, restricting their use for deployment on resource-constrained devices. Thus, we propose a lightweight knowledge distillation framework for EDs. The framework integrates feature-based and output-level distillation, enabling a lightweight student model to learn from a more complex teacher model. Feature-based distillation is enhanced through Channel-Wise Distillation (CWD) loss, improving spatial and contextual representation, and reducing computational complexity. The output-level distillation employs Kullback-Leibler (KL) divergence to closely align the student model predictions with the teacher\u2019s probability distributions. Extensive experiments on private and public datasets demonstrate that our approach achieves a 6.9% improvement in mean average precision (mAP), reduces model size by 74.5% and decreases computational cost by 82.7%. The proposed method offers significant potential for real-time industrial applications on edge devices and sets the foundation for further advancements in ED analysis.","Document Image Machine Translation (DIMT) seeks to translate text embedded in document images from one language to another by jointly modeling both textual content and page layout\u2014bridging optical character recognition (OCR) and natural language processing (NLP). The DIMT 2025 Challenge advances research on end-to-end document image translation, a rapidly evolving area within multimodal document understanding. The competition features two tracks\u2014OCR-free and OCR-based\u2014each with two subtasks for small ( $$\\le $$ \u2264 1B parameters) and large (&gt; 1B parameters) models. Participants submit a single unified DIMT system, with the option to incorporate provided OCR transcripts. Running from December 10, 2024 to April 20, 2025, the competition attracted 69 teams and 27 valid submissions in total. Track 1 had 34 teams and 13 valid submissions, while Track 2 had 35 teams and 14 valid submissions. In this report, we present the challenge motivation, dataset construction, task definitions, evaluation protocol, and a summary of results. Our analysis shows that large-model approaches establish a promising new paradigm for translating complex-layout document images and highlight substantial opportunities for future research.","The integration and application of Multimodal Large Language Models (MLLMs) in the education sector offers significant potential for automating tasks such as exam grading and personalized learning. However, current MLLMs are predominantly trained on English text and simplified document formats, which limits their performance on complex, non-English documents like exam papers. Key challenges in understanding exam papers include accurate text extraction, maintaining the correct reading order, and ensuring logical coherence across multiple pages. Addressing these issues is critical for the practical deployment of MLLMs in educational applications. To advance research in this area, we organized the ICDAR 2025 Competition on Understanding Chinese College Entrance Exam Papers. This competition introduced the CEP-7K dataset, consisting of 7,000 question-answer pairs and their corresponding exam paper images, to assess MLLMs\u2019 abilities in tackling these challenges. Held from December 10, 2024, to April 18, 2025, the competition received six valid submissions. Compared to the benchmark model Qwen2.5-VL-32B-Instruct, the participating teams have achieved up to a 42% improvement in accuracy. This report provides an overview of the dataset, task design, and evaluation metrics. It also presents the evaluation results and highlights key insights and advancements gained from the competition.","This report describes the ICDAR 2025 Competition on Automatic Classification of Literary Epochs (ICDAR 2025 CoLiE), which consisted of two tasks focused on automatic prediction of the time in which a book was written (date of first publication). Both tasks comprised two sub-tasks, where a related fine-grained classification was addressed. Task 1 consisted of the identification of literary epochs, such as Romanticism or Modernism (sub-task 1.1), and a more precise classification of the period within the epoch (sub-task 1.2). Task 2 addressed the chronological identification of century (sub-task 2.1) or decade (sub-task 2.2). The compiled dataset and the reported findings are valuable to the scientific community and contribute to advancing research in the automatic dating of texts and its applications in digital humanities and temporal text analysis.","This report presents the results of the inaugural ICDAR 2025 Handwritten Notes Understanding Competition, centered on evidence-based question answering over complex scientific handwritten notes. The final competition test set included over 2,000 real academic note images and 1,000 curated questions across diverse STEM domains, characterized by varied layouts, diagrams, and dense equations. The overall challenge was structured as a single task with a multi-phase evaluation protocol designed to assess not only answer correctness but also grounded reasoning ability , requiring models to localize the exact visual evidence supporting their answers. Hosted on the Robust Reading Challenge (RRC) Portal, the competition ensured fair, private-set benchmarking, with 6 valid submissions out of 16 registered teams. The results underscore the obstacles that current state-of-the-art (SOTA) vision-language models (VLMs) face in multimodal reasoning over handwritten content. This first edition marks a promising step toward interpretable, layout-aware document understanding and sets the foundation for future iterations.","Historical maps are valuable for history, social sciences, and linguistics but pose challenges for automatic transcription. This competition edition continues to address detection, recognition, and linking of text in historical maps, with new features: expanded French Land Registers data, a new Taiwanese dataset with Chinese characters, synthetic training data, and improved linking evaluation metrics. Seven teams participated with over 25 submissions across four tasks and three datasets. While detection performance is strong, recognition and linking remain difficult, though improvements were seen with B\u00e9zier curve line fitting and enhanced linking pipelines. All resources are publicly available on Zenodo ( https://zenodo.org/communities/icdar-maptext ).","Text line segmentation is a critical step in handwritten document image analysis. Segmenting text lines in historical handwritten documents, however, presents unique challenges due to irregular handwriting, faded ink, and complex layouts with overlapping lines and non-linear text flow. Furthermore, the scarcity of large annotated datasets renders fully supervised learning approaches impractical for such materials. To address these challenges, we introduce the Few-Shot Text Line Segmentation of Ancient Handwritten Documents (FEST) Competition. Participants are tasked with developing systems capable of segmenting text lines in U-DIADS-TL dataset, using only three annotated images per manuscript for training. The competition dataset features a diverse collection of ancient manuscripts exhibiting a wide range of layouts, degradation levels, and non-standard formatting, closely reflecting real-world conditions. By emphasizing few-shot learning, FEST competition aims to promote the development of robust and adaptable methods that can be employed by humanities scholars with minimal manual annotation effort, thus fostering broader adoption of automated document analysis tools in historical research."]],["abstract_short",["Document Layout Analysis\u2026","Document layout analysis is\u2026","Information extraction from\u2026","End-to-end visual information\u2026","Handwritten Mathematical\u2026","While encoder-decoder\u2026","Handwritten Text Recognition\u2026","Handwritten text generation\u2026","Current methods for\u2026","Automatic font generation\u2026","Lecture slide element\u2026","We introduce InfoDesignLM, a\u2026","Academic documents stored in\u2026","Despite the remarkable\u2026","Table detection recognizes\u2026","Recognizing textual\u2026","Handwritten signatures remain\u2026","Personality trait\u2026","Large multimodal models\u2026","Image-text extraction is a\u2026","The surge in social media\u2026","Charge prediction is an\u2026","Topic modeling is a technique\u2026","Business documents often\u2026","Historical maps offer an\u2026","The automatic extraction of\u2026","Historical maps contain\u2026","Text on historical maps\u2026","Governments worldwide have\u2026","Federated Learning (FL)\u2026","Online signature verification\u2026","This paper investigates the\u2026","Line-level handwritten text\u2026","Multi-stroke characters in\u2026","Text recognition systems are\u2026","Handwritten Chinese Text\u2026","Existing document shadow\u2026","Recent advances in scene text\u2026","Modern scene text recognition\u2026","In this paper, we demonstrate\u2026","We present the elaboration of\u2026","Learning to interpret sheet\u2026","Currently, document parsing\u2026","Table structure recognition\u2026","In this study, we propose a\u2 nt Framework for Writer Inspection from Intra-variable Handwritten Words","Table Detection with Active Learning","ExamCleaner: Examination-Paper Handwritten Text Erasure via Large Receptive Field Context Anchor Attention","CHSAM: Efficient Scene Text Segmentation via SAM with Convolutional Adapters and Hierarchical Decoding","A New Fourier-Attention Guided Approach for Domain-Agnostic Text Localization","StrokeNet: Unveiling How to Learn Fine-Grained Interactions in Online Handwritten Stroke Classification","HisDoc-DETR: Integrating Semantic Learning and Feature Fusion for Historical Document Layout Analysis","Multimodal Content Alignment with LLM for Visual Presentation of Papers","VMF-Net: Visual-Aware Multi-representation Fusion Network for Artifact-Free Handwritten Mathematical Expressions Generation","KIEval: Evaluation Metric for Document Key Information Extraction","BiblioPage: A Dataset of Scanned Title Pages for Bibliographic Metadata Extraction","Towards Understanding the Logical Layout of Scene Text in Signboard Images","Verification of Dynamic Holographic Behavior in Identity Documents","Evaluating Handwritten Text Recognition in Medieval Notarial Manuscripts: A New Dataset and Comprehensive Analysis","Scene Script Identification Using Dense Hierarchical Semantic Fusion","Mask CoMER: Enhancing Handwritten Mathematical Expression Recognition with Masked Language Pretraining and Regularization","Self-HTR: A Novel Self-supervised Handwritten Text Recognition Framework Using Generative Adversarial Networks","Radical Sequence Encoding with Fine-Tuned CLIP for Handwritten Chinese Character Recognition","Few-Shot Segmentation of Historical Maps via Linear Probing of Vision Foundation Models","Version 5 of the Kraken ATR Engine for the Humanities","OracleGCD: Generalized Category Discovery for Oracle Bone Scripts","Ar-Q-Former: Historical Newspaper Article Separation Based on Multimodal Transformer Structure","Challenges in Revealing Readable Text from Fragments nuscripts in Fulfulde and Hausa","Optimizing Chart Image Classification: A Study of Data Augmentation and Training Strategies","Evaluating Compliance with Visualization Guidelines in Diagrams for Scientific Publications Using Large Vision Language Models","Practical Fine-Tuning of Autoregressive Models on Limited Handwritten Texts","Historic Scripts to Modern Vision: A Novel Dataset and A VLM Framework for Transliteration of Modi Script to Devanagari","Japanese Kuzushiji Font Generation Employing Differentiable Renderer","Multi-task Learning for Hebrew Paleography: Script Classification and Date Estimation","MultKMAWE: A Multi Key-Points Based Word Extraction Algorithm for Manchu Archives","KuiSCIMA V2.0: Improved Baselines, Calibration, and Cross-Notation Generalization for Historical Chinese Music Notations in Jiang Kui\u2019s Baishidaoren Gequ","TableCall: Boosting Table Question Answering with Tool-Driven Training-Free LLMs","Rx-PAD: Recognition and eXtraction \u2013 A Dataset for Prescription Analysis and Clinical Data Structuring","ColorGPT: Leveraging Large Language Models for Multimodal Color Recommendation","GAMeta-Prompt: A Generative Adversarial Prompt-Based Meta-language Reasoning Enhancement Method","Entity-Dependency Memory-Enhanced Document-Level Relation Extraction","A Learning-Based Method for Automatically Determining Application Sequence of Intersecting Ink Lines Using Photometric Stereo","TST: Tree Structured Transformer for Handwritten Mathematical Expression Recognition","TABLET: Table Structure Recognition Using Encoder-only Transformers","QUEST: Quality-Aware Semi-supervised Table Extraction for Business Documents","Skeleton-Guided Artistic Text Recognition","Inverse Scene Text Removal","Towards Scene Text Recognition in Rainy Weather Conditions","WildKhmerST: A Comprehensive Dataset and Benchmark for Khmer Scene Text Detection and Recognition in the Wild","TextSAM-LoRA: Efficient Fine-Tuning of Segment Anything Model for Text Detection with Low-Rank Adaptation","Fusing Text Semantics for Text Image Inpainting","DevInSight: Weaving Path Development Into Online Signature Verification","SigLDiff: A Signature Based Latent Diffusion Model for Forged-Free Offline Signature Verification","HoLoSig: Holistic and Local Representation Learning for Online Signature Verification","Hypergraph-Driven Tabular Data Synthesis with Multi-objective Optimization","Adaptive Radical Similarity Learning for Chinese Character Recognition","KD-LSRED : Knowledge Distillation for Lightweight Symbol Recognition in Engineering Diagrams","ICDAR 2025 Competition on End-to-End Document Image Machine Translation Towards Complex Layouts","ICDAR 2025 Competition on Understanding Chinese College Entrance Exam Papers","ICDAR 2025 Competition on Automatic Classification of Literary Epochs","ICDAR 2025 Handwritten Notes Understanding Challenge","ICDAR 2025 Competition on Historical Map Text Detection, Recognition, and Linking","ICDAR 2025 Competition on FEw-Shot Text Line Segmentation of Ancient Handwritten Documents (FEST)"]],["abstract",["Document Layout Analysis (DLA) is a fundamental task in document understanding. However, existing DLA and adaptation methods often require access to large-scale source data and target labels. This requirements severely limiting their real-world applicability, particularly in privacy-sensitive and resource-constrained domains, such as financial statements, medical records, and proprietary business documents. According to our observation, directly transferring source-domain fine-tuned models on target domains often results in a significant performance drop (Avg. $${-}32.64\\%$$ - 32.64 % ). In this work, we introduce Source-Free Document Layout Analysis (SFDLA) , aiming for adapting a pre-trained source DLA models to an unlabeled target domain, without access to any source data. To address this challenge, we establish the first SFDLA benchmark, covering three major DLA datasets for geometric- and content-aware adaptation. Furthermore, we propose Document Layout Analysis Adapter (DLAdapter) , a novel framework that is designed to improve source-free adaptation across document domains. Our method achieves a $${+}4.21\\%$$ + 4.21 % improvement over the source-only baseline and a $${+}2.26\\%$$ + 2.26 % gain over existing source-free methods from PubLayNet to DocLayNet. We believe this work will inspire the DLA community to further investigate source-free document understanding. To support future research of the community, the benchmark, models, and code will be publicly available at https://github.com/s3setewe/sfdla-DLAdapter .","Document layout analysis is essential for downstream tasks such as information retrieval, extraction, OCR, and digitization. However, existing large-scale datasets like PubLayNet and DocBank lack fine-grained region labels and multilingual diversity, making them insufficient for representing complex document layouts. Human-annotated datasets such as $$M^{6}Doc$$ M 6 D o c \u00a0and $$\\text {D}^{4}\\text {LA}$$ D 4 LA \u00a0offer richer labels and greater domain diversity, but are too small to train robust models and lack adequate multilingual coverage. This gap is especially pronounced for Indic documents, which encompass diverse scripts yet remain underrepresented in current datasets, further limiting progress in this space. To address these shortcomings, we introduce IndicDLP , a large-scale foundational document layout dataset spanning 11 representative Indic languages alongside English and 12 common document domains. Additionally, we curate UED-mini , a dataset derived from DocLayNet and $$M^{6}Doc$$ M 6 D o c , to enhance pretraining and provide a solid foundation for Indic layout models. Our experiments demonstrate that fine-tuning existing English models on IndicDLP \u00a0significantly boosts performance, validating its effectiveness. Moreover, models trained on IndicDLP \u00a0generalize well beyond Indic layouts, making it a valuable resource for document digitization. This work bridges gaps in scale, diversity, and annotation granularity, driving inclusive and efficient document understanding.","Information extraction from documents has become increasingly popular due to the rise of large language models (LLMs) and re-augmented generation (RAG) models. Document Layout Analysis (DLA) is a fundamental task in document AI, playing a crucial role in identifying semantically related elements within a document\u2014a key step toward effective information extraction. Modern document layout analysis algorithms benefit from large-scale annotated datasets but suffer significant performance drops when tested across different datasets, limiting the generalization of models trained on a single source. To address this, we utilize a multi-dataset training approach for a Universal Layout Detection (UniLayDet) model utilizing a shared detection architecture with dataset-specific outputs and unifying the label space post-training through an automatic merging process. UniLayDet significantly improves generalization across datasets compared to models trained individually and also achieves competitive in-domain performance, notably attaining a mAP (@IoU[0.5\u20130.95]) of 68.9% on M $$^6$$ 6 Doc (partitioned setting), close to the existing SOTA of 69.9%, showing that our model is simple yet effective for the task. Code and models are available at github.com/Mobius1D/UniLayDet .","End-to-end visual information extraction (VIE) aims at integrating the hierarchical subtasks of VIE, including text spotting, word grouping, and entity labeling, into a unified framework. Dealing with the gaps among the three subtasks plays a pivotal role in designing an effective VIE model. OCR-dependent methods heavily rely on offline OCR engines and inevitably suffer from OCR errors, while OCR-free methods, particularly those employing a black-box model, might produce outputs that lack interpretability or contain hallucinated content. Inspired by CenterNet, DeepSolo, and ESP, we propose HIP, which models entities as HI erarchical P oints to better conform to the hierarchical nature of the end-to-end VIE task. Specifically, such hierarchical points can be flexibly encoded and subsequently decoded into desired text transcripts, centers of various regions, and categories of entities. Furthermore, we devise corresponding hierarchical pre-training strategies, categorized as image reconstruction, layout learning, and language enhancement, to reinforce the cross-modality representation of the hierarchical encoders. Quantitative experiments on public benchmarks demonstrate that HIP outperforms previous state-of-the-art methods, while qualitative results show its excellent interpretability.","Handwritten Mathematical Expression Recognition (HMER) is foundational for educational technologies, enabling applications like digital note-taking and automated grading. While modern encoder-decoder architectures with large language models excel at LaTeX generation, they lack explicit symbol-to-trace alignment \u2013 a critical limitation for error analysis, interpretability, and spatially aware interactive applications requiring selective content updates. This paper introduces a structural recognition approach with two innovations: (1) an automatic annotation system that uses a neural network to map LaTeX equations to raw traces, automatically generating annotations for symbol segmentation, classification, and spatial relations, and (2) a modular structural recognition system that independently optimizes segmentation, classification, and relation prediction. By leveraging a dataset enriched with structural annotations from our auto-labeling system, the proposed recognition system combines graph-based trace sorting, a hybrid convolutional-recurrent network, and transformer-based correction to achieve competitive performance on the CROHME-2023 benchmark. Crucially, our structural recognition system generates a complete graph structure that directly links handwritten traces to predicted symbols, enabling transparent error analysis and interpretable outputs. Our results challenge the perception that structural methods are outdated, demonstrating their viability when supported by high-quality annotated data. To promote reproducibility and future research, we release the annotated CROHME+ and MathWriting+ datasets, providing data for advancing interpretable HMER systems.","While encoder-decoder architectures have significantly advanced Handwritten Mathematical Expression Recognition (HMER), current language model (LM)-based correction methods face inherent limitations. Although LM can mitigate contextual errors by leveraging textual semantics, their effectiveness is ultimately hindered by the semantic-poverty problem: mathematical expressions convey complex structural relationships that go beyond linguistic representation alone. In this paper, we argue that visual features, such as the spatial relationships between symbols, should be given equal importance alongside linguistic information when correcting HMER system outputs. We introduce the Position-Aware Cross-Modality correction framework, which creates a visual-linguistic equivalence for error rectification. Specifically, we propose a Dual-Stream Fusion Module to integrate symbol-level visual features with linguistic context in parallel, enabling joint visual-linguistic reasoning to address ambiguities caused by segmentation errors and symbol misinterpretations. Additionally, we introduce the Position-Aware Module, which applies dynamic spatial attention driven by symbol density heatmaps, allowing for adaptive focus on both global layout and local symbol interactions. Experiments on two widely used benchmark datasets validate the superiority of our method, achieving state-of-the-art performance of 62.32% / 61.58 % / 63.38% on CROHME 2014 / 2016 / 2019 and 70.81% on HME100K.","Handwritten Text Recognition (HTR) remains a challenging task, particularly for child handwriting, which often exhibits irregular letter formation, letter crowding, mirrored letters, and phonological spelling errors. The presence of these characteristics is rare in adult handwriting, which forms the primary training data for most existing HTR systems and multimodal large language models (MLLMs). Consequently, current models often autocorrect or misinterpret these features, limiting their effectiveness in contexts where accurate handwritten text recognition is crucial. This is particularly problematic for identifying specific learning disabilities (SLDs) like dyslexia and dysgraphia, where features such as letter reversals, inversions, and spelling mistakes are key diagnostic indicators. To address this gap, we introduce Extended-TrOCR (E-TrOCR), an adaptation of the transformer-based optical character recognition (TrOCR) model specifically designed for child handwriting. E-TrOCR uses a two-stage training process, starting with the IAM dataset for general handwriting recognition, followed by fine-tuning on a dedicated child handwriting dataset. The model employs character-level tokenization to prevent autocorrection and introduces a novel 220-alphabet to represent letter reversals and inversions. Trained on over 1,800 text lines from elementary school students, E-TrOCR significantly outperforms state-of-the-art HTR models, underscoring the necessity of dedicated solutions for child handwriting recognition.","Handwritten text generation (HTG) aims to imitate specific writers to synthesize handwritten text images, which has a wide range of applications and thus has significant research value. However, current studies on HTG face a central bottleneck. Dominant models, built utilizing generative adversarial networks (GANs), constantly struggle with error conditioning from the style classifier due to long-tailed distributions. The issue results in samples generated by mainstream HTG methods lacking diversity. In this work, we propose a plug-and-play method, namely Dynamic Category Compression (DCC), to enhance the recognition ability of the style classifier and provide potent constraints for the generator. Specifically, DCC improves the distinction of tail class samples by adaptively increasing the density of backbone features. We apply DCC to state-of-the-art methods and previous prominent works, then evaluate them on widely used handwriting datasets. Extensive experiments fully demonstrate the effectiveness and generality of our method. Our code is publicly available at:\u00a0 https://github.com/Fyzjym/DCC .","Current methods for handwritten Chinese text generation primarily focus on generating individual characters. However, for practical applications, users often require a handwritten text-line generation model to streamline their workflows. Generating stylized handwritten text-line necessitates capturing both character-level styles (e.g., stroke thickness, ink color, and cursive join) and text-line-level styles (e.g., inter-character spacing and text-line inclination). To address this challenge, we propose a novel cascaded diffusion architecture (i.e., Layout-Diff and Imitating-Diff) to disentangle these two levels of styles via customized template guidance. Specifically, Layout-Diff assists in synthesizing a template image, where the visual archetypes, rendered in a printed font, are well-arranged on a blank canvas. Subsequently, Imitating-Diff transforms this synthesized template into a stylized handwritten text-line image. We propose a latent aggregation module to efficiently incorporate textual guidance into Imitating-Diff while reducing computational cost. Furthermore, we design a high-frequency weighted loss for fine-tuning Imitating-Diff in the pixel space to preserve structure details with clarity. Extensive experiments demonstrate that our method effectively mimics diverse handwriting styles while ensuring structural accuracy in generated text lines.","Automatic font generation aims to synthesize glyph images in a target font style using only a limited number of reference images. Current methods typically adopt a content-style disentanglement strategy by employing two separate networks to extract content and style features. However, such approaches may be affected by the imperfect disentanglement and neglect critical style transformation patterns between source and target fonts. To address these limitations, we propose FSTDiff, a novel framework that explicitly learns cross-font style transformations. In our approach, we introduce a Font Style Transformation (FST) module that explicitly captures the style transformation from the source font to the target font, thereby alleviating the issue of residual source font style information in the content features. This module leverages learnable queries to automatically extract both global and local style details and convert them into a style transformation representation. Extensive experiments demonstrate that FSTDiff achieves state-of-the-art performance across various characters and font types.","Lecture slide element detection and retrieval are key problems in slide understanding. Training effective models for these tasks often depends on extensive manual annotation. However, annotating large volumes of lecture slides for supervised training is labor intensive and requires domain expertise. To address this, we propose a large language model (LLM)-guided synthetic lecture slide generation pipeline, SynLecSlideGen, which produces high-quality, coherent and realistic slides. We also create an evaluation benchmark, namely RealSlide by manually annotating 1,050 real lecture slides. To assess the utility of our synthetic slides, we perform few-shot transfer learning on real data using models pre-trained on them. Experimental results show that few-shot transfer learning with pretraining on synthetic slides significantly improves performance compared to training only on real data. This demonstrates that synthetic data can effectively compensate for limited labeled lecture slides. The code and resources of our work are publicly available on our project website:\u00a0 https://synslidegen.github.io/","We introduce InfoDesignLM, a model that enables interactive infographic layout design using only textual descriptions, mimicking the creative process of a human designer. In contrast to traditional methods that depend on multimodal vision models, our approach leverages large language models (LLMs) to complete both layout planning and generation tasks through text alone. To facilitate this, we developed a semantically-driven dataset, InfoLap, which helps the LLM establish an accurate mapping between text semantics and layout design. Despite eliminating the need for vision encoders, our method outperforms state-of-the-art multimodal models like GPT-4o in a series of experiments. This advancement not only highlights the potential of LLMs in cross-modal understanding and the generation of 2D layouts but also paves the way for new automated design applications in the Visual Rich Document (VRD) domain.","Academic documents stored in PDF format can be transformed into plain text structured markup languages to enhance accessibility and enable scalable digital library workflows. Markup languages allow for easier updates and customization, making academic content more adaptable and accessible to diverse usage, such as linguistic corpus compilation. Such documents, typically delivered in PDF format, contain complex elements including mathematical formulas, figures, headers, and tables, as well as densely layouted text. Existing end-to-end decoder transformer models can transform screenshots of documents into markup language. However, these models exhibit significant inefficiencies; their token-by-token decoding from scratch wastes a lot of inference steps in regenerating dense text that could be directly copied from PDF files. To solve this problem, we introduce EditTrans, a hybrid editing-generation model whose features allow identifying a queue of to-be-edited text from a PDF before starting to generate markup language. EditTrans contains a lightweight classifier fine-tuned from a Document Layout Analysis model on 162,127 pages of documents from arXiv. In our evaluations, EditTrans reduced the transformation latency up to 44.5% compared to end-to-end decoder transformer models, while maintaining transformation quality. Our code and reproducible dataset production scripts are open-sourced.","Despite the remarkable progress made by large language models (LLMs) in natural language understanding, they still struggle to effectively comprehend visually-rich documents (VRDs) that demand complex semantic analysis. This paper introduces HiDReader, the first reinforcement learning-based framework designed to emulate human-like reading processes for visually-rich document comprehension. By integrating LLMs with specialized document understanding models, HiDReader leverages a self-optimizing, data-driven reading sequence mechanism that mimics human learning patterns rather than relying on traditional rule-based or fixed parsing strategies. Through iterative self-supervised learning, HiDReader dynamically adapts its reading path based on contextual cues and task-specific goals, refining its approach in a way that mirrors the adaptability of human cognition. Experimental results on two benchmark tasks demonstrate that HiDReader outperforms baseline methods in both document information extraction and question answering. Moreover, in cross-domain transfer learning scenarios, it showcases significant adaptability, autonomously extracting characteristic reading patterns from VRDs, thereby achieving superior performance in zero-shot domain adaptation tasks compared to conventional approaches.","Table detection recognizes and accurately determines the position of tables within document images. This task involves both classification and precise localization of these table elements. Conventional table detection methods usually depend on extensive labeled data, creating a challenge in generating high-quality labels for training. To address this, many semi-supervised approaches are proposed. These methods utilize either CNN-based networks, which rely on anchor generation and NMS (Non-Maximum Suppression), or employ transformer-based models with performance linked to the quality of object queries. In this paper, we propose a transformer-based semi-supervised approach that improves the quality of object queries. We take high-level query features from unlabeled images and find similarities with decoder original queries by an enhanced query selection network. It provides high-quality, refined queries, allowing the model to make precise predictions or classifications with minimal labeled data. Results on benchmarks such as Publaynet, DocBank, PubTables, and ICDAR 19 have demonstrated that this innovative approach significantly outperforms traditional supervised and semi-supervised methods. On just 1% label data, our approach obtains 98.1% mAP, 96.4% mAP, and 82.8% mAP on PubTables, PubLayNet, and DocBank datasets, respectively. The state-of-the-art results show the effectiveness of our approach.","Recognizing textual attributes such as bold , italic , underline , and The image shows the word \"strikeout\" with a horizontal line through the middle, indicating text that has been struck through. is essential for understanding text semantics, structure, and visual presentation. These attributes highlight key information, making them crucial for document analysis. Existing methods struggle with computational efficiency or adaptability in noisy, multilingual settings. To address this, we introduce TexTAR , a multi-task, context-aware Transformer for Textual Attribute Recognition (TAR). Our novel data selection pipeline enhances context awareness, and our architecture employs a 2D RoPE (Rotary Positional Embedding)-style mechanism to incorporate input context for more accurate attribute predictions. We also introduce MMTAD , a diverse, multilingual, multi-domain dataset annotated with text attributes across real-world documents such as legal records, notices, and textbooks. Extensive evaluations show TexTAR outperforms existing methods, demonstrating that contextual awareness contributes to state-of-the-art TAR performance.","Handwritten signatures remain a primary method for identity verification due to their accessibility and non-intrusiveness. Despite advances in deep learning and computer vision, signature recognition still faces challenges, particularly in handling small-sample training and high intra-class variability. To address these issues, we propose the first audio-visual multimodal framework for handwritten signature recognition. Our model, MSSSRNet, integrates a residual module-based two-path fusion network and an attentional feature fusion (AFF) module. By employing a cross-modal audio-visual fusion strategy, the network captures both global and local features from signature images and pen stroke audio, learning their interactions through an attention mechanism. To the best of our knowledge, this is the first application of audio-visual multimodal representation in handwritten signature recognition. To support this research, we introduce a novel dataset comprising 2,000 real samples from 100 individuals, the first publicly available dataset to include both signature images and pen stroke audio signals. Experimental evaluations on our dataset and two widely used public benchmarks demonstrate the effectiveness of our approach, consistently outperforming state-of-the-art unimodal methods. Our findings highlight the biological significance of pen stroke audio in signature verification. The dataset is available at https://github.com/helloGit12345/MSSSR .","Personality trait identification from social media data has many applications in health monitoring, education, candidate screening, and business. Personality trait identification using text and images published on Social media (Twitter) is challenging due to unpredictable text and the background in the personality trait images. Unlike the existing studies that use multimodal (image and text) for the classification of personality traits images, this study fuses the text of emotions, text in the personality traits image, and image information. We believe that there is a strong correlation between emotion and personality traits. This observation motivated us to combine the textual features of emotional images, text in personality traits images, and image features. The above observations are captured through transformer encoders and multiple convolutional layers, followed by max-pool layers. Before feeding to transformers, our method extracts text in the personality trait images, resulting in text regions and non-text regions separately. Then, the proposed model obtains captions for the emotion and personality trait images. To integrate the strengths of the features extracted from emotion and personality text and images, the proposed work introduces a bilinear fusion approach, which fuses features and modalities. The experiments are conducted on different standard datasets of personality trait images to demonstrate the effectiveness of classification. A comparative study with state-of-the-art methods shows that our method is superior to existing methods. Experiments are also conducted on different races and genders to validate bias and fairness.","Large multimodal models (LMMs) have made impressive strides in image captioning, VQA, and video comprehension, yet they still struggle with the intricate temporal and spatial cues found in comics. To address this gap, we introduce ComicsPAP , a large-scale benchmark designed for comic strip understanding. Comprising over 100k samples and organized into 5 subtasks under a Pick-a-Panel framework, ComicsPAP demands models to identify the missing panel in a sequence. Our evaluations, conducted under both multi-image and single-image protocols, reveal that current state-of-the-art LMMs perform near chance on these tasks, underscoring significant limitations in capturing sequential and contextual dependencies. To close the gap, we adapted LMMs for comic strip understanding, obtaining better results on ComicsPAP than 10x bigger models, demonstrating that ComicsPAP offers a robust resource to drive future research in multimodal comic comprehension.","Image-text extraction is a critical research area in computer vision, with broad applications in document digitization and scene understanding. Traditional methods typically rely on specialized models designed for specific subtasks, which limits their generalizability across diverse scenarios. Recent progress in vision-language models has demonstrated significant potential for cross-scene text-related tasks. However, existing approaches often fail to adequately capture semantic features in text-related images and rely on rigid processing strategies, which struggle to adapt to the varying demands of textual scenes. To overcome these limitations, we introduce Text Large Language and Vision Assistant (T-LLaVA), an advanced vision-language model specifically optimized for text recognition. Specifically, we propose an effective activation mechanism that leverages text saliency and completeness to optimize processing routes, and a dynamic image slicing strategy that adapts to the spatial characteristics of input images. Extensive experiments show that T-LLaVA achieves competitive recognition accuracy across diverse scenarios, including natural scene text, cropped text, mathematical expressions, and document pages. These results validate the effectiveness and superiority of our proposed approach, highlighting its potential for robust and versatile text extraction in complex environments.","The surge in social media discussions has increased the need for automated summarization to
