0we tested our model on some benchmark datasets to ensure its robustness and generalizability. Experimental results demonstrate that\u00a0our method achieved promising performances in both identification\u00a0and verification tasks, outperforming state-of-the-art approaches.\u00a0These findings highlight the effectiveness of graph-based handwriting analysis in capturing intra-writer variations and the benefits\u00a0of knowledge distillation for efficient writer inspection.","Efficient data annotation remains a critical challenge\u00a0in machine learning, particularly for object detection tasks requiring extensive labeled data. Active learning (AL) has emerged as\u00a0a promising solution to minimize annotation costs by selecting\u00a0the most informative samples. While traditional AL approaches primarily rely on uncertainty-based selection, recent advances suggest\u00a0that incorporating diversity-based strategies can enhance sampling efficiency in object detection tasks. Our approach ensures\u00a0the selection of representative examples that improve\u00a0model generalization. We evaluate our method on two benchmark datasets (TableBank-LaTeX, TableBank-Word) using state-of-the-art\u00a0table detection architectures, CascadeTabNet and YOLOv9. Our results demonstrate that AL-based example selection significantly outperforms random sampling, reducing annotation effort given\u00a0a limited budget while maintaining comparable performance to\u00a0fully supervised models. Our method achieves higher mAP scores within\u00a0the same annotation budget.","Handwritten text erasion plays a pivotal role in enabling efficient digital archiving and enhancing examination\u00a0paper reusability within educational systems. Current methods, however, encounter performance bottlenecks due to limited receptive fields\u00a0of conventional convolution kernels when processing complex\u00a0page layouts and overlapping text scenarios. To address this challenge, we propose ExamCleaner, a novel handwritten text removal method\u00a0that integrats the Inception Large Kernel Convolution (ILKC) module\u00a0and the Context Anchor Attention (CAA) mechanisms. ExamCleaner\u00a0first expands the model receptive field through the ILKC module\u00a0and employs parallel multi-scale depthwise convolution to simultaneously capture long-range contextual dependencies and local texture details, thereby effectively distinguishing handwritten and printed text. Then, to alleviate the structural degradation of the original content throughout the erasure phase, the CAA mechanism dynamically anchors key contextual regions (e.g., formula layout,\u00a0table boundaries) through learnable spatial channel attention to prevent accidental deletion of original content during the restoration process. Experiments conducted on the EnsExam benchmark validate\u00a0the superior effectiveness of ExamCleaner in handwritten text removal tasks, achieving a remarkable PSNR of 33.45\u00a0dB and SSIM of 0.955.","Scene text segmentation is crucial for applications\u00a0such as document analysis and text removal. however, existing methods face challenges due to their reliance on costly pixel-level annotations and limited generalizability. Although deep learning models and the Segment Anything Model (SAM) have advanced segmentation technology, their direct application to\u00a0text segmentation suffers from domain gaps. To address this issue,\u00a0we propose CHSAM, a SAM-based framework with a Conv2d-Adapter\u00a0(an adapter with 2D convolution) and hierarchical decoding. First,\u00a0the Conv2d-Adapter fine-tunes SAM\u2019s image encoder using lightweight convolutional layers, enhancing local text feature extraction\u00a0while significantly reducing the number of trainable parameters. Second, through convolutional feature augmentation and mask feature augmentation, a two-stage decoder extracts and enhances implicit sparse embeddings from image embeddings to refine text features\u00a0and boundary granularity. Experiments on benchmark datasets demonstrate that CHSAM achieves superior segmentation performance, significantly outperforming the baseline SAM in terms of robustness to deformed text and unseen scenarios. Additionally, CHSAM supports efficient end-to-end inference without requiring complex post-processing steps.","Text detection in images of adverse situations like underwater images and open day and night environments, where one can expect the effect of shaky and non-shaky cameras, is challenging. This work aims to develop a new model that can cope with the challenges of different domains, namely, underwater images, shaky and non-shaky images, and normal scene images for text detection. The approach leverages the Fourier attention and kernels to enhance feature extraction, focusing on high-frequency components associated with text edges. These features are fed to dual-stream corner detection by employing vertical and horizontal pooling for robust text detection. Additionally, we introduce a cross-star deformable convolution layer, guided by Fourier-derived information, which dynamically adapts its receptive field to achieve precise bounding box localization. Bounding box predictions are iteratively refined using heatmaps and offset adjustments. Overall, by integrating frequency-domain analysis with spatially adaptive convolutional operations, our method excels across diverse text detection scenarios without requiring domain-specific adaptations. The performance of the proposed method is demonstrated by testing on three different datasets: underwater, shaky and non-shaky images, and normal natural scene images. The results show that the proposed method achieves state-of-the-art performance compared to the existing methods.","Stroke classification remains challenging due to variations in writing style, ambiguous content, and dynamic writing positions. The core challenge in stroke classification is modeling the semantic relationships between strokes. Our observations indicate that stroke interactions are typically localized, making it difficult for existing deep learning methods to capture such fine-grained relationships. Although viewing strokes from a point-level perspective can address this issue, it introduces redundancy. However, by selecting reference points and using their sequential order to represent strokes in a fine-grained manner, this problem can be effectively solved. This insight inspired StrokeNet, a novel network architecture encoding strokes as reference pair representations (points + feature vectors), where reference points enable spatial queries and features mediate interaction modeling. Specifically, we dynamically select reference points for each stroke and sequence them, employing an Inline Sequence Attention (ISA) module to construct contextual features. To capture spatial feature interactions, we devised a Cross-Ellipse Query (CEQ) mechanism that clusters reference points and extracts features across varying spatial scales. Finally, a joint optimization framework simultaneously predicts stroke categories via reference points regression and adjacent stroke semantic transition modeling through an Auxiliary Branch (Aux-Branch). Experimental results show that our method achieves state-of-the-art performance on multiple public online handwritten datasets. Notably, on the CASIA-onDo dataset, the accuracy improves from 93.81 $$\\%$$ % to 95.54 $$\\%$$ % , demonstrating the effectiveness and robustness of our approach.","This paper introduces HisDoc-DETR, a novel set prediction-based approach for historical document layout analysis. The method specifically addresses the unique challenges of analyzing historical Chinese documents, particularly their sparse foreground characteristics and complex layout structures. HisDoc-DETR incorporates three key modules: (1) a semantic relationship learning module based on Transformer architecture that effectively captures long-range dependencies in document layouts, (2) a dual-stream feature fusion module that intelligently combines high-level semantic features with low-level details through channel and spatial coordinate attention mechanisms, and (3) a GIoU-aware prediction head that enhances layout localization accuracy by linking classification confidence with localization quality. Extensive experiments on the SCUT-CAB dataset demonstrate that HisDoc-DETR significantly outperforms existing methods, achieving improvements of 4.1% and 3.2% in AP metrics for logical and physical layout analysis respectively compared to the DINO baseline. The method shows particular strength in handling complex historical document layouts, achieving state-of-the-art performance across most layout categories.","The rapid growth of scientific literature creates a pressing need for tools that can efficiently distill complex research papers into accessible formats. The existing approaches for automated slide generation from papers primarily focuses on textual content, but overlook the critical role of visual elements in scientific communication. We propose Paper2PPT, a novel framework that generates the visual presentation of scientific papers, prioritizing the integration of visual elements and their explanatory contexts through systematic cross-modal alignment. Our approach addresses key challenges in aligning visual elements with their associated text, including robust caption localization, morphology-aware OCR consolidation, and caption-anchored visual-semantic reasoning. By leveraging document structure heuristics and spatial reasoning, the framework establishes precise figure-text relationships without requiring multimodal training data. The experiments show that the proposed method can generate a more accurate and comprehensive visual representation of scientific papers.","Handwritten mathematical expression generation (HMEG) is a challenging task due to the complex structure and significant symbol distortion. In addition, the wide variety of handwriting styles, e.g. , variations in symbol size and slant, aggravates the difficulties of the HMEG. In this paper, we propose a novel Visual-aware Multi-Representation Fusion Network ( VMF-Net ) to tackle the challenging HMEG task. Specifically, we introduce a Multi-Representation Enhanced Generator (MEG) that guides the generation process by various visual attributes, such as high-frequency components and expression prototypes, in conjunction with structural features. Additionally, we design a Progressive Fusion Module (PFM) to capture interactions between visual features, while an Adaptive Filter (AF) suppresses redundant style features. Extensive experiments on widely used benchmark datasets demonstrate that our VMF-Net is an effective HMEG model and outperforms state-of-the-art models remarkably.","Document Key Information Extraction (KIE) is a technology that transforms valuable information in document images into structured data, and it has become an essential function in industrial settings. However, current evaluation metrics of this technology do not accurately reflect the critical attributes of its industrial applications. In this paper, we present KIEval, a novel application-centric evaluation metric for Document KIE models. Unlike prior metrics, KIEval assesses Document KIE models not just on the extraction of individual information (entity) but also of the structured information (grouping). Evaluation of structured information provides assessment of Document KIE models that are more reflective of extracting grouped information from documents in industrial settings. Designed with industrial application in mind, we believe that KIEval can become a standard evaluation metric for developing or applying Document KIE models in practice. Source code of our work is publicly available at: https://github.com/UpstageAI/KIEval .","Manual digitization of bibliographic metadata is time consuming and labor intensive, especially for historical and real-world archives with highly variable formatting across documents. Despite advances in machine learning, the absence of dedicated datasets for metadata extraction hinders automation. To address this gap, we introduce BiblioPage, a dataset of scanned title pages annotated with structured bibliographic metadata. The dataset consists of approximately 2,000 monograph title pages collected from 14 Czech libraries, spanning a wide range of publication periods, typographic styles, and layout structures. Each title page is annotated with 16 bibliographic attributes, including title, contributors, and publication metadata, along with precise positional information in the form of bounding boxes. To extract structured information from this dataset, we evaluated object detection models such as YOLO and DETR combined with transformer-based OCR, achieving a maximum mAP of 52 and an F1 score of 59. Additionally, we assess the performance of various visual large language models, including LlamA 3.2-Vision and GPT-4o, with the best\u00a0model reaching an F1 score of 67. BiblioPage serves as a real-world benchmark for bibliographic metadata extraction, contributing to document understanding, document question answering, and document information extraction. Dataset and evaluation scripts are available at: https://github.com/DCGM/biblio-dataset .","Scene text analysis stands as a cornerstone of computer vision, with logical layout analysis emerging as a pivotal component for decoding the semantic roles of text regions and advancing scene understanding. While previous research has primarily focused on structured documents, scene text poses unique challenges due to its unstructured and visually diverse nature. In this work, we extend logical layout analysis to signboard images, a domain characterized by complex backgrounds, irregular text placements, diverse viewpoints, unique fonts, varying text sizes, and personalized design styles. These challenges make scene text layout analysis a critical yet underexplored research problem with significant real-world implications. To bridge this gap, we introduce a new benchmark dataset comprising 2,025 manually annotated images from diverse urban environments, containing 44,227 text instances across 9 semantic categories commonly found in signboards. Additionally, we evaluate state-of-the-art logical layout analysis methods on this dataset, providing valuable insights into the challenges and opportunities within this domain. The dataset and code are publicly available (GitHub Repository: https://github.com/Yangchann/LLASignboard .), fostering further advancements in scene text understanding","This paper addresses the remote verification of the authenticity of Optically Variable Devices (commonly known as holograms) on identity documents. Typically placed over the cardholder\u2019s photo, these devices provide strong and easily verifiable security for human inspection but pose challenges for automated verification. Existing approaches easily cover static frauds (e.g., paper photocopy) and can be evaluated for such, but their capacity to detect real, dynamic fraud cases (e.g., handcrafted hologram) has not been evaluated to date because of the lack of public datasets. Furthermore, they are usually trained to detect known attack types, and few of them can generalize to new, unseen attacks. This work features three contributions to address these limitations: 1) a new public dataset, MIDV-DynAttack, which extends the existing MIDV-Holo dataset with realistic, static, and dynamic attacks against identity document specimens, tripling the number of attack samples compared to the original dataset, 2) a novel verification method which can assess the authenticity of a specific hologram thanks to the analysis of its dynamic behavior and appearance, can be trained without dynamic attack samples, and exhibits new state-of-the-art performance, 3) a benchmark of existing approaches which follows a clear evaluation protocol and emphasizes the inability of other approaches to deal with dynamic attacks, as well as new challenging attacks to deal with. Code and dataset are publicly available at https://github.com/EPITAResearchLab/pouliquen.25.icdar .","Vast amounts of medieval notarial documents have been preserved and digitized in Catalan archives. These collections provide invaluable insights into life in the Middle Ages. To harness their full potential, documents need to be accurately transcribed. This paper introduces a new dataset for the task of handwritten text recognition on medieval manuscripts, focusing on notarial charters written on parchment from the 13th to 15th centuries. Our dataset is comprised of 100 digitized manuscripts (3,369 lines), carefully selected to represent the large variation that is present in the sources, encompassing at least 80 distinct hands, various document types (from sales and inventories to last wills and marriage contracts), and spanning three centuries. Written primarily in Medieval Latin with fragments in Medieval Catalan, these manuscripts exhibit varying stages of preservation and degrees of deterioration, resulting in a very diverse dataset. Recent years have seen impressive advancements in automatic handwriting recognition of historical manuscripts, with significant effort put into creating general models that perform well across several centuries and scripts. The experiments on our dataset show that these models are still far from providing a generalizable solution, but nevertheless provide a good foundation to fine-tune robust models when used in combination with a carefully curated dataset. We report a series of experiments using an extensive and nuanced evaluation approach that demonstrates the importance of data selection for achieving an accurate transcription of historical manuscripts.","Scene script identification is a pivotal research topic in the field of computer vision, aiming to accurately determine the script or language category of text within complex scene images. However, traditional script identification techniques often fall short in meeting the demands for feature robustness due to challenges such as the multilingual nature of scene text, font diversity, and background complexity. This paper presents a novel scene script identification model using dense hierarchical semantic fusion, which significantly enhances both accuracy and robustness through multi-level feature fusion and semantic enhancement. Specifically, by optimizing a joint loss function, the model employs a densely connected structure to achieve effective aggregation of cross-layer features and incorporates the attention mechanism to strengthen semantic information, thereby more efficiently capturing both global and local features of the text. Experimental results on publicly available datasets demonstrate that the proposed method outperforms existing mainstream approaches in identification performance on certain datasets. This research provides an innovative solution for scene script identification based on the Vision Transformer architecture, highlighting its broad application potential.","Handwritten Mathematical Expression Recognition (HMER) is crucial for enhancing human-machine interaction in domains such as digitized education and automated document processing. While existing transformer-based methods employ coverage mechanisms to capture context, they often still lose critical cues that a human could quickly correct. To address this, we propose Mask CoMER, a two-stage training approach that combines a novel Masked Language Model Pretraining objective with stochastic depth regularization. This method enhances contextual understanding and mitigates information loss, leading to improved recognition accuracy. Experiments on the CROHME 2014, 2016, and 2019 datasets demonstrate that Mask CoMER achieves state-of-the-art ExpRates of 64.56%, 63.03%, and 65.22%, respectively. These results outperform the baseline CoMER by up to 5% and surpass the previous SOTA by nearly 2%. These results underscore the robustness and effectiveness of our approach for HMER tasks\u00a0 $$^{1}$$ 1 .( $$^{1}$$ 1 The code is available at\u00a0 GitHub )","Robust handwritten text recognition (HTR) systems require diverse and abundant annotated data, which can be expensive to acquire. Unlike commonly used methods, such as transfer learning and data augmentation, that reduce the need for labeled data, this article proposes a novel self-supervised handwritten text recognition (HTR) framework to eliminate that need: self-HTR. Self-HTR leverages a high-level loss that informs about the textual dissimilarity between an input image and an image generated with a pretrained generative adversarial network containing the network\u2019s predicted text. Based on preliminary experiments with handwritten character recognition, experiments were conducted on the IAM dataset for word recognition. Self-HTR was implemented by integrating the generative architecture GANwriting with a CNN-BLSTM architecture. Experiments were conducted with two image-based and two style-invariant losses. Trained on IAM images recreated with GANwriting and using transfer learning, self-HTR achieved a character- and word error rate of 0.44% and 1.56% on recreated test data. While on simulated data, these results indicate the potential of self-HTR on real data. Future research is necessary to validate the framework further on real data and use high-quality handwritten text generation models.","Chinese characters are logographic in nature and possess complex compositional structures, making their recognition inherently challenging, particularly in handwritten form. Zero-shot recognition of Chinese characters further exacerbates this challenge. By leveraging the inherent structural properties of Chinese characters, it is possible to extract fine-grained structural information essential for effective recognition. Most current recognition methods rely on hard-coded representations of characters or radicals, overlooking the inherent flexibility and compositional similarity among them. This paper presents a novel radical encoding and information extraction module. The radical encoding module is built upon fine-tuning the CLIP model to learn continuous representations of radicals and their structural relationships. The information extraction module parses the radical sequence into a tree structure and extracts information to generate embeddings. We also evaluate the similarity between image features and embeddings. Our approach can also be used for zero-shot learning recognition tasks demonstrating superior performance compared to existing methods. To the best of our knowledge, this is the first work to fine-tune CLIP for continuous radical encoding while simultaneously integrating radical sequence information for enhanced recognition. Experimental results on zero-shot handwritten Chinese character recognition show that our method outperforms existing approaches, highlighting the effectiveness of the proposed methodology.","As rich sources of history, maps provide crucial insights into historical changes, yet their diverse visual representations and limited annotated data pose significant challenges for automated processing. We propose a simple yet effective approach for few-shot segmentation of historical maps, leveraging the rich semantic embeddings of large vision foundation models combined with parameter-efficient fine-tuning. Our method outperforms the state-of-the-art on the Siegfried benchmark dataset in vineyard and railway segmentation, achieving +5% and +13% relative improvements in mIoU in 10-shot scenarios and around +20% in the more challenging 5-shot setting. Additionally, it demonstrates strong performance on the ICDAR 2021 competition dataset, attaining a mean PQ of 67.3% for building block segmentation, despite not being optimized for this shape-sensitive metric, underscoring its generalizability. Notably, our approach maintains high performance even in extremely low-data regimes (10- &amp; 5-shot), while requiring only 689k trainable parameters \u2013 just 0.21% of the total model size. Our approach enables precise segmentation of diverse historical maps while drastically reducing the need for manual annotations, advancing automated processing and analysis in the field. Our implementation is publicly available at: https://github.com/RafaelSterzinger/few-shot-map-segmentation .","Automatic text recognition for contemporary and historical printed\u00a0or handwritten works has become a crucial tool in the inventory of\u00a0many humanities scholars employing digital methods, but few retrodigitization software packages are adapted to this environment with its unparalleled diversity, domain-specific conventions, and low-resource settings. We examine how the design principles behind kraken, a freely-licensed\u00a0ATR engine optimized for use on historical and non-Latin script documents, pertain to specific use cases encountered in the humanities and allow it\u00a0to be easily adapted to process even highly non-conventional material.\u00a0In addition, we shine a light on the significant functional additions, performance enhancements, and quality of life improvements added in its recent version 5 stable releases. Among these are advanced reading order support including trainable reading order, unsupervised recognition pretraining,\u00a0and a new public model repository with enhanced metadata. The latest release of the software can be found at https://kraken.re","Oracle bone inscriptions, the oldest known Chinese writing system, pose formidable challenges in character recognition and interpretation due to the large number of undeciphered characters and the scarcity of labeled data. In this paper, we introduce OracleGCD, an enhanced framework that adapts Generalized Category Discovery (GCD) to oracle bone inscriptions, which simultaneously handles the recognition of known characters and the discovery and clustering of novel categories. Specifically, OracleGCD uses a stroke-aware asymmetric view augmentation mechanism, which utilizes dual-grained\u00a0(coarse- and fine-grained) augmentations to extract more discriminative features. Coarse-grained augmentation applies data transformations to the entire image while fine-grained one first uses adaptive threshold segmentation to extract salient stroke regions and then applies targeted transformations to these key areas to optimize local feature representation. Furthermore, we propose the confidence-guided collaborative feature learning, which predicts the pseudo-labels of unlabeled samples based on the logit output of the model, enabling the use of unlabeled data in supervised contrastive learning. We also implement a logit adjustment strategy to address the long-tailed class distribution in the dataset. Extensive experiments demonstrate that our framework sets new performance benchmarks for the discovery of oracle bone character. It significantly outperforms strong baselines in both known character recognition and novel category identification and cluster, advancing the automated analysis of oracle bone inscriptions and potentially aiding in deciphering ancient Chinese scripts.","Article separation for historical newspapers is an important task in the analysis of historical documents. But so far, it remains an under-researched area. Since historical newspapers themselves have two modalities, text, and image, this requires multimodal processing for information extraction. To tackle this task while accounting for the unique characteristics of historical newspapers, we propose an article separation model using a multimodal transformer structure. This model processes the newspaper image along with the bounding boxes and text content of its text blocks, linking them based on a predefined rule to reconstruct the overall page structure. The text and image information of the connected text blocks are then fed into a cross-modal transformer, and the classifier determines whether the connections between the text blocks need to be removed or not. The text blocks that remain connected are recognized as forming an article. A mask method is used to allow the image to reflect the positional relationships of the text blocks. We evaluated our architecture on two datasets, Neweye\u2019s NLF and BNF. The results demonstrate that Ar-Q-former significantly outperforms similar structural modeling methods, achieving up to 19% points higher AR $$_{F1}$$ F 1 on NLF and 22% points on BNF. It also reaches a performance level comparable to the reading order simulation method. However, there remains an approximate 10% point gap in mACS mPPA compared to rule-based methods, which are specifically tailored to these datasets. Nevertheless, Ar-Q-former exhibits greater generalizability. Additionally, this approach introduces multimodal text-image analysis and interaction compared to previous studies by innovatively incorporating the mask-image method to capture visual and positional information between text blocks.","Manuscript fragments repurposed in book bindings contain valuable historical text, yet reading these hidden texts presents significant challenges. Multispectral and hyperspectral imaging (MSI and HSI), followed by spectral unmixing, are commonly used to enhance text visibility. However, additional layers of paper make the recovery process particularly difficult. The resulting text images are often blurry and unrecognizable to both human experts and Optical Character Recognition (OCR) systems. Furthermore, the problem is compounded by the lack of sufficient representative data for training deep learning-based restoration models. In this paper, we systematically examine the challenges of recovering readable text images from bookbinding fragments, with a focus on fragments on Herlufsholm 24.1 as a case study. These fragments are part of the Herlufsholm Collection at the University Library of Southern Denmark. We begin with a comparative analysis of MSI and HSI to evaluate their effectiveness in revealing text, highlighting their respective advantages and limitations. To assess the impact of overlaid materials, we conduct a controlled experiment using artificial samples, capturing hyperspectral images of both covered and uncovered text. Additionally, we analyze blur maps to investigate whether the observed blurriness is uniform and whether common models, such as Gaussian blur, adequately represent it. Finally, we explore the effectiveness of existing deblurring models, identifying key limitations, and discussing potential strategies for improving text readability. This study provides a structured analysis of the obstacles at each stage of the process, from imaging to post-processing and deblurring, offering insight into the best practice for recovering text hidden in bindings.","The Manchu archives are historical records formed during the Qing Dynasty in China and hold significant value. Word recognition is crucial for their protection and development. However, the degradation of word images caused by ink infiltration, expansion, discoloration, and stains due to long-term storage makes it difficult for traditional visual model-based word recognition methods to achieve good performance. To address this problem, this paper draws on the visual-language model MATRN proposed in the field of scene image recognition, and overcomes the impact of word image degradation by introducing the visual masking mechanism of VisionLAN and the language masking mechanism of ABINet, thereby constructing a Manchu archives word recognition method based on a visual-language model. The backbone network employs a ResNet architecture combined with attention mechanisms for feature extraction. The visual module generates character-level masked features through the MLM sub-module. Subsequently, the VRM sub-module infers the masked words based on visual context information, thereby enhancing the contextual reasoning ability of the model. The language module conducts masked training through BCN, allowing each character to simultaneously attend to adjacent context information, thereby strengthening the error correction capability of the model. The experimental results show that the method proposed in this paper is superior to traditional methods and can achieve an accuracy of 98.68% on the real Manchu archives dataset.","This paper introduces TamMe, an optimized Thai-English spoken question answering (QA) system designed specifically for robust real-time interactions in open environments under constrained computational resources. Unlike conventional text-based QA systems, TamMe supports natural speech interactions by effectively integrating bilingual automatic speech recognition (ASR), semantic FAQ retrieval, text-to-speech (TTS) synthesis, and multimodal avatar-driven responses. TamMe significantly enhances efficiency and accuracy through innovative techniques, including Faster-Whisper accelerated with pre-ASR language identification, reducing GPU memory usage by approximately 60% while achieving a low word error rate of 5.72% for Thai and 8.54% for English. To address noisy real-world conditions in open environment, TamMe employs spatial-cue preserving speech enhancement and multi-stage adaptive noise suppression, achieving a retrieval Precision@1 of 89.7%. Semantic retrieval performance is optimized via multilingual embedding-based indexing, ensuring accurate responses to paraphrased and multilingual spoken queries. Additionally, speaker-adaptive TTS and precomputed SadTalker-based 3D avatar animations enable visually expressive, synchronized multimodal interactions without compromising real-time responsiveness. Experimental evaluations in a realistic kiosk setup demonstrate that TamMe effectively balances accuracy, computational efficiency, and user engagement.","Logs play a crucial role in modern software development by providing essential runtime information. Automated log analysis begins with log parsing, which transforms unstructured log data into a structured format. In AIOps (Artificial Intelligence for IT Operations), log parsing is a fundamental step that enables downstream tasks such as anomaly detection and root cause analysis. Traditional log parsing methods, including heuristic rules, regular expressions, and statistical approaches, often struggle with unseen log formats, noisy data, and evolving system logs. Meanwhile, deep learning-based methods require model tuning on fixed training log files, limiting their adaptability to diverse log formats in AIOps environments. To address these challenges, we propose XLog, an efficient log parsing framework that integrates two key components: (1) a Search Tree, which efficiently organizes and matches known log templates to reduce redundancy and computational overhead, and (2) an LLM-based Template Extractor, which dynamically identifies new log templates using in-context learning with carefully designed prompts, enabling adaptation to previously unseen log formats. This hybrid approach ensures both efficiency and flexibility in log parsing. We evaluated XLog on 16 widely used public datasets, and experimental results demonstrate that our framework achieves superior log parsing accuracy (98% average parsing accuracy).","Key Information Extraction (KIE) from documents is a crucial task in many applications, but the creation of training datasets for KIE models is traditionally a time-consuming and expensive manual process. In this paper we introduce a novel Framework DocAnnot that significantly accelerates and reduces the cost of KIE dataset generation. Our framework leverages a Large Vision Language Model (LVLM) for label value extraction, Optical Character Recognition (OCR) for text and bounding box detection, and a novel Spatially Informed Contextual Matching (SICM) algorithm to accurately associate extracted values with their corresponding labels. SICM enhances label-value association by incorporating spatial relationships and proximity analysis alongside textual matching. We evaluate our framework on two benchmark KIE datasets, CORD and SROIE, demonstrating its ability to automatically generate annotations with reasonable accuracy (achieving F1-scores of 0.679 and 0.846). Furthermore, we investigate the effectiveness of using the auto-annotated data for fine-tuning downstream KIE models. While models trained on human-annotated data achieve superior performance, our experiments show that models trained exclusively on auto-annotated data still attain respectable performance levels (e.g., LayoutLMv3 achieving an F1-score of 0.6765 on CORD). These results demonstrate that while our framework significantly reduces reliance on manual annotation, it does not yet fully eliminate the need for human intervention. However, by automating the annotation process to a point where human reviewers can efficiently verify and refine the outputs, our system enables near-perfect annotations with far greater efficiency than manual annotation from scratch. This approach offers substantial time and cost savings while optimizing the balance between automation and accuracy, making it particularly valuable for resource-constrained settings and rapid model prototyping.","Optical Character Recognition (OCR) for Indian languages is challenging due to diverse scripts, complex characters, and varied writing styles. This work presents HindiOCR-VLM , a Vision-Language Model adapted for Hindi OCR using Low-Rank Adaptation (LoRA) on a model pre-trained for Chinese and English. We explore two adaptation strategies: (i) a single-stage model that directly predicts text at the page level\u2014bypassing intermediate word or line detection\u2014focused on printed documents, and (ii) a two-stage model for multi-domain scenarios (printed, handwritten, and scene text), which first detects words and then recognizes them individually. Inspired by human learning processes, we propose a progressive learning approach\u2014a training strategy to the single-stage model to enhance language acquisition and accelerate convergence. Leveraging the vision encoder\u2019s rich representations, our method enables effective multi-domain training. Experimental results and ablation studies show that HindiOCR-VLM handles the complexities of the Devanagari script well and outperforms domain-specific models, offering a unified and robust solution for Hindi OCR. Code and resources are available at:\u00a0 https://hindiocr-vlm.github.io/ .","Text samples captured in natural scenes often come from different scripts written in various directions, resulting in significant diversities in character set, orientation, and text length. Current methods handle such diversities by routing input images to corresponding (sub)modules with hardwired rules that are usually tied to image aspect-ratio ranges. However, setting hardwired rules requires extensive knowledge of the testing data and model-building experience, hence is often suboptimal. To resolve this, we propose an end-to-end trainable watch-and-act (WnA) framework, which first watches thumbnails to generate a routing plan and then routes the samples to corresponding experts to produce the recognition results. The framework shows a significant robustness improvement over the corresponding rule-based baselines by 2% of line accuracy on the recent multi-orientation open-set text recognition benchmark. The proposed framework, as a system, also shows 3\u201310% line accuracy advantages over previous open-set text recognition methods on horizontal samples.","Medical document analysis plays a crucial role in extracting essential clinical insights from unstructured healthcare records, supporting critical tasks such as differential diagnosis. Determining the most probable condition among overlapping symptoms requires precise evaluation and deep medical expertise. While recent advancements in large language models (LLMs) have significantly enhanced performance in medical document analysis, privacy concerns related to sensitive patient data limit the use of online LLMs services in clinical settings. To address these challenges, we propose a trustworthy medical document analysis platform that fine-tunes a LLaMA-v3 using low-rank adaptation, specifically optimized for differential diagnosis tasks. Our approach utilizes DDXPlus, the largest benchmark dataset for differential diagnosis, and demonstrates superior performance in pathology prediction and variable-length differential diagnosis compared to existing methods. The developed web-based platform allows users to submit their own unstructured medical documents and receive accurate, explainable diagnostic results. By incorporating advanced explainability techniques, the system ensures transparent and reliable predictions, fostering user trust and confidence. Extensive evaluations confirm that the proposed method surpasses current state-of-the-art models in predictive accuracy while offering practical utility in clinical settings. This work addresses the urgent need for reliable, explainable, and privacy-preserving artificial intelligence solutions, representing a significant advancement in intelligent medical document analysis for real-world healthcare applications. The code can be found at https://github.com/leitro/Differential-Diagnosis-LoRA .","Short video platforms have rapidly emerged as a primary source of news consumption, offering engaging and easily digestible content. However, their widespread popularity has also facilitated the proliferation of fake news, posing a significant societal concern and exacerbating the challenge of misinformation control. Unlike traditional text-based news, fake news on short video platforms often spreads through a combination of textual, visual, and auditory elements, making detection particularly complex. Existing methods leveraging multimodal features struggle to capture deep semantic associations and lack effective fusion mechanisms, resulting in limited cross-modal interactions and suboptimal feature representation. Furthermore, simple feature concatenation or linear weighting may fail to fully exploit the complementary information across modalities. To address these challenges, we propose DAFSVFND, a novel multimodal fusion network that incorporates a stacked text-guided dual attention mechanism to facilitate deep interaction and fusion among textual, visual, and auditory features. By strengthening cross-modal dependencies and refining feature representations, our approach enhances the model\u2019s ability to distinguish between real and fake news. Extensive experiments on two large-scale fake news datasets demonstrate that our model significantly outperforms state-of-the-art methods, offering an effective solution for fake news detection on short video platforms.","Document intelligence is a multimodal challenge, requiring both textual content and visual layout cues for accurate interpretation. Traditional text-based models often struggle to capture spatial and structural information, which is essential for document understanding tasks. While decoder-only language models (e.g. GPT-4, LLaMA) excel at text-based reasoning, they often overlook layout dependencies, limiting their effectiveness in tasks like Document Visual Question Answering (DocVQA) and Key Information Extraction (KIE), where text is arranged non-linearly. To address this, we introduce G-LLaMA , which integrates Gaussian biases into the attention mechanism of decoder-only models to enhance spatial reasoning. Unlike prior work that applied spatial biases to encoder-based architectures, our approach conditions LLaMA\u2019s attention on spatial structure, improving layout awareness without requiring additional architectural modifications. Experimental results demonstrate that Gaussian biases significantly increase performance, yielding substantial improvements in both DocVQA and KIE tasks. These findings underscore the importance of explicit spatial conditioning in LLMs for understanding structured documents.","Imagine sitting in a presentation, trying to follow the speaker while simultaneously scanning the slides for relevant information. While the entire slide is visible, identifying the relevant regions can be challenging. As you focus on one part of the slide, the speaker moves on to a new sentence, leaving you scrambling to catch up visually. This constant back-and-forth creates a disconnect between what\u2019s being said and the most important visual elements, making it hard to absorb key details\u2014especially in fast-paced or content-heavy presentations, as in a conference talk. This will require an understanding of slides, especially text, graphics, and layout. We introduce a method that automatically identifies and highlights the most relevant slide regions based on the speaker\u2019s narrative. By analyzing spoken content and matching it with textual or graphical elements in the slides, our approach ensures better synchronization between what you hear and what you need to attend to. We explore different ways of solving this problem and assess their success and failure cases. Analyzing multimedia documents is emerging as a key requirement for seamless understanding of content-rich videos, such as educational videos and conference talks, by reducing cognitive strain and improving comprehension. Code and dataset available at: https://github.com/meghamariamkm2002/Slide_Highlight .","Numerical reasoning in financial document analysis constitutes a fundamental challenge for corporate financial report understanding, drawing increasing attention in both academia and industry. However, current approaches suffer from semantic misalignment in multi-hierarchical tables, reasoning disruptions from insufficient integration of financial metric formulas, and sensitivity of the model\u2019s reasoning results to the order of evidence. To address these challenges, we propose a unified framework for knowledge-intensive numerical reasoning over financial documents. Within this framework, we introduce a Triplets-based Multi-Stage Tabular-Textual Hybrid Evidence Retrieval (THER) method to resolve semantic misalignment by converting multi-hierarchical tables into triplet representations. Furthermore, we propose the Fine Grained Knowledge Injected Chain-of-Thought (FGKI-CoT) method to enhance numerical reasoning by explicitly integrating financial conceptual formulas into the reasoning path. Building on FGKI-CoT, we introduce the Evidence Order Sampling based Self-Consistency (EOSC) method, which mitigates the model\u2019s sensitivity to evidence order by altering the input evidence sequence. Experiments demonstrate that our framework enables a 1.5B-parameter language model to outperform GPT-3.5-turbo by 3.95% in numerical reasoning on the Multihiertt Dev dataset. Additionally, we conduct supplementary experiments to further explore the impact of table representations and reasoning step expressions on the numerical reasoning performance of language models.","This paper proposes a novel deep learning-based multi-task approach designed to handle Sanskrit compound word splitting, a problem that poses significant challenges due to the complicated morphology of the language. The model is trained to jointly solve two closely related tasks: character-level segmentation location prediction and segmented word generation using a sequence-to-sequence model. The proposed architecture consists of two branches and relies on a shared character-level embedding layer combined with bidirectional LSTMs to effectively capture character-level contextual variations. Furthermore, each branch leverages the Multi-Head Attention mechanism, and experiments show that this mechanism improves character-level segmentation location prediction and guides the decoder when generating segmented words. Differently than state-of-the-art approaches, adopting cascaded models for solving independently the two tasks, in the proposed unified model, the decoder is initialized with a composite state that combines the encoder context with the location features computed by the segmentation branch, allowing the two tasks to support each other and leading to improvements in the overall model accuracy. Experiments on a challenging Sanskrit compound dataset show that the proposed model outperforms traditional methods, achieving a location prediction accuracy of $$93.51\\%$$ 93.51 % and a splitting accuracy of $$87.92\\%$$ 87.92 % , respectively. The experiments further show that joint modeling of the two tasks not only advances the state-of-the-art performance in splitting Sanskrit compounds, but also offers a richer understanding of the splitting process, paving the way for strengthening morphological analysis in natural language processing and digital humanities for the in-depth study of complex religious texts.","In scenarios where direct access to displayed content, such as secured web pages or confidential documents, is restricted, eye-tracking data can serve as a side channel for information inference. Represented as human attention maps, eye tracking data is widely used in research, for example, to quantify how users explore visual information. In this work, we specifically focus on visual question-answering (VQA) scenarios to demonstrate, for the first time, that a rich amount of information can be leaked solely from human attention maps. Hence, we assume that an adversary only has access to the gaze attention maps and aims to derive a range of attributes about the image (e.g. the chart type), the question (e.g. question type), and the answer (e.g. the accuracy-based complexity). This information leakage could be the first step towards potentially more complex insights about human perception and cognition. Our experiments demonstrate that deriving attributes is feasible, and simultaneously predicting multiple attributes improves the success rate for attributes that are difficult to infer. This paper highlights potential threats, encouraging the community to address these concerns and develop appropriate privacy-preserving solutions.","As deep learning-based, data-driven information extraction systems become increasingly integrated into modern document processing workflows, one primary concern is the risk of malicious leakage of sensitive private data from these systems. While some recent works have explored Differential Privacy (DP) to mitigate these privacy risks, DP-based training is known to cause significant performance degradation and impose several limitations on standard training procedures, making its direct application to downstream tasks both difficult and costly. In this work, we aim to address the above challenges within the context of document image classification by substituting real private data with a synthetic counterpart. In particular, we propose to use conditional latent diffusion models (LDMs) in combination with differential privacy (DP) to generate class-specific synthetic document images under strict privacy constraints, which can then be utilized to train a downstream classifier following standard training procedures. We investigate our approach under various pretraining setups, including unconditional, class-conditional, and layout-conditional pretraining, in combination with multiple private training strategies such as class-conditional and per-label private fine-tuning with DPDM and DP-Promise algorithms. Additionally, we evaluate it on two well-known document benchmark datasets, RVL-CDIP and Tobacco3482, and show that it can generate useful and realistic document samples across various document types and privacy levels ( $$\\varepsilon \\in \\{1, 5, 10\\}$$ \u03b5 \u2208 { 1 , 5 , 10 } ). Lastly, we show that our approach achieves substantial performance improvements in downstream evaluations on small-scale datasets, compared to the direct application of DP-Adam. To the best of the authors\u2019 knowledge, this is the first work to explore differentially private document generation via latent diffusion for document analysis. The source code for this work has been made publicly available at: https://github.com/saifullah3396/dpdocldm.git .","Since OpenAI\u2019s 2016 Request for Research on Image to LaTeX , printed mathematical expression recognition has advanced significantly, with newer techniques like Vision Transformers further enhancing accuracy. However, evaluations often remain limited to a small set of datasets and primarily focus on LaTeX string similarity, neglecting semantic and visual aspects. To perform a broader evaluation, we benchmarked five models representative of the evolution of Vision Transformers across eight datasets over multiple modalities. Our proposed multimodal evaluation pipeline, PiE-MER, converts predicted LaTeX into MathML, Label Graphs, and normalized images. This range of representations allows us to compute additional metrics that better capture models\u2019 syntactic, semantic, and visual accuracy. Correlation analysis revealed that BLEU and Levenshtein alone are insufficient for complete evaluations. We propose complementary metrics, including image-based Levenshtein, MathML-based scores, and graph evaluation. The MathNet model achieved the highest average performance across the datasets, with a 87% LaTeX edit score, thanks to its Convolutional Vision Transformers and multi-font training dataset. Our pipeline and benchmark can offer a clearer and more robust evaluation of future recognition systems. A GitHub repository containing the proposed evaluation pipeline is available at https://github.com/fwieckowiak/PiE-MER , enabling future authors to evaluate their own models and datasets.","The automated reconstruction of the logical arrangement of tables from image data, termed Table Structure Recognition (TSR), is fundamental for semantic data extraction. Recently, researchers have explored a wide range of techniques to tackle this problem, demonstrating significant progress. Each table is a set of vertical and horizontal separators. Following this realization, we present SepFormer, which integrates the split-and-merge paradigm into a single step through separator regression with a DETR-style architecture, improving speed and robustness. SepFormer is a coarse-to-fine approach that predicts table separators from single-line to line-strip separators with a stack of two transformer decoders. In the coarse-grained stage, the model learns to gradually refine single-line segments through decoder layers with additional angle loss. At the end of the fine-grained stage, the model predicts line-strip separators by refining sampled points from each single-line segment. Our SepFormer can run on average at 25.6 FPS while achieving comparable performance with state-of-the-art methods on several benchmark datasets, including SciTSR, PubTabNet, WTW, and iFLYTAB.","Effective license plate recognition systems are required to be resilient to constant change, as new license plates are released into traffic daily. While Transformer-based networks excel in their recognition at first sight, we observe significant performance drop over time which proves them unsuitable for tense production environments. Indeed, such systems obtain state-of-the-art results on plates whose syntax is seen during training. Yet, we show they perform similarly to random guessing on future plates where legible characters are wrongly recognized due to a shift in their syntax. After highlighting the flows of positional and contextual information in Transformer encoder-decoders, we identify several causes for their over-reliance on past syntax. Following, we devise architectural cut-offs and replacements which we integrate into SaLT, an attempt at a Syntax-Less Transformer for syntax-agnostic modeling of license plate representations. Experiments on both real and synthetic datasets show that our approach reaches top accuracy on past syntax and most importantly nearly maintains performance on future license plates. We further demonstrate the robustness of our architecture enhancements by way of various ablations.","While Connectionist Temporal Classification (CTC) has become a prevalent sequence learning framework in Scene Text Recognition (STR), its characteristic spiky distribution outputs introduce critical alignment challenges. This inherent limitation often leads to suboptimal text recognition performance. To address this issue, current methods predominantly adopt two paradigms: architectural modifications, often involving auxiliary network components, and advanced loss function design. However, these techniques fail to fully capitalize on the fundamental properties of text. In contrast, this paper presents a novel approach, PerturbCTC, that aims to explore the intrinsic feature consistency within foreground text. First, we systematically analyze the characteristics of foreground text to uncover underlying feature invariance patterns. Building on these insights, we propose an innovative feature perturbation strategy that harnesses the property of texts to enhance model perception. Additionally, we introduce the Distribution Alignment Module (DAM), which addresses the challenges of implicit alignment learning in the CTC framework. Our method is model-agnostic and can be generalized to both English and Chinese scene text benchmarks. Remarkably, our approach achieves accuracy improvements of 1.3% on the Common benchmark and 3.9% on the Union14M benchmark, outperforming existing methods without increasing model parameters, and setting new state-of-the-art results.","With the advancement of industrial automation and intelligent technology, detecting text in industrial design drawings has become critical for improving efficiency in industrial pipelines. These drawings present unique challenges, including intricate backgrounds, linear interference, and diverse text styles, such as curved, inclined, and irregular shapes. While segmentation-based methods have demonstrated potential in detecting arbitrarily shaped text, existing approaches often suffer from inaccuracies and limited robustness when applied to industrial design drawings. To address these limitations, this paper proposes a novel text detection algorithm that employs multi-dimensional feature fusion to enhance feature extraction and robustness. By integrating this strategy into a segmentation-based model, the proposed method effectively handles the complexities of text detection in industrial scenarios. Experimental results on industrial design drawing datasets demonstrate significant improvements in detection accuracy and robustness compared to state-of-the-art methods, making the algorithm well-suited for practical industrial applications.","The recognition of oracle characters is meaningful for exploring ancient Chinese culture. Due to the poor quality of scanned oracle characters, recognition is a difficult task. Although many works try to improve the recognition performance, they overlook the important fact that oracle characters are hieroglyphic. In this paper, we utilize this fact by ProtoPNet to improve the capability of recognizing oracle characters. In particular, we propose OracleProtoPNet, which mimics the human expert\u2019s recognition of oracle characters. Our OracleProtoPNet recognizes the oracle characters by comparing the similarity between input images and learned prototypes. To further improve recognition accuracy, we combine our model with two modules. Specifically, we introduce a multi-scale channel attention module to reduce noise interference. Additionally, we aggregate the activation value scores to avoid classification interference. Even if one patch has high similarity to a prototype of a certain class, the differences in other patches will separate them into different categories. To compare multiple prototypical networks and unsupervised domain adaptation networks, we conduct extensive experiments on the Oracle-241 dataset. The experimental results demonstrate that our network achieves SOTA accuracy on the scanned data while maintaining interpretability.","We introduce Rosetta , a multimodal model that leverages Multimodal In-Context Learning (MICL) to classify sequences of novel script patterns in documents by leveraging minimal examples, thus eliminating the need for explicit retraining. To enhance contextual learning, we designed a dataset generation process that ensures varying degrees of contextual informativeness, improving the model\u2019s adaptability in leveraging context across different scenarios. A key strength of our method is the use of a Context-Aware Tokenizer (CAT), which enables open-vocabulary classification. This allows the model to classify text and symbol patterns across an unlimited range of classes, extending its classification capabilities beyond the scope of its training alphabet of patterns. As a result, it unlocks applications such as the recognition of new alphabets and languages. Experiments on synthetic datasets demonstrate the potential of Rosetta to successfully classify Out-Of-Distribution visual patterns and diverse sets of alphabets and scripts, including but not limited to Chinese, Greek, Russian, French, Spanish, and Japanese. (The code from this study will soon be accessible as open-source on the GitHub repository: https://github.com/TSResearch-hub/Rosetta-ICL-classif","Current OCR systems are based on deep learning models trained on large amounts of data. Although they have shown some ability to generalize to unseen data, especially in detection tasks, they can struggle with recognizing low-quality data. This is particularly evident for printed documents, where intra-domain data variability is typically low, but inter-domain data variability is high. In that context, current OCR methods do not fully exploit each document\u2019s redundancy. We propose an unsupervised method by leveraging the redundancy of character shapes within a document to correct imperfect outputs of a given OCR system and suggest better clustering. To this aim, we introduce an extended Gaussian Mixture Model (GMM) by alternating an Expectation-Maximization (EM) algorithm with an intra-cluster realignment process and normality statistical testing. We demonstrate improvements in documents with various levels of degradation, including recovered Uruguayan military archives and 17th to mid-20th century European newspapers.","The increasing impact of global change on coastal areas necessitates effective collaboration among stakeholders to develop sound environmental protection policies. However, the vast number of scientific publications and the interdisciplinary nature of the field make it challenging to accurately identify and extract relevant information. Current methods for analyzing coastal region literature are limited in handling complex document-level relations, impeding the development of comprehensive Knowledge Bases (KBs) essential for informed decision-making. Therefore, we introduce CoastRED, a corpus of 416 scientific abstracts focused on coastal regions, designed for interdisciplinary end-to-end Document-level Relation Extraction (DocRE), leveraging the ARDI framework (Actors, Resources, Dynamics, and Interactions) to automatically identify key entities and their roles in coastal systems. We present DUNJERE\u2014an end-to-end model integrating Mention Detection, Coreference Resolution, Entity Typing, and Relation Extraction. Based on a U-Net architecture, DUNJERE approaches Relation Extraction as a semantic segmentation task, enhancing its performance in an end-to-end setting. Evaluations on the DocRED and ReDocRED datasets demonstrate state-of-the-art performance, while experiments on CoastRED highlight its potential to advance coastal system research by providing a robust tool for document analysis and KB construction. Code and dataset are available on this repository: https://github.com/jdelaunay/coastred .","This paper presents a two-stage automatic scoring approach for handwritten answers in Japanese, English, and mathematics, targeting elementary and junior high school students. A dataset of handwritten answers from more than 480 students was collected on electronic paper devices and manually graded by teachers (human score). In addition, these answers were scored automatically in two stages: first through handwriting recognition and then through scoring, eliminating the need for teacher intervention. State-of-the-art deep neural network models, corresponding to each answer type, were used for the handwriting recognition stage. Subsequently, the proposed scoring models assign a score (machine score) for each answer based on recognition outcomes. The machine scores were then compared with the corresponding human scores to evaluate the performance. The experiment results show that, on average, approximately 80% of the answers were successfully scored automatically. Consequently, the average human scoring rates were approximately 15% for Japanese, 10% for English, and 17% for mathematics. This means that with automatic scoring less than 20% of the answers require human evaluation, compared to a scenario where all answers are scored manually. The analysis further reveals an average risky scoring rate of 2% (when the machine score is higher than the human score). While this rate should be further reduced, human scoring also exhibits a similar level of variance. These findings underscore the efficacy of the proposed automatic scoring approach in alleviating the teachers\u2019 grading burden.","Adversarial attack methods involve making small but strategically crafted modifications to an image to mislead the model\u2019s automatic classifier. Many existing adversarial attack methods introduce unnatural alterations\u00a0[ 15 , 29 ], if such a patch is included in a document, this may make the document look suspicious. In contrast, this paper investigates a more natural and inconspicuous approach using stamp-like adversarial patches that resemble real-world document elements while effectively disrupting classification accuracy. To systematically evaluate the effectiveness of these adversarial stamps, we conduct extensive experiments on the RVL-CDIP dataset, a widely used benchmark for document classification. We analyze the impact of various patch attributes, including color, size, shape, and most importantly, position, on the attack success rate. Our study highlights that placement plays a crucial role in maximizing the attack\u2019s effectiveness, as different locations on the document lead to classifier degradation. To optimize both the adversarial patch and its position, we introduce an iterative training pipeline that dynamically optimizes the most disruptive locations in a document. Our results show that stamp-like adversarial patches can effectively attack document classifiers, revealing their vulnerabilities. Well-placed stamps further degrade classification accuracy, highlighting the impact of positional optimization. These findings emphasize the importance of position-aware adversarial attacks and provide insights for optimizing their design. We will make our code publicly available upon acceptance.","The goal of document tampering localization (DTL) is to segment regions containing tampering traces and ensure the authenticity of document images. Existing DTL methods mainly rely on low-level visual features to capture fine-grained tampering traces. However, these methods fail to consider textual semantics, resulting in dispersed attention across the structured document images and difficulty in focusing on high-risk text regions. To address this, we propose DocAI-TL, a novel DTL method that combines a tampering-prior-guided Document Artificial Intelligence (DocAI) model with a Segmentation Foundation Model (SFM). Specifically, the DocAI model integrates textual semantics and layout to predict tampering probability of the text, which guides SFM to focus on tampering features in high-risk text regions via a Probability Guided Attention (PGA) module. To evaluate the performance of our method, we construct a large-scale structured document forgery dataset, named SDFD, which contains 25,080 document images with diverse texture backgrounds and various document types. In addition, we propose a GPT-assisted data annotation method to fine-tune the DocAI model for more accurate tampering probability predictions. Experimental results demonstrate that the DTL performance of our method significantly outperforms that of the existing methods. The data and code of this work is available at https://github.com/lyj/DocAI-TL .","Document image forgeries, especially text manipulations in scanned documents, pose severe risks to information integrity, impacting domains such as legal, financial, and personal records. These alterations are often subtle, localized, and visually indistinguishable, especially under common compression standards like JPEG. Existing detection methods typically rely on single-model architectures, either convolutional neural networks (CNNs) or transformers, which independently struggle with effectively capturing both local artifacts and global structural inconsistencies. To overcome these limitations, we propose DocForgeNet, a novel dual cross-stream fusion network explicitly designed for robust detection and localization of forged text regions in document images. DocForgeNet simultaneously processes RGB and discrete cosine transform (DCT) features through parallel CNN and transformer streams. The CNN stream excels at identifying local inconsistencies, such as compression artifacts and font irregularities, while the transformer stream leverages self-attention mechanisms to model broader, contextual discrepancies indicative of large-scale manipulations. Cross-linear attention modules facilitate effective feature fusion between the streams without information loss. Extensive evaluations on the DocTamper dataset, which contains forgeries on 170,000 document images of various types, demonstrate that DocForgeNet significantly outperforms state-of-the-art methods, achieving superior precision, recall, and F1-scores across various testing scenarios, including severe JPEG compression. Our approach not only establishes a new benchmark in tampering detection performance but also highlights the effectiveness of integrating complementary local and global representations for enhanced document integrity verification.","Scientific illustrations contribute to a deeper understanding of the core content of papers. Many of the scientific illustrations are complex flowcharts consisting of multiple subregions. Each subregion corresponds to a meaningful module or processing stage, which are visually coherent regions with uniform background colors or distinct boundaries. However, segmenting subregions and aligning them with corresponding text descriptions has been overlooked. We propose a self-prompted segmentation of scientific illustrations (SSSI) framework, which automatically utilizes the geometric relationships between text and subregions to generate point and bounding box prompts suitable for SAM. SSSI employs a two-stage processing pipeline. In the first stage, SAM-based pre-segmentation generates bounding boxes that are aligned with text bounding boxes to produce box prompt regions, during which Optical Character Recognition (OCR) is utilized to identify the text bounding boxes and eliminate visual interference caused by text. In the second stage, we propose a dynamic point sampling algorithm that dynamically samples points as prompts and iteratively refines masks of subregions, achieving high-quality subregion extraction. Experimental results show that our framework achieves an average precision (mAP) of 68.0, with an AP@50 of 78.1.","Digitalization of historical document images relies heavily on historical text detection techniques. However, historical document images often feature complex layouts, dense text, and varying degrees of damage caused by time and environmental factors, which present challenges for traditional text detection methods, particularly in terms of ink fading and document aging. To address these issues, we propose a novel historical character-level text detector, termed E-FCOS, based on an enhanced Fully Convolutional One Stage (FCOS) object detection model. The E-FCOS detector incorporates a Fast Fourier Transform Denoising (FFTD) layer and an Adaptive Multi-scale Fusion (AMSF) module into the FCOS object detection model. In particular, the FFTD layer employs the fast Fourier transform to filter out high-frequency background noise and utilizes a Transformer to establish contextual dependencies, thereby enhancing the character structure information. The AMSF module employs bidirectional adaptive fusion to capture multi-scale information, which improves the detection performance of dense text. Our detector achieves state-of-the-art results on three datasets: MTHv2, Kuzushiji, and Nancho, especially achieving F-measure of 97.75% in the MTHv2 datasets. Additional generalization experiments on the competition dataset further confirm the potential applicability of this detector.","Document images often exhibit significant geometric distortions due to folds, curls, and non-ideal camera angles, compromising the readability and downstream text-processing performance. In this paper, we propose DocPINN , a novel single-image document dewarping framework that leverages Physics-Informed Neural Networks (PINNs) to solve a second-order partial differential equation (PDE) controlling the warp. Unlike existing methods that directly regress a dense deformation field, DocPINN infers local PDE forcing terms from image features via a convolutional network, while enforcing boundary conditions and textline constraints in a globally consistent PINN solver. This setup ensures smoother transformations in severely warped regions without sacrificing local fidelity. We conduct experiments on the DocUNet benchmark and real scanned images, demonstrating that DocPINN achieves lower character error rates (CER) and improved structural similarity (MS-SSIM) compared to state-of-the-art methods like DewarpNet. Our ablation studies confirm that the combination of learned PDE forcing, text alignment, and boundary regularization is critical for effectively resolving both large-scale perspective distortions and intricate local folds.","Recent advancements in large multimodal language models have significantly enhanced cross-modal understanding by effectively aligning vision and language. However, due to the high resolution, dense text, and complex layouts of document images, these methods still face challenges in Visual Document Understanding (VDU), primarily due to their limited ability to capture fine-grained information and relationships. To address these challenges, we propose a novel adaptive resolution selection framework. This framework consists of two key components: (1) a Resolution-Slicing Selector, which captures document information density and performs adaptive patch slicing through resolution selection, and (2) a multi-stage training strategy with mixed preference optimization. The latter leverages preference pairs to guide the selector, assigning high-resolution representations to regions with dense information and small font sizes while applying lower-resolution representations to areas with redundant information. This method captures fine-grained visual representations while maintaining modeling efficiency. With these components, SelectVision achieves significant improvements in both efficiency and performance. Our experiments demonstrate that SelectVision delivers promising results across a wide range of evaluation datasets, including ChartQA (84.3%), WTQ (59.2%), and TabFact (83.9%).","Handwritten mathematical expression generation (HMEG) aims to synthesize handwritten samples with specific mathematical content, which has a wide range of applications and thus has important research value. However, current studies on HMEG are confronted with two bottlenecks: 1) dominant models are constructed in adversarial learning, which tends to suffer from the error propagation of recognition. 2) these models require diverse inputs, increasing both cost and complexity in practical applications. In this work, we propose a novel Spatial-Aware Feature Refinement Diffusion ( SFRD ) combined with a content prototype representation to address the challenging HMEG task. Specifically, we employ two structurally shared encoders to extract handwritten patterns and content features. The extracted patterns are then processed through the designed Spatially-Aware Feature Refinement Module (SAFRM), which refines the understanding of spatial information in the handwritten style using spatial attention and feature refinement. In SFRD , cross-attention is applied to capture the entanglement between the two feature types, guiding the diffusion generation process. Extensive experiments and in-depth analyses on widely used benchmark datasets clearly demonstrate the effectiveness of our proposed model. Our code is publicly available at:\u00a0 https://github.com/Fyzjym/SFRD_Part .","Writer recognition involves analyzing handwritten documents with respect to the identity of the writer. Although automated methods can achieve strong benchmark results, their lack of interpretability limits practical adoption, particularly in settings where trust and verifiability are critical. To address this challenge, we propose a novel framework grounded in character-level analysis. At its core is Vectors of Locally Aggregated Characters (VLAC), a feature aggregation method that fuses the aligned outputs of a feature extractor and a feature annotator network. By aggregating local features on a per-character basis, VLAC provides the backbone for computing verifiable character-wise distances, thereby enhancing interpretability and trustworthiness. We extensively evaluate the proposed framework on two contemporary datasets (CVL and IAM) \u2013 achieving new state-of-the-art retrieval results on CVL \u2013 as well as a historical dataset (Hist-WI). Our method does not only perform well, but also facilitates interpretable insights into the decision process, paving the way for broader acceptance in practical and forensic applications.","Document understanding and analysis have received a lot of attention due to their widespread application. However, existing document analysis solutions, such as document layout analysis and key information extraction, are only suitable for fixed category definitions and granularities, and cannot achieve flexible applications customized by users. Therefore, this paper defines a new task named \u201cClass-Agnostic Region-of-Interest Matching\u201d (\u201cRoI-Matching\u201d for short), which aims to match the customized regions in a flexible, efficient, multi-granularity, and open-set manner. The visual prompt of the reference document and target document images are fed into our model, while the output is the corresponding bounding boxes in the target document images. To meet the above requirements, we construct a benchmark RoI-Matching-Bench, which sets three levels of difficulties following real-world conditions, and propose the macro and micro metrics to evaluate. Furthermore, we also propose a new framework RoI-Matcher, which employs a siamese network to extract multi-level features both in the reference and target domains,\u00a0and cross-attention layers to integrate and align similar semantics in different domains. Experiments show that our method with a simple procedure is effective on RoI-Matching-Bench, and serves as the baseline for further research. The code is available at https://github.com/pd162/RoI-Matching .","Recent advanceme
