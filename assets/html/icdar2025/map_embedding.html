 its effectiveness in recent years for its time reparametrization invariance. However, its practical application is limited by inherent challenges, such as the curse of dimensionality. Thanks to Path Development and its trainable variant Path Development layer (Dev), which retain the virtue in Path Signature while overcoming its limitations, we structurally weave Path Dev elopment in to Online Sig nature Verification and propose DevInSight (with extra \u2018ht\u2019 for legibility). Our approach incorporates several modifications for the hierarchically stacked Dev, including Windowing Strategy, Grouping Strategy and Absolute-Information-Augmentation. Additionally, Local Focus Module (LFM) and Global Fusion Module (GFM) are designed and integrated into the model to improve feature extraction and expand perceptual scope. For verification decision making, we utilize a Dynamic Time Warping (DTW) based verifier. Experiments on two large-scale online signature datasets in different languages show that DevInSight outperforms existing methods on MSDS-ChS (Chinese), especially in challenging scenarios like single-template and cross-session verification, and achieves competitive results on DeepSignDB (Latin). Furthermore, we extend DevInSight to online digital string verification, showcasing its promising generalization capability for other handwritten content. The code will be made publicly available.","In real Offline Handwritten Signature Verification (OHSV) scenarios, skilled forged signatures are extremely rare and cannot be accessed during model training and verification stages. Therefore, the difference between genuine signatures and skilled forgeries is hard to capture in this scenario. In this paper, a forged signature generation method named SigLDiff based on latent diffusion models is proposed to address the challenge that skilled forgery cannot be accessed in OHSV tasks. SigLDiff constructs a forged signature generation approach with fine-grained variations by disentangling the content features of genuine signatures from the style characteristics of other genuine signatures. Specifically, the proposed method initially employs the multiscale content aggregation module to integrate the global and local stroke feature of genuine signatures, which effectively enhances the detailed information of signature strokes at different scales. Moreover, to capture style features of signatures, a cross-scale style representation module is proposed to extract handwriting style features at various abstraction levels via a pre-trained VGG network. As a result, style transfer of genuine signatures is implemented in the latent space, enabling generated samples to preserve the content features of the target user while exhibiting diverse forgery styles. Extensive experimental results on five public datasets demonstrate that verification models trained with our generated samples defeat models without authentic skilled forgeries.","In this paper, we approach the problem of minimizing the global Equal Error Rate (EER) in a Writer-Independent (WI) Online Signature Verification (OSV) system by decomposing it into two components: the separation error and the alignment error. The separation error arises from the lack of a correct separation between genuine and forged signatures, while the alignment error arises from the inability of a single global threshold to effectively capture the writer-specific separations. To this, we propose HoLoSig, a novel framework that integrates two popular deep signature representations via a shared 1D convolutional backbone that bifurcates into two specialized branches. On one branch, we employ Triplet Loss with Soft-DTW to learn variable-length local representations whose dissimilarity scores are shifted to a common region with the help of the Maximum Mean Discrepancy (MMD) to improve the system\u2019s performance when using a global threshold. On the other branch, we employ Poly-1 Cross Entropy Loss to learn fixed-length holistic representations that are used to further boost the separation created by the local representation branch. HoLoSig achieves state-of-the-art results on DeepSignDB, the largest OSV dataset to date, against skilled and random forgeries in the stylus scenario, with EERs of 1.73% (4vs1 skilled), 3.29% (1vs1 skilled), 0.43% (4vs1 random) and 0.89% (1vs1 random). The source code is available at https://github.com/DYosplay/HoLoSig .","The increasing demand for data privacy has spurred interest in generative models for simulating tabular data. However, the diverse data types and column distributions in tabular datasets present substantial challenges in developing efficient and expressive generative models. Existing approaches focus on learning joint distributions and statistics to generate distribution-consistent synthetic tables but often fail to capture global feature interactions and adapt to the requirements of downstream tasks. Moreover, current methods exhibit sensitivity to the ordering of input data during training, which leads to suboptimal performance. In this paper, we introduce HyperTab, a novel generative model based on hypergraph modeling and adversarial training. HyperTab leverages hypergraphs to capture the permutation invariance inherent in tabular data. By utilizing a hypergraph encoder, it explicitly models the interaction relationships between features, ensuring that the synthesized data accurately reflects global dependencies. Additionally, HyperTab adopts a multi-objective optimization strategy, simultaneously minimizing adversarial loss to ensure data authenticity, logical consistency loss to maintain the rationality of feature relationships, and task-specific losses, including mean squared error for regression tasks and cross-entropy for classification tasks. Extensive evaluations across multiple benchmark datasets demonstrate that HyperTab significantly outperforms existing methods in terms of generation quality.","Radical-based approaches for Chinese character recognition (CCR) have been extensively investigated and demonstrated substantial improvements. Chinese characters are generally decomposed into structural components and radicals, with recognition being accomplished through the accurate identification of these elements. However, the inherent complexity and diversity of Chinese radicals, combined with variations in writing styles, introduce ambiguities, potentially leading to suboptimal model performance. Such challenges are particularly evident when distinguishing radicals with visually similar characteristics. To address these limitations, this paper proposes a novel Adaptive Radical Similarity Measurement (ARSM) module, which enhances the robustness and generalization of CCR models by dynamically measuring the similarity between radical pairs and integrating this information with radical features. ARSM enables more robust feature integration and facilitates the development of a specialized loss function tailored for optimizing model parameters, thereby improving recognition accuracy. Comprehensive experiments conducted on multiple benchmark datasets demonstrate the effectiveness and robustness of the proposed method.","Engineering diagrams (EDs) provide a rich source of information and play a critical role across various industries. However, the inherent complexity of EDs complicates automatic analysis and processing. These diagrams often contain 100 to 200 visually similar symbols, leading to challenges such as inter-class similarity, overlapping symbols, and substantial background noise. Although recent deep learning-based architectures have shown promising performance in recognising these symbols, these models are heavy and computationally expensive, restricting their use for deployment on resource-constrained devices. Thus, we propose a lightweight knowledge distillation framework for EDs. The framework integrates feature-based and output-level distillation, enabling a lightweight student model to learn from a more complex teacher model. Feature-based distillation is enhanced through Channel-Wise Distillation (CWD) loss, improving spatial and contextual representation, and reducing computational complexity. The output-level distillation employs Kullback-Leibler (KL) divergence to closely align the student model predictions with the teacher\u2019s probability distributions. Extensive experiments on private and public datasets demonstrate that our approach achieves a 6.9% improvement in mean average precision (mAP), reduces model size by 74.5% and decreases computational cost by 82.7%. The proposed method offers significant potential for real-time industrial applications on edge devices and sets the foundation for further advancements in ED analysis.","Document Image Machine Translation (DIMT) seeks to translate text embedded in document images from one language to another by jointly modeling both textual content and page layout\u2014bridging optical character recognition (OCR) and natural language processing (NLP). The DIMT 2025 Challenge advances research on end-to-end document image translation, a rapidly evolving area within multimodal document understanding. The competition features two tracks\u2014OCR-free and OCR-based\u2014each with two subtasks for small ( $$\\le $$ \u2264 1B parameters) and large (&gt; 1B parameters) models. Participants submit a single unified DIMT system, with the option to incorporate provided OCR transcripts. Running from December 10, 2024 to April 20, 2025, the competition attracted 69 teams and 27 valid submissions in total. Track 1 had 34 teams and 13 valid submissions, while Track 2 had 35 teams and 14 valid submissions. In this report, we present the challenge motivation, dataset construction, task definitions, evaluation protocol, and a summary of results. Our analysis shows that large-model approaches establish a promising new paradigm for translating complex-layout document images and highlight substantial opportunities for future research.","The integration and application of Multimodal Large Language Models (MLLMs) in the education sector offers significant potential for automating tasks such as exam grading and personalized learning. However, current MLLMs are predominantly trained on English text and simplified document formats, which limits their performance on complex, non-English documents like exam papers. Key challenges in understanding exam papers include accurate text extraction, maintaining the correct reading order, and ensuring logical coherence across multiple pages. Addressing these issues is critical for the practical deployment of MLLMs in educational applications. To advance research in this area, we organized the ICDAR 2025 Competition on Understanding Chinese College Entrance Exam Papers. This competition introduced the CEP-7K dataset, consisting of 7,000 question-answer pairs and their corresponding exam paper images, to assess MLLMs\u2019 abilities in tackling these challenges. Held from December 10, 2024, to April 18, 2025, the competition received six valid submissions. Compared to the benchmark model Qwen2.5-VL-32B-Instruct, the participating teams have achieved up to a 42% improvement in accuracy. This report provides an overview of the dataset, task design, and evaluation metrics. It also presents the evaluation results and highlights key insights and advancements gained from the competition.","This report describes the ICDAR 2025 Competition on Automatic Classification of Literary Epochs (ICDAR 2025 CoLiE), which consisted of two tasks focused on automatic prediction of the time in which a book was written (date of first publication). Both tasks comprised two sub-tasks, where a related fine-grained classification was addressed. Task 1 consisted of the identification of literary epochs, such as Romanticism or Modernism (sub-task 1.1), and a more precise classification of the period within the epoch (sub-task 1.2). Task 2 addressed the chronological identification of century (sub-task 2.1) or decade (sub-task 2.2). The compiled dataset and the reported findings are valuable to the scientific community and contribute to advancing research in the automatic dating of texts and its applications in digital humanities and temporal text analysis.","This report presents the results of the inaugural ICDAR 2025 Handwritten Notes Understanding Competition, centered on evidence-based question answering over complex scientific handwritten notes. The final competition test set included over 2,000 real academic note images and 1,000 curated questions across diverse STEM domains, characterized by varied layouts, diagrams, and dense equations. The overall challenge was structured as a single task with a multi-phase evaluation protocol designed to assess not only answer correctness but also grounded reasoning ability , requiring models to localize the exact visual evidence supporting their answers. Hosted on the Robust Reading Challenge (RRC) Portal, the competition ensured fair, private-set benchmarking, with 6 valid submissions out of 16 registered teams. The results underscore the obstacles that current state-of-the-art (SOTA) vision-language models (VLMs) face in multimodal reasoning over handwritten content. This first edition marks a promising step toward interpretable, layout-aware document understanding and sets the foundation for future iterations.","Historical maps are valuable for history, social sciences, and linguistics but pose challenges for automatic transcription. This competition edition continues to address detection, recognition, and linking of text in historical maps, with new features: expanded French Land Registers data, a new Taiwanese dataset with Chinese characters, synthetic training data, and improved linking evaluation metrics. Seven teams participated with over 25 submissions across four tasks and three datasets. While detection performance is strong, recognition and linking remain difficult, though improvements were seen with B\u00e9zier curve line fitting and enhanced linking pipelines. All resources are publicly available on Zenodo ( https://zenodo.org/communities/icdar-maptext ).","Text line segmentation is a critical step in handwritten document image analysis. Segmenting text lines in historical handwritten documents, however, presents unique challenges due to irregular handwriting, faded ink, and complex layouts with overlapping lines and non-linear text flow. Furthermore, the scarcity of large annotated datasets renders fully supervised learning approaches impractical for such materials. To address these challenges, we introduce the Few-Shot Text Line Segmentation of Ancient Handwritten Documents (FEST) Competition. Participants are tasked with developing systems capable of segmenting text lines in U-DIADS-TL dataset, using only three annotated images per manuscript for training. The competition dataset features a diverse collection of ancient manuscripts exhibiting a wide range of layouts, degradation levels, and non-standard formatting, closely reflecting real-world conditions. By emphasizing few-shot learning, FEST competition aims to promote the development of robust and adaptable methods that can be employed by humanities scholars with minimal manual annotation effort, thus fostering broader adoption of automated document analysis tools in historical research."]],["abstract_short",["Document Layout Analysis\u2026","Document layout analysis is\u2026","Information extraction from\u2026","End-to-end visual information\u2026","Handwritten Mathematical\u2026","While encoder-decoder\u2026","Handwritten Text Recognition\u2026","Handwritten text generation\u2026","Current methods for\u2026","Automatic font generation\u2026","Lecture slide element\u2026","We introduce InfoDesignLM, a\u2026","Academic documents stored in\u2026","Despite the remarkable\u2026","Table detection recognizes\u2026","Recognizing textual\u2026","Handwritten signatures remain\u ring","ColorGPT: Leveraging Large Language Models for Multimodal Color Recommendation","GAMeta-Prompt: A Generative Adversarial Prompt-Based Meta-language Reasoning Enhancement Method","Entity-Dependency Memory-Enhanced Document-Level Relation Extraction","A Learning-Based Method for Automatically Determining Application Sequence of Intersecting Ink Lines Using Photometric Stereo","TST: Tree Structured Transformer for Handwritten Mathematical Expression Recognition","TABLET: Table Structure Recognition Using Encoder-only Transformers","QUEST: Quality-Aware Semi-supervised Table Extraction for Business Documents","Skeleton-Guided Artistic Text Recognition","Inverse Scene Text Removal","Towards Scene Text Recognition in Rainy Weather Conditions","WildKhmerST: A Comprehensive Dataset and Benchmark for Khmer Scene Text Detection and Recognition in the Wild","TextSAM-LoRA: Efficient Fine-Tuning of Segment Anything Model for Text Detection with Low-Rank Adaptation","Fusing Text Semantics for Text Image Inpainting","DevInSight: Weaving Path Development Into Online Signature Verification","SigLDiff: A Signature Based Latent Diffusion Model for Forged-Free Offline Signature Verification","HoLoSig: Holistic and Local Representation Learning for Online Signature Verification","Hypergraph-Driven Tabular Data Synthesis with Multi-objective Optimization","Adaptive Radical Similarity Learning for Chinese Character Recognition","KD-LSRED : Knowledge Distillation for Lightweight Symbol Recognition in Engineering Diagrams","ICDAR 2025 Competition on End-to-End Document Image Machine Translation Towards Complex Layouts","ICDAR 2025 Competition on Understanding Chinese College Entrance Exam Papers","ICDAR 2025 Competition on Automatic Classification of Literary Epochs","ICDAR 2025 Handwritten Notes Understanding Challenge","ICDAR 2025 Competition on Historical Map Text Detection, Recognition, and Linking","ICDAR 2025 Competition on FEw-Shot Text Line Segmentation of Ancient Handwritten Documents (FEST)"]],["abstract",["Document Layout Analysis (DLA) is a fundamental task in document understanding. However, existing DLA and adaptation methods often require access to large-scale source data and target labels. This requirements severely limiting their real-world applicability, particularly in privacy-sensitive and resource-constrained domains, such as financial statements, medical records, and proprietary business documents. According to our observation, directly transferring source-domain fine-tuned models on target domains often results in a significant performance drop (Avg. $${-}32.64\\%$$ - 32.64 % ). In this work, we introduce Source-Free Document Layout Analysis (SFDLA) , aiming for adapting a pre-trained source DLA models to an unlabeled target domain, without access to any source data. To address this challenge, we establish the first SFDLA benchmark, covering three major DLA datasets for geometric- and content-aware adaptation. Furthermore, we propose Document Layout Analysis Adapter (DLAdapter) , a novel framework that is designed to improve source-free adaptation across document domains. Our method achieves a $${+}4.21\\%$$ + 4.21 % improvement over the source-only baseline and a $${+}2.26\\%$$ + 2.26 % gain over existing source-free methods from PubLayNet to DocLayNet. We believe this work will inspire the DLA community to further investigate source-free document understanding. To support future research of the community, the benchmark, models, and code will be publicly available at https://github.com/s3setewe/sfdla-DLAdapter .","Document layout analysis is essential for downstream tasks such as information retrieval, extraction, OCR, and digitization. However, existing large-scale datasets like PubLayNet and DocBank lack fine-grained region labels and multilingual diversity, making them insufficient for representing complex document layouts. Human-annotated datasets such as $$M^{6}Doc$$ M 6 D o c \u00a0and $$\\text {D}^{4}\\text {LA}$$ D 4 LA \u00a0offer richer labels and greater domain diversity, but are too small to train robust models and lack adequate multilingual coverage. This gap is especially pronounced for Indic documents, which encompass diverse scripts yet remain underrepresented in current datasets, further limiting progress in this space. To address these shortcomings, we introduce IndicDLP , a large-scale foundational document layout dataset spanning 11 representative Indic languages alongside English and 12 common document domains. Additionally, we curate UED-mini , a dataset derived from DocLayNet and $$M^{6}Doc$$ M 6 D o c , to enhance pretraining and provide a solid foundation for Indic layout models. Our experiments demonstrate that fine-tuning existing English models on IndicDLP \u00a0significantly boosts performance, validating its effectiveness. Moreover, models trained on IndicDLP \u00a0generalize well beyond Indic layouts, making it a valuable resource for document digitization. This work bridges gaps in scale, diversity, and annotation granularity, driving inclusive and efficient document understanding.","Information extraction from documents has become increasingly popular due to the rise of large language models (LLMs) and re-augmented generation (RAG) models. Document Layout Analysis (DLA) is a fundamental task in document AI, playing a crucial role in identifying semantically related elements within a document\u2014a key step toward effective information extraction. Modern document layout analysis algorithms benefit from large-scale annotated datasets but suffer significant performance drops when tested across different datasets, limiting the generalization of models trained on a single source. To address this, we utilize a multi-dataset training approach for a Universal Layout Detection (UniLayDet) model utilizing a shared detection architecture with dataset-specific outputs and unifying the label space post-training through an automatic merging process. UniLayDet significantly improves generalization across datasets compared to models trained individually and also achieves competitive in-domain performance, notably attaining a mAP (@IoU[0.5\u20130.95]) of 68.9% on M $$^6$$ 6 Doc (partitioned setting), close to the existing SOTA of 69.9%, showing that our model is simple yet effective for the task. Code and models are available at github.com/Mobius1D/UniLayDet .","End-to-end visual information extraction (VIE) aims at integrating the hierarchical subtasks of VIE, including text spotting, word grouping, and entity labeling, into a unified framework. Dealing with the gaps among the three subtasks plays a pivotal role in designing an effective VIE model. OCR-dependent methods heavily rely on offline OCR engines and inevitably suffer from OCR errors, while OCR-free methods, particularly those employing a black-box model, might produce outputs that lack interpretability or contain hallucinated content. Inspired by CenterNet, DeepSolo, and ESP, we propose HIP, which models entities as HI erarchical P oints to better conform to the hierarchical nature of the end-to-end VIE task. Specifically, such hierarchical points can be flexibly encoded and subsequently decoded into desired text transcripts, centers of various regions, and categories of entities. Furthermore, we devise corresponding hierarchical pre-training strategies, categorized as image reconstruction, layout learning, and language enhancement, to reinforce the cross-modality representation of the hierarchical encoders. Quantitative experiments on public benchmarks demonstrate that HIP outperforms previous state-of-the-art methods, while qualitative results show its excellent interpretability.","Handwritten Mathematical Expression Recognition (HMER) is foundational for educational technologies, enabling applications like digital note-taking and automated grading. While modern encoder-decoder architectures with large language models excel at LaTeX generation, they lack explicit symbol-to-trace alignment \u2013 a critical limitation for error analysis, interpretability, and spatially aware interactive applications requiring selective content updates. This paper introduces a structural recognition approach with two innovations: (1) an automatic annotation system that uses a neural network to map LaTeX equations to raw traces, automatically generating annotations for symbol segmentation, classification, and spatial relations, and (2) a modular structural recognition system that independently optimizes segmentation, classification, and relation prediction. By leveraging a dataset enriched with structural annotations from our auto-labeling system, the proposed recognition system combines graph-based trace sorting, a hybrid convolutional-recurrent network, and transformer-based correction to achieve competitive performance on the CROHME-2023 benchmark. Crucially, our structural recognition system generates a complete graph structure that directly links handwritten traces to predicted symbols, enabling transparent error analysis and interpretable outputs. Our results challenge the perception that structural methods are outdated, demonstrating their viability when supported by high-quality annotated data. To promote reproducibility and future research, we release the annotated CROHME+ and MathWriting+ datasets, providing data for advancing interpretable HMER systems.","While encoder-decoder architectures have significantly advanced Handwritten Mathematical Expression Recognition (HMER), current language model (LM)-based correction methods face inherent limitations. Although LM can mitigate contextual errors by leveraging textual semantics, their effectiveness is ultimately hindered by the semantic-poverty problem: mathematical expressions convey complex structural relationships that go beyond linguistic representation alone. In this paper, we argue that visual features, such as the spatial relationships between symbols, should be given equal importance alongside linguistic information when correcting HMER system outputs. We introduce the Position-Aware Cross-Modality correction framework, which creates a visual-linguistic equivalence for error rectification. Specifically, we propose a Dual-Stream Fusion Module to integrate symbol-level visual features with linguistic context in parallel, enabling joint visual-linguistic reasoning to address ambiguities caused by segmentation errors and symbol misinterpretations. Additionally, we introduce the Position-Aware Module, which applies dynamic spatial attention driven by symbol density heatmaps, allowing for adaptive focus on both global layout and local symbol interactions. Experiments on two widely used benchmark datasets validate the superiority of our method, achieving state-of-the-art performance of 62.32% / 61.58 % / 63.38% on CROHME 2014 / 2016 / 2019 and 70.81% on HME100K.","Handwritten Text Recognition (HTR) remains a challenging task, particularly for child handwriting, which often exhibits irregular letter formation, letter crowding, mirrored letters, and phonological spelling errors. The presence of these characteristics is rare in adult handwriting, which forms the primary training data for most existing HTR systems and multimodal large language models (MLLMs). Consequently, current models often autocorrect or misinterpret these features, limiting their effectiveness in contexts where accurate handwritten text recognition is crucial. This is particularly problematic for identifying specific learning disabilities (SLDs) like dyslexia and dysgraphia, where features such as letter reversals, inversions, and spelling mistakes are key diagnostic indicators. To address this gap, we introduce Extended-TrOCR (E-TrOCR), an adaptation of the transformer-based optical character recognition (TrOCR) model specifically designed for child handwriting. E-TrOCR uses a two-stage training process, starting with the IAM dataset for general handwriting recognition, followed by fine-tuning on a dedicated child handwriting dataset. The model employs character-level tokenization to prevent autocorrection and introduces a novel 220-alphabet to represent letter reversals and inversions. Trained on over 1,800 text lines from elementary school students, E-TrOCR significantly outperforms state-of-the-art HTR models, underscoring the necessity of dedicated solutions for child handwriting recognition.","Handwritten text generation (HTG) aims to imitate specific writers to synthesize handwritten text images, which has a wide range of applications and thus has significant research value. However, current studies on HTG face a central bottleneck. Dominant models, built utilizing generative adversarial networks (GANs), constantly struggle with error conditioning from the style classifier due to long-tailed distributions. The issue results in samples generated by mainstream HTG methods lacking diversity. In this work, we propose a plug-and-play method, namely Dynamic Category Compression (DCC), to enhance the recognition ability of the style classifier and provide potent constraints for the generator. Specifically, DCC improves the distinction of tail class samples by adaptively increasing the density of backbone features. We apply DCC to state-of-the-art methods and previous prominent works, then evaluate them on widely used handwriting datasets. Extensive experiments fully demonstrate the effectiveness and generality of our method. Our code is publicly available at:\u00a0 https://github.com/Fyzjym/DCC .","Current methods for handwritten Chinese text generation primarily focus on generating individual characters. However, for practical applications, users often require a handwritten text-line generation model to streamline their workflows. Generating stylized handwritten text-line necessitates capturing both character-level styles (e.g., stroke thickness, ink color, and cursive join) and text-line-level styles (e.g., inter-character spacing and text-line inclination). To address this challenge, we propose a novel cascaded diffusion architecture (i.e., Layout-Diff and Imitating-Diff) to disentangle these two levels of styles via customized template guidance. Specifically, Layout-Diff assists in synthesizing a template image, where the visual archetypes, rendered in a printed font, are well-arranged on a blank canvas. Subsequently, Imitating-Diff transforms this synthesized template into a stylized handwritten text-line image. We propose a latent aggregation module to efficiently incorporate textual guidance into Imitating-Diff while reducing computational cost. Furthermore, we design a high-frequency weighted loss for fine-tuning Imitating-Diff in the pixel space to preserve structure details with clarity. Extensive experiments demonstrate that our method effectively mimics diverse handwriting styles while ensuring structural accuracy in generated text lines.","Automatic font generation aims to synthesize glyph images in a target font style using only a limited number of reference images. Current methods typically adopt a content-style disentanglement strategy by employing two separate networks to extract content and style features. However, such approaches may be affected by the imperfect disentanglement and neglect critical style transformation patterns between source and target fonts. To address these limitations, we propose FSTDiff, a novel framework that explicitly learns cross-font style transformations. In our approach, we introduce a Font Style Transformation (FST) module that explicitly captures the style transformation from the source font to the target font, thereby alleviating the issue of residual source font style information in the content features. This module leverages learnable queries to automatically extract both global and local style details and convert them into a style transformation representation. Extensive experiments demonstrate that FSTDiff achieves state-of-the-art performance across various characters and font types.","Lecture slide element detection and retrieval are key problems in slide understanding. Training effective models for these tasks often depends on extensive manual annotation. However, annotating large volumes of lecture slides for supervised training is labor intensive and requires domain expertise. To address this, we propose a large language model (LLM)-guided synthetic lecture slide generation pipeline, SynLecSlideGen, which produces high-quality, coherent and realistic slides. We also create an evaluation benchmark, namely RealSlide by manually annotating 1,050 real lecture slides. To assess the utility of our synthetic slides, we perform few-shot transfer learning on real data using models pre-trained on them. Experimental results show that few-shot transfer learning with pretraining on synthetic slides significantly improves performance compared to training only on real data. This demonstrates that synthetic data can effectively compensate for limited labeled lecture slides. The code and resources of our work are publicly available on our project website:\u00a0 https://synslidegen.github.io/","We introduce InfoDesignLM, a model that enables interactive infographic layout design using only textual descriptions, mimicking the creative process of a human designer. In contrast to traditional methods that depend on multimodal vision models, our approach leverages large language models (LLMs) to complete both layout planning and generation tasks through text alone. To facilitate this, we developed a semantically-driven dataset, InfoLap, which helps the LLM establish an accurate mapping between text semantics and layout design. Despite eliminating the need for vision encoders, our method outperforms state-of-the-art multimodal models like GPT-4o in a series of experiments. This advancement not only highlights the potential of LLMs in cross-modal understanding and the generation of 2D layouts but also paves the way for new automated design applications in the Visual Rich Document (VRD) domain.","Academic documents stored in PDF format can be transformed into plain text structured markup languages to enhance accessibility and enable scalable digital library workflows. Markup languages allow for easier updates and customization, making academic content more adaptable and accessible to diverse usage, such as linguistic corpus compilation. Such documents, typically delivered in PDF format, contain complex elements including mathematical formulas, figures, headers, and tables, as well as densely layouted text. Existing end-to-end decoder transformer models can transform screenshots of documents into markup language. However, these models exhibit significant inefficiencies; their token-by-token decoding from scratch wastes a lot of inference steps in regenerating dense text that could be directly copied from PDF files. To solve this problem, we introduce EditTrans, a hybrid editing-generation model whose features allow identifying a queue of to-be-edited text from a PDF before starting to generate markup language. EditTrans contains a lightweight classifier fine-tuned from a Document Layout Analysis model on 162,127 pages of documents from arXiv. In our evaluations, EditTrans reduced the transformation latency up to 44.5% compared to end-to-end decoder transformer models, while maintaining transformation quality. Our code and reproducible dataset production scripts are open-sourced.","Despite the remarkable progress made by large language models (LLMs) in natural language understanding, they still struggle to effectively comprehend visually-rich documents (VRDs) that demand complex semantic analysis. This paper introduces HiDReader, the first reinforcement learning-based framework designed to emulate human-like reading processes for visually-rich document comprehension. By integrating LLMs with specialized document understanding models, HiDReader leverages a self-optimizing, data-driven reading sequence mechanism that mimics human learning patterns rather than relying on traditional rule-based or fixed parsing strategies. Through iterative self-supervised learning, HiDReader dynamically adapts its reading path based on contextual cues and task-specific goals, refining its approach in a way that mirrors the adaptability of human cognition. Experimental results on two benchmark tasks demonstrate that HiDReader outperforms baseline methods in both document information extraction and question answering. Moreover, in cross-domain transfer learning scenarios, it showcases significant adaptability, autonomously extracting characteristic reading patterns from VRDs, thereby achieving superior performance in zero-shot domain adaptation tasks compared to conventional approaches.","Table detection recognizes and accurately determines the position of tables within document images. This task involves both classification and precise localization of these table elements. Conventional table detection methods usually depend on extensive labeled data, creating a challenge in generating high-quality labels for training. To address this, many semi-supervised approaches are proposed. These methods utilize either CNN-based networks, which rely on anchor generation and NMS (Non-Maximum Suppression), or employ transformer-based models with performance linked to the quality of object queries. In this paper, we propose a transformer-based semi-supervised approach that improves the quality of object queries. We take high-level query features from unlabeled images and find similarities with decoder original queries by an enhanced query selection network. It provides high-quality, refined queries, allowing the model to make precise predictions or classifications with minimal labeled data. Results on benchmarks such as Publaynet, DocBank, PubTables, and ICDAR 19 have demonstrated that this innovative approach significantly outperforms traditional supervised and semi-supervised methods. On just 1% label data, our approach obtains 98.1% mAP, 96.4% mAP, and 82.8% mAP on PubTables, PubLayNet, and DocBank datasets, respectively. The state-of-the-art results show the effectiveness of our approach.","Recognizing textual attributes such as bold , italic , underline , and The image shows the word \"strikeout\" with a horizontal line through the middle, indicating text that has been struck through. is essential for understanding text semantics, structure, and visual presentation. These attributes highlight key information, making them crucial for document analysis. Existing methods struggle with computational efficiency or adaptability in noisy, multilingual settings. To address this, we introduce TexTAR , a multi-task, context-aware Transformer for Textual Attribute Recognition (TAR). Our novel data selection pipeline enhances context awareness, and our architecture employs a 2D RoPE (Rotary Positional Embedding)-style mechanism to incorporate input context for more accurate attribute predictions. We also introduce MMTAD , a diverse, multilingual, multi-domain dataset annotated with text attributes across real-world documents such as legal records, notices, and textbooks. Extensive evaluations show TexTAR outperforms existing methods, demonstrating that contextual awareness contributes to state-of-the-art TAR performance.","Handwritten signatures remain a primary method for identity verification due to their accessibility and non-intrusiveness. Despite advances in deep learning and computer vision, signature recognition still faces challenges, particularly in handling small-sample training and high intra-class variability. To address these issues, we propose the first audio-visual multimodal framework for handwritten signature recognition. Our model, MSSSRNet, integrates a residual module-based two-path fusion network and an attentional feature fusion (AFF) module. By employing a cross-modal audio-visual fusion strategy, the network captures both global and local features from signature images and pen stroke audio, learning their interactions through an attention mechanism. To the best of our knowledge, this is the first application of audio-visual multimodal representation in handwritten signature recognition. To support this research, we introduce a novel dataset comprising 2,000 real samples from 100 individuals, the first publicly available dataset to include both signature images and pen stroke audio signals. Experimental evaluations on our dataset and two widely used public benchmarks demonstrate the effectiveness of our approach, consistently outperforming state-of-the-art unimodal methods. Our findings highlight the biological significance of pen stroke audio in signature verification. The dataset is available at https://github.com/helloGit12345/MSSSR .","Personality trait identification from social media data has many applications in health monitoring, education, candidate screening, and business. Personality trait identification using text and images published on Social media (Twitter) is challenging due to unpredictable text and the background in the personality trait images. Unlike the existing studies that use multimodal (image and text) for the classification of personality traits images, this study fuses the text of emotions, text in the personality traits image, and image information. We believe that there is a strong correlation between emotion and personality traits. This observation motivated us to combine the textual features of emotional images, text in personality traits images, and image features. The above observations are captured through transformer encoders and multiple convolutional layers, followed by max-pool layers. Before feeding to transformers, our method extracts text in the personality trait images, resulting in text regions and non-text regions separately. Then, the proposed model obtains captions for the emotion and personality trait images. To integrate the strengths of the features extracted from emotion and personality text and images, the proposed work introduces a bilinear fusion approach, which fuses features and modalities. The experiments are conducted on different standard datasets of personality trait images to demonstrate the effectiveness of classification. A comparative study with state-of-the-art methods shows that our method is superior to existing methods. Experiments are also conducted on different races and genders to validate bias and fairness.","Large multimodal models (LMMs) have made impressive strides in image captioning, VQA, and video comprehension, yet they still struggle with the intricate temporal and spatial cues found in comics. To address this gap, we introduce ComicsPAP , a large-scale benchmark designed for comic strip understanding. Comprising over 100k samples and organized into 5 subtasks under a Pick-a-Panel framework, ComicsPAP demands models to identify the missing panel in a sequence. Our evaluations, conducted under both multi-image and single-image protocols, reveal that current state-of-the-art LMMs perform near chance on these tasks, underscoring significant limitations in capturing sequential and contextual dependencies. To close the gap, we adapted LMMs for comic strip understanding, obtaining better results on ComicsPAP than 10x bigger models, demonstrating that ComicsPAP offers a robust resource to drive future research in multimodal comic comprehension.","Image-text extraction is a critical research area in computer vision, with broad applications in document digitization and scene understanding. Traditional methods typically rely on specialized models designed for specific subtasks, which limits their generalizability across diverse scenarios. Recent progress in vision-language models has demonstrated significant potential for cross-scene text-related tasks. However, existing approaches often fail to adequately capture semantic features in text-related images and rely on rigid processing strategies, which struggle to adapt to the varying demands of textual scenes. To overcome these limitations, we introduce Text Large Language and Vision Assistant (T-LLaVA), an advanced vision-language model specifically optimized for text recognition. Specifically, we propose an effective activation mechanism that leverages text saliency and completeness to optimize processing routes, and a dynamic image slicing strategy that adapts to the spatial characteristics of input images. Extensive experiments show that T-LLaVA achieves competitive recognition accuracy across diverse scenarios, including natural scene text, cropped text, mathematical expressions, and document pages. These results validate the effectiveness and superiority of our proposed approach, highlighting its potential for robust and versatile text extraction in complex environments.","The surge in social media discussions has increased the need for automated summarization to save time and manage content overload. However, existing summarization datasets are not suitable for this purpose, as they either do not cover discussions, multiple modalities, or both. To end this, we present MMRSUM , a comprehensive multimodal discussion summarization dataset boasting 7,130 meticulously curated threads. Given the diversity of languages in India, with more than 1 billion people, Hinglish is crucial for facilitating communication across linguistic groups, reflecting cultural integration, and enhancing professional and educational environments. Additionally, we present HMMRSUM , an innovative multimodal codemixed discussion summarization dataset with 7,130 threads in Hinglish. Each thread within these datasets encompasses a solicitation post enriched with both textual\u00a0and visual elements, facilitating a holistic understanding. Subsequent comments further augment comprehension by integrating textual and visual components. To refine the summarization process, we propose an innovative approach employing R elevant- C luster-based M ulti-stage S ummarization (RCMS). Our model demonstrates strong performance on both English and codemixed multimodal datasets. It not only surpasses existing benchmarks by a notable margin of $$\\approx 6\\%$$ \u2248 6 % but also sets a new standard for future research endeavors. The detailed dataset samples are available at https://github.com/M-Groot7/MMRSUM-HMMRSUM.git","Charge prediction is an important task in intelligent legal reasoning, aiming to automatically identify potential criminal activities from case descriptions. Existing methods often fail to capture the complex relationships in legal texts because they rely on simple feature modeling. In this paper we propose a new charge prediction method named Semantic Syntactic Fusion and Legal Constituent Elements Matching (SemSyn-LCE). It improves prediction accuracy by combining syntax and semantics features and extracting LCEs. To capturing cross-sentence dependencies which exhibit crucial contextual relationships, this method introduces a novel multi-hop syntactic dependency trees. It also identifies potential matching sentences for LCEs which contribute the most to charge prediction. Experimental results show that SemSyn-LCE outperforms existing methods, achieving higher prediction accuracy.","Topic modeling is a technique used to identify and organize topic domains in document collections. Therefore, topic models are extensively used in expert finding by considering domain (expertise) as a topic or a\u00a0list of topics. Most of the existing topic models, for expert/expertise finding, make use of different versions of Latent Dirichlet Allocation (LDA) to acquire coherent domains. However, in the process\u00a0of obtaining domains with higher coherence, LDA fails in discovering latent relationships among those domains. In this work, we present our model that combines LDA with Sentence-BERT (S-BERT), further refining the domains with clustering. More specifically, we propose fuzzy clustering using Fuzzy C-means in order to discover latent relationships among the domains. Furthermore, we add temporal information into our model to analyze the relationship between domain word semantics and temporal factor. We compare our model with baselines using the COVID-19 Open Research Dataset (CORD-19) and 20Newsgroups dataset. Through experiments, we demonstrate that our fuzzy topic model outperforms baseline models on both datasets.","Business documents often contain substantial tabular and textual information with numerical values, requiring mathematical reasoning for effective document understanding. While Small Language Models (SLMs) still struggle at this task, tool-augmented multi-step agents perform better, at the cost of relying on closed-source or larger models, external data, or extensive prompt-engineering. This work introduces MATATA, a novel weakly supervised end-to-end approach to train multi-step reasoning language agents for document tabular applications. MATATA presents an annotation-free paradigm for each agent to enhance 3.8B/8B SLMs. During its two-stage training, MATATA uses the final outcome of the multi-step reasoning chain as weak supervision. This approach avoids having to individually supervise each intermediate agent in the reasoning chain. By employing an adaptive planner and shared tools across different datasets, MATATA shows robust performance. Experiments demonstrate that MATATA achieves state-of-the-art on FinQA, and on TAT-QA among reasoning methods based on open-source SLMs. Although being SLM-based, MATATA closely matches GPT-4-based frameworks on TabMWP. This novel weakly supervised approach enables training an end-to-end multi-step reasoning agent without intermediate supervision, supporting future developments of cost-effective powerful agentic systems.","Historical maps offer an invaluable perspective into territory evolution across past centuries\u2014long before satellite or remote sensing technologies existed. Deep learning methods have shown promising results in segmenting historical maps, but publicly available datasets typically focus on a single map type or period, require extensive and costly annotations, and are not suited for nationwide, long-term analyses. In this paper, we introduce a new dataset of historical maps tailored for analyzing large-scale, long-term land use and land cover evolution with limited annotations. Spanning metropolitan France (548,305\u00a0km^2), our dataset contains three map collections from the $${18}^\\text {th}$$ 18 th , $${19}^\\text {th}$$ 19 th , and $${20}^\\text {th}$$ 20 th centuries. We provide both comprehensive modern labels and 22,878\u00a0km^2 of manually annotated historical labels for the $${18}^\\text {th}$$ 18 th and $${19}^\\text {th}$$ 19 th century maps. Our dataset illustrates the complexity of the segmentation task, featuring stylistic inconsistencies, interpretive ambiguities, and significant landscape changes (e.g., marshlands disappearing in favor of forests). We assess the difficulty of these challenges by benchmarking three approaches: a fully-supervised model trained with historical labels, and two weakly-supervised models that rely only on modern annotations. The latter either use the modern labels directly or first perform image-to-image translation to address the stylistic gap between historical and contemporary maps. Finally, we discuss how these methods can support long-term environment monitoring, offering insights into centuries of landscape transformation. Our repository is publicly available on GitHub .","The automatic extraction of key-value information from handwritten documents is a key challenge in document analysis. A reliable extraction is a prerequisite for the mass digitization efforts of many archives. Large Vision Language Models (LVLM) are a promising technology to tackle this problem especially in scenarios where little annotated training data is available. In this work, we present a novel dataset specifically designed to evaluate the few-shot capabilities of LVLMs. The CM1 documents are a historic collection of forms with handwritten entries created in Europe to administer the Care and Maintenance program after World War Two. The dataset establishes three benchmarks on extracting name and birthdate information and, furthermore, considers different training set sizes. We provide baseline results for two different LVLMs and compare performances to an established full-page extraction model. While the traditional full-page model achieves highly competitive performances, our experiments show that when only a few training samples are available the considered LVLMs benefit from their size and heavy pretraining and outperform the classical approach. The dataset and instructions are available under https://github.com/fabiwo6/cm1 .","Historical maps contain valuable, detailed survey data often unavailable elsewhere. Automatically extracting linear objects, such as fault lines, from scanned historical maps benefits diverse application areas, such as mining resource prediction. However, existing models encounter challenges in capturing adequate image context and spatial context. Insufficient image context leads to false detections by failing to distinguish desired linear objects from others with similar appearances. Meanwhile, insufficient spatial context hampers the accurate delineation of elongated, slender-shaped linear objects. This paper introduces the L inear Object D etection TR ansformer (LDTR), which directly generates accurate vector graphs for linear objects from scanned map images. LDTR leverages multi-scale deformable attention to capture representative image context, reducing false detections. Furthermore, LDTR\u2019s innovative N-hop connectivity component explicitly encourages interactions among nodes within an N-hop neighborhood, enabling the model to learn sufficient spatial context for generating graphs with accurate connectivity. Experiments show that LDTR improves detection precision by 6% and enhances line connectivity by 20% over state-of-the-art baselines.","Text on historical maps provides valuable information for studies in history, economics, geography, and other related fields. Unlike structured or semi-structured documents, text on maps varies significantly in orientation, reading order, shape, and placement. Many modern methods can detect and transcribe text regions, but they struggle to effectively \u201clink\u201d the recognized text fragments, e.g., determining a multi-word place name. Existing layout analysis methods model word relationships to improve text understanding in structured documents, but they primarily rely on linguistic features and neglect geometric information, which is essential for handling map text. To address these challenges, we propose LIGHT , a novel multi-modal approach that integrates linguistic, image, and geometric features for linking text on historical maps. In particular, LIGHT \u00a0includes a geometry-aware embedding module that encodes the polygonal coordinates of text regions to capture polygon shapes and their relative spatial positions on an image. LIGHT \u00a0unifies this geometric information with the visual and linguistic token embeddings from LayoutLMv3, a pretrained layout analysis model. LIGHT \u00a0uses the cross-modal information to predict the reading-order successor of each text instance directly with a bi-directional learning strategy that enhances sequence robustness. Experimental results show that LIGHT \u00a0outperforms existing methods on the ICDAR 2024/2025 MapText Competition data, demonstrating the effectiveness of multi-modal learning for historical map text linking.","Governments worldwide have enforced laws and regulations to protect digital data and ensure privacy. Data owners thus\u00a0have been granted the right to be forgotten . An integral part\u00a0of ensuring compliance requires companies to take reasonable steps\u00a0to delete user data not only from databases but also from any AI models trained on it. In addition, model owners may also need to remove data harming the model\u2019s utility, and doing so efficiently,\u00a0via Selective Forgetting, is crucial. Although extensively studied\u00a0in classification, its application to document object detection remains underexplored. This paper introduces a novel selective unlearning framework using enhanced Sharded, Isolated, Sliced, and Aggregated (SISA) training combined with an Enhanced Weighted Box Fusion\u00a0(WBF) strategy. By partitioning datasets into isolated shards and slices, we enable localized unlearning through selective sub-model retraining while mitigating performance loss via ensemble aggregation techniques. Experiments on the ICDAR 2017 POD\u00a0and Invoices datasets demonstrate that our approach achieves better aggregation performance compared to standard WBF and\u00a0soft Non-Maximum Suppression (sNMS), striking a balance between unlearning efficiency and model accuracy. These findings provide insights into scalable, privacy-preserving document AI\u00a0for real-world applications.","Federated Learning (FL) enables decentralized model training while preserving privacy, but compliance with data erasure regulations poses significant challenges. Existing federated unlearning methods suffer from high computational costs or incomplete data removal. This paper introduces a novel federated unlearning framework that integrates Asynchronous Clustered Aggregation and Federated Ensemble Learning, ensuring efficient unlearning while maintaining model accuracy. By retraining only affected clusters instead of the entire model, our approach reduces retraining overhead by 2 $$\\times $$ \u00d7 while preserving 96\u201399% accuracy. Additionally, targeted noise injection prevents residual data influence, enhancing privacy protection. Evaluations on ICDAR-POD2017 and Invoices datasets demonstrate superior performance, achieving a 4\u20135% accuracy improvement over standard clustered aggregation. Our findings bridge the gap between privacy compliance and high-performance document analysis, offering a scalable and effective solution for federated unlearning.","Online signature verification captures dynamic information during the signing process to identify and authenticate signatures. The extraction of effective signature features has been a central focus in this area of research. In this paper, a novel online signature verification model is proposed, which combines multi-scale convolution with dynamic time warping (DTW). The model extracts multi-scale features from signatures using a multi-scale convolutional network (MSCN), and adaptively weights different feature channels using a channel attention mechanism. This enables the model to extract more effective features from signatures of varying scales, thus enhancing the model\u2019s representational capacity. Furthermore, soft-DTW is used as a distance metric, and compared to DTW, soft-DTW can address the non-differentiability issue of DTW and enable end-to-end training. Experimental results demonstrate that the proposed model significantly outperforms previous methods on the DeepSignDB dataset, achieving state-of-the-art results.","This paper investigates the task of writer retrieval, which identifies documents authored by the same individual within a dataset based on handwriting similarities. While existing datasets and methodologies primarily focus on page level retrieval, we explore the impact of text quantity on writer retrieval performance by evaluating line- and word-level retrieval. We examine three state-of-the-art writer retrieval systems, including both handcrafted and deep learning-based approaches, and analyze their performance using varying amounts of text. Our experiments on the CVL and IAM dataset demonstrate that while performance decreases by 20\u201330% when only one line of text is used as query and gallery, retrieval accuracy remains above 90% of full-page performance when at least four lines are included. We further show that text-dependent retrieval can maintain strong performance in low-text scenarios. Our findings also highlight the limitations of handcrafted features in low-text scenarios, with deep learning-based methods like NetVLAD outperforming traditional VLAD encoding.","Line-level handwritten text recognition (HTR) transcribes text from scanned or photographed documents, with transformer-based models recently achieving strong performance. However, these models typically require extensive real and synthetic datasets and significant computational resources, rendering them impractical for tasks involving small, private datasets. The lack of open-source additional data further hinders fair performance comparisons. This work proposes a Dual Downsample Vision Transformer (DDViT) for HTR, relying solely on small, open-source datasets like IAM. Building on an efficient vision transformer baseline, DDViT generates two predictions via distinct downsampling layers, selecting the final output with a novel dual maps scoring method. DDViT achieves state-of-the-art character error rates (e.g., 3.34% on IAM-A, a 1.5% point improvement over prior works) across nine related studies and remains competitive with methods using additional data, demonstrating effective HTR without resource-intensive requirements.","Multi-stroke characters in scripts such as Chinese and Japanese can be highly complex, posing significant challenges for both native speakers and, especially, non-native learners. If these characters can be simplified without degrading their legibility, it could reduce learning barriers for non-native speakers, facilitate simpler and legible font designs, and contribute to efficient character-based communication systems. In this paper, we propose a framework to systematically simplify multi-stroke characters by selectively removing strokes while preserving their overall legibility. More specifically, we use a highly accurate character recognition model to assess legibility and remove those strokes that minimally impact it. Experimental results on 1,256 character classes with 5, 10, 15, and 20 strokes reveal several key findings, including the observation that even after removing multiple strokes, many characters remain distinguishable. These findings suggest the potential for more formalized simplification strategies.","Text recognition systems are essential for digitizing documents. Until now, handwritten recognition systems have been divided into two separate types: one that reads individual lines of text and the other that processes entire paragraphs. This division exists because of technical limitations, not because reading lines and paragraphs are fundamentally different tasks. While these distinct systems work well in their respective niches, this separation causes practical problems. For example, when a paragraph contains just one line of text, paragraph-reading systems typically cannot handle it properly. The management of two separate systems doubles the computer memory required, and organizations must procure two different systems that perform the same task. In this work, we present three key contributions. Firstly, our work demonstrates that the fundamental concepts of task arithmetic remain applicable despite not meeting all the prerequisites. We demonstrate that in the absence of a common pretrained model, synthetic ancestor models can be derived from existing models. Furthermore, we show that the application of task arithmetic principles yields a better synthetic ancestor model which can enhance performance across target tasks. Secondly, we present a unified model for paragraph and line-level recognition. This unified model manages to achieve a state-of-the-art paragraph Word Error Rate (WER) of 10.1% on the IAM dataset, while simultaneously maintaining a robust line WER of 11.3%. Lastly, we establish the first benchmark results where a unified model is tested on the combined paragraph and line IAM dataset.","Handwritten Chinese Text Recognition (HCTR) is challenging due to the complexity of Chinese characters, diverse writing styles, and data scarcity. Existing approaches often increase computational costs with deeper or wider CNNs, while static convolution fails to capture subtle stroke variations and complex character structures necessary for accurate recognition. To address these challenges, we propose a Star Attention-based Network (SANet) with Multi-Scale Dynamic Aggregation for HCTR. Specifically, our designed lightweight five-layer StarNet architecture reduces parameter redundancy while enhancing feature extraction and generalization. As well as for diverse handwriting styles, we introduce a novel Multi-Scale Dynamic Attention (MSDA) module that captures both global layout and fine-grained stroke details. Additionally, we also generate a synthetic dataset using geometric transformations to mitigate data scarcity. During decoding, an n-gram language model leverages contextual information for error correction, improving accuracy. Extensive experiments on CASIA-HWDB and SCUT-HCCDoc demonstrate competitive performance, with accuracy rates and correct rates of 98.12% and 98.39% on the CASIA-HWDB test set, showcasing robustness and applicability of our approach.","Existing document shadow removal methods primarily rely on Convolutional Neural Networks (CNNs) to capture local features but suffer from limited long-range dependency modeling. While Transformer-based approaches enhance global representation learning, their prohibitive computational overhead hinders deployment in large-scale document processing. Furthermore, conventional methods focus solely on pixel-level reconstruction loss optimization, neglecting the potential of contrastive learning to improve feature discrimination between positive and negative samples. To tackle these challenges, we propose the Frequency and Contrastive Learning-Driven Network (FCD-Net), a framework that integrates frequency-domain processing and contrastive learning for efficient document shadow removal. Specifically, we design the Hybrid Frequency Convolution Module (HFCM), which performs convolutional operations in both spatial and frequency domains, enabling simultaneous global context modeling and local refinement with low complexity. Additionally, we introduce the Structure-Preserving Refinement Module (SPRM) to incorporate structural priors in a gated manner, enhancing text boundary preservation and detail recovery. To further improve feature discrimination, we integrate the Frequency-Contrastive Feature Regularization (FCFR), which leverages contrastive learning in the frequency domain to enforce distinct feature representations between positive and negative samples. Extensive experiments conducted on public benchmarks and Optical Character Recognition (OCR) performance demonstrate the effectiveness of FCD-Net, achieving state-of-the-art performance while maintaining computational efficiency.","Recent advances in scene text image generation\u00a0have attracted considerable attention. However, generating complex\u00a0text with multiple attributes remains a challenging task.\u00a0Such complexities include non-planar scenes, skewed camera perspectives, and structurally intricate Chinese characters. To address\u00a0these challenges, we propose a method for Chinese character generation based on joint modeling of shape, pronunciation, and semantics (SPS-CG). Given the intrinsic interconnection between shape, pronunciation, and semantics in the evolution of Chinese characters, joint modeling of multi-dimensional features enables the model\u00a0to generate more accurate and realistic images. Additionally, we design specialized data synthesis methods for various types of complex\u00a0text to enhance the diversity of training data available to the model. The proposed approach employs a two-stage training strategy, achieving both text erasing and text generation in natural scenes. Experimental results indicate that our method demonstrates improved performance in terms of image generation accuracy and naturalness compared to existing approaches.","Modern scene text recognition systems often depend\u00a0on large end-to-end architectures that require extensive training\u00a0and are prohibitively expensive for real-time scenarios. In such cases, the deployment of heavy models becomes impractical due\u00a0to constraints on memory, computational resources, and latency.\u00a0To address these challenges, we propose a novel, training-free plug-and-play framework that leverages the strengths of pre-trained text recognizers while minimizing redundant computations.\u00a0Our approach uses context-based understanding and introduces\u00a0an attention-based segmentation stage, which refines candidate\u00a0text regions at the pixel level, improving downstream recognition. Instead of performing traditional text detection that follows\u00a0a block-level comparison between feature map and source image\u00a0and harnesses contextual information using pretrained captioners, allowing the framework to generate word predictions directly\u00a0from scene context. Candidate texts are semantically and lexically evaluated to get a final score. Predictions that meet or exceed\u00a0a pre-defined confidence threshold bypass the heavier process\u00a0of end-to-end text STR profiling, ensuring faster inference and cutting down on unnecessary computations. Experiments on public benchmarks demonstrate that our paradigm achieves performance on par\u00a0with state-of-the-art systems, yet requires substantially\u00a0fewer resources. Our code can be\u00a0found here: https://github.com/Ritabrata04/icdar2025-context-driven-str.git .","In this paper, we demonstrate a total disentanglement of font images. Total disentanglement is a neural network-based method for completely decomposing each font image into its style and content (i.e., character class) features. It uses a simple but careful training procedure to extract the common style feature from all \u2018A\u2019\u2013\u2018Z\u2019 images in the same font and the common content feature from all \u2018A\u2019 (or another class) images in different fonts. These disentangled features guarantee the reconstruction of the original font image. Various experiments have been conducted to understand the performance of total disentanglement. First, it is demonstrated that total disentanglement is achievable with very high accuracy; this is experimental proof of the long-standing open question, \u201cDoes \u2018A\u2019 exist?\u201d Hofstadter (1985). Second, it is demonstrated that the disentangled features produced by total disentanglement apply to a variety of tasks, including font recognition, character recognition, and one-shot font image generation.","We present the elaboration of Epimethee ,\u00a0a text-processing pipeline that goes from Optical Character Recognition (OCR) to Named Entity Recognition (NER) and\u00a0the cartographic representation of places mentioned in ancient literary texts. We will present the difficulties encountered when\u00a0using off-the-shelf tools for the NER and Map stages in noisy data and\u00a0the methods used to overcome them. One involves grouping different versions of NEs, for example Besan\u00e7on , Besangon or besanqon , using a clustering algorithm. We present the assessment for several clustering algorithms. The analysis of spatial NEs with Epimethee \u00a0lead researchers to better understand, represent and deepen the stakes\u00a0of a novel by observing the diegetic landscapes proposed by literary authors.","Learning to interpret sheet music and play musical instruments (piano) remains a significant challenge for beginners, often requiring extensive practice and guidance. Existing platforms lack real-time feedback and seamless sheet music interpretation, creating inefficiencies that require a system for accurate\u00a0note recognition, intuitive guidance, and reduced cognitive load.\u00a0To address this, we propose a novel system that integrates optical music recognition (OMR) and virtual reality (VR) to create\u00a0an immersive piano learning environment. The proposed approach improves the detection of musical notes by making it scale and rotation invariant. The detected notes are converted into the corresponding piano keys and sequential instructions. These instructions are\u00a0then visualized in a VR environment in Meta Quest 3, where a virtual piano highlights keys dynamically to guide the user.\u00a0The experimental results demonstrate high accuracy in note detection\u00a0and significant improvements in the learning curve for beginners, reducing cognitive load, and bridging the gap between sheet\u00a0music interpretation and piano playing. This work highlights the potential of combining document image analysis and VR technologies\u00a0to revolutionize music education, as well as other related fields, offering a scalable and accessible solution.","Currently, document parsing technology is facing\u00a0the problem of \u201ctask silos\u201d caused by fragmented datasets. With\u00a0the widespread application of deep learning in document understanding, the construction of a unified and shared dataset for collaborative development of upstream and downstream tasks has become\u00a0an inevitable trend. We have built the first UniOne document dataset that supports the parsing of upstream and downstream tasks.\u00a0By systematically integrating tasks such as layout analysis, text\u00a0line detection and recognition, and table recognition, we\u00a0have innovatively established a cross-task annotation dataset.\u00a0This dataset: (1) at the layout analysis level, includes 236,790 paragraph-level annotations across 14,481 pages, covering\u00a011 semantic categories; (2) at the text line detection level, based\u00a0on the layout analysis data, further adds fine-grained annotations\u00a0for 340,890 lines in 198,901 text paragraphs; (3) for complex scenarios, it introduces 8,000 challenging handwritten mathematical expressions, 18,717 printed mathematical formulas, 26,849 formula texts with unified recognition annotations, and 1,169 tables extracted from papers to fully support document content parsing.\u00a0To our knowledge, this dataset is the first to achieve cross-task\u00a0joint modeling from macro layouts to micro elements, breaking through\u00a0the limitations of traditional single-task datasets and providing essential infrastructure for building the next generation\u00a0of intelligent document parsing systems. The UniOne dataset can\u00a0be accessed here: https://github.com/MaxTEX310/UniOne .","Table structure recognition (TSR) and optical character recognition (OCR) play crucial roles in extracting structured\u00a0data from tables in scientific documents. However, existing extraction frameworks built on top of TSR and OCR methods often fail\u00a0to quantify the uncertainties of extracted results. To obtain highly accurate data for scientific domains, all extracted data must\u00a0be manually verified, which can be time-consuming and labor-intensive. We propose a framework that performs uncertainty-aware\u00a0data extraction for complex scientific tables, built on conformal prediction, a model-agnostic method for uncertainty quantification (UQ). We explored various uncertainty scoring methods to aggregate the uncertainties introduced by TSR and OCR. We rigorously evaluated the framework using a standard benchmark and an in-house dataset consisting of complex scientific tables in six scientific domains. The results demonstrate the effectiveness of using UQ for extraction error detection, and by manually verifying only 47% of extraction results, the data quality can be improved by 30%. Our\u00a0work quantitatively demonstrates the role of UQ with the potential\u00a0of improving the efficiency in the human-machine cooperation process\u00a0to obtain scientifically usable data from complex tables in scientific documents. All code and data are available on GitHub\u00a0at https://github.com/lamps-lab/TSR-OCR-UQ/tree/main .","In this study, we propose a novelty detection algorithm to enhance the performance of end-to-end few-shot document classification in real applications. The novelty detector eliminates ambiguous results and improves the precision of the final outcome. The detector can be integrated with various types of few-shot classifiers. The proposed method is evaluated on both private and public administrative datasets. Experimental results indicate that our proposed novelty detector efficiently removes ambiguous results of not only from few-shot categories but also from base categories, thereby significantly improving the precision across all categories. Furthermore, the best-performing few-shot classifier, when combined with our detector, reduces the error rate on the private dataset from 2.66% to only 0.96%, while maintaining a high recall of 95.64%. On the public RVL-CDIP dataset, the detector significantly lowers the error rate from 40%, which is impractical, to just 4.64%, making it feasible for real-world applications.","Intent classification in question answering systems\u00a0is vital for providing accurate and relevant answers. In the area\u00a0of apple pest and disease inquiries, challenges are presented\u00a0by semantic complexity and word-order dependency. To tackle\u00a0these obstacles, we proposed an Attention-enhanced Bidirectional\u00a0Gated Recurrent Unit and Multi-level Convolutional Neural Network (Att-BiGRU-MulCNN) model. First, the Bidirectional Gated Recurrent Unit (BiGRU) is utilized to capture the temporal dependencies\u00a0in farmers\u2019 queries. It models the semantic relationships within\u00a0these queries. Concurrently, an attention mechanism is integrated into\u00a0the BiGRU, which is pivotal in highlighting the key features, ensuring that the model focuses on the most relevant information. Subsequently, at the classification layer, a Multi-level Convolutional Neural Network (MulCNN) is incorporated. The MulCNN capitalizes on multi-level convolutional kernels to extract\u00a0local semantic features from the queries. This extraction process bolsters the model\u2019s discriminative ability, enabling it to efficiently distinguish between diverse intent categories. Finally, the proposed Att-BiGRU-MulCNN model is evaluated on a self-constructed dataset. This dataset comprises 47,762 apple-related queries, which\u00a0were manually labeled into nine predefined intent categories.\u00a0The experiment results demonstrate that the proposed approach outperforms five benchmark intent classification models in terms\u00a0of accuracy, recall, and F1 score. The Att-BiGRU-MulCNN\u00a0model accomplishes precise intent recognition in the domain of apple\u00a0pest and disease inquiries, thereby providing a reliable solution to\u00a0this problem.","Handwriting exhibits distinctive individual characteristics, making it a crucial biometric modality for forensic document examination and legal authentication. In this paper,\u00a0we propose a graph convolutional teacher-student framework for writer inspection using single handwritten word samples. Our approach integrates both writer identification and verification networks\u00a0to enhance reliability and robustness. We first train a teacher\u00a0model for writer identification and then distill its knowledge into\u00a0a student model for writer verification. Both models leverage\u00a0Graph Convolutional Networks (GCNs) to learn discriminative writer-specific representations from handwriting graph structures. To evaluate our approach, we introduce a new dataset comprising intra-variable handwritten word samples collected intermittently over several months. This dataset contains 79 distinct English words, each written 6 times by 100 different writers, resulting in a total of 47400 handwritten word images. Additionally,\u00a
